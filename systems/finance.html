<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>财务系统｜服装企业账款与盈亏管理</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f5f8fd;
      --surface-hover: #f3f7ff;
      --text: #172033;
      --text-2: #5e6b82;
      --text-3: #78869d;
      --line: #e5ebf4;
      --line-strong: #cbd7e8;
      --control-line: #aebdd2;
      --sage: #08a88a;
      --sage-bg: linear-gradient(135deg, #dcfce7, #dff6ff);
      --blue: #2563eb;
      --blue-bg: linear-gradient(135deg, #dbeafe, #ede9fe);
      --rose: #e54868;
      --rose-bg: linear-gradient(135deg, #ffe4e6, #fae8ff);
      --ochre: #d97706;
      --ochre-bg: linear-gradient(135deg, #fef3c7, #ffedd5);
      --plum: #8b5cf6;
      --plum-bg: linear-gradient(135deg, #ede9fe, #fce7f3);
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 48%, #7c3aed 100%);
      --primary-gradient-hover: linear-gradient(135deg, #1d4ed8 0%, #2563eb 48%, #6d28d9 100%);
      --shadow: 0 1px 2px rgba(37, 99, 235, .04), 0 10px 30px rgba(37, 99, 235, .07);
      --radius-sm: 9px;
      --radius-md: 13px;
      --radius-lg: 18px;
      --sidebar: 236px;
      --topbar: 72px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
      flex: 0 0 auto;
      font-weight: 590;
      transition: background-color .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    button:hover, .btn:hover { transform: translateY(-1px); }
    button:active, .btn:active { transform: translateY(0); }
    button:disabled, .btn:disabled { opacity: .48; cursor: not-allowed; transform: none; }
    :focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    a { color: inherit; }
    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
    }
    .skip-link {
      position: fixed; top: 8px; left: 8px; z-index: 300;
      padding: 9px 12px; background: var(--text); color: #fff; border-radius: 8px;
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }
    .money { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .muted { color: var(--text-2); }
    .subtle { color: var(--text-3); }
    .danger-text { color: var(--rose); }
    .positive-text { color: var(--sage); }

    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      background: #ffffff;
      border-right: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 7px 20px;
      min-width: 0;
    }
    .brand-mark {
      width: 36px; height: 36px; flex: 0 0 36px;
      display: grid; place-items: center;
      border-radius: 11px;
      background: var(--primary-gradient);
      color: #fff;
      font-size: 18px;
      font-weight: 760;
      line-height: 1;
      box-shadow: 0 6px 16px rgba(37,99,235,.24);
    }
    .brand-title { font-size: 15px; font-weight: 720; letter-spacing: .02em; white-space: nowrap; }
    .brand-subtitle { margin-top: 1px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
    .nav-section-label {
      padding: 14px 10px 6px;
      color: var(--text-3);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .08em;
    }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      width: 100%; min-height: 41px; justify-content: flex-start;
      padding: 0 10px;
      color: var(--text-2);
      border-radius: 9px;
      font-weight: 540;
    }
    .nav-item:hover { background: #f3f7ff; color: var(--blue); transform: none; }
    .nav-item.active { background: linear-gradient(135deg, #eaf3ff, #f2edff); color: #1d4ed8; box-shadow: 0 4px 14px rgba(37,99,235,.09); }
    .nav-icon {
      width: 23px; height: 23px; flex: 0 0 23px;
      display: grid; place-items: center;
      border-radius: 7px;
      background: #f3f7ff;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 690;
    }
    .nav-item.active .nav-icon { background: var(--primary-gradient); color: #fff; }
    .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-count {
      margin-left: auto;
      min-width: 21px; height: 20px; padding: 0 6px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; background: #eef4ff;
      color: var(--text-2); font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .sidebar-footer { margin-top: auto; display: grid; gap: 10px; }
    .local-note {
      padding: 11px 12px;
      border: 1px solid #d8e5fa;
      border-radius: 11px;
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      color: #48617f;
      font-size: 11px;
    }
    .local-note strong { display: block; margin-bottom: 2px; font-size: 12px; }
    .local-dot {
      display: inline-block; width: 7px; height: 7px; margin-right: 6px;
      border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.13);
    }
    .saved-time { color: var(--text-3); }

    .topbar {
      position: fixed;
      top: 0; right: 0; left: var(--sidebar);
      z-index: 40;
      height: var(--topbar);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 26px;
      border-bottom: 1px solid rgba(229,235,244,.92);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .mobile-brand { display: none; font-weight: 720; white-space: nowrap; }
    .search-box { position: relative; width: min(370px, 34vw); }
    .search-box::before {
      content: "⌕";
      position: absolute; left: 12px; top: 50%; transform: translateY(-52%);
      color: var(--text-3); font-size: 19px; pointer-events: none;
    }
    .search-input,
    .month-input,
    .control-input,
    .control-select,
    .control-textarea {
      width: 100%;
      border: 1px solid var(--control-line);
      border-radius: 10px;
      background: rgba(255,255,255,.82);
      color: var(--text);
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .search-input { height: 40px; padding: 0 13px 0 38px; }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus,
    .month-input:focus,
    .control-input:focus,
    .control-select:focus,
    .control-textarea:focus {
      outline: none; border-color: #60a5fa; background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    .search-input:focus-visible,
    .month-input:focus-visible,
    .control-input:focus-visible,
    .control-select:focus-visible,
    .control-textarea:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 1px;
    }
    .mobile-search-toggle { display: none; }
    .topbar-spacer { flex: 1; }
    .month-control { display: flex; align-items: center; gap: 7px; }
    .month-input { width: 144px; height: 40px; padding: 0 10px; }
    .icon-btn { width: 38px; padding: 0; border-color: var(--line); background: rgba(255,255,255,.74); color: var(--text-2); }
    .icon-btn:hover { background: #fff; border-color: var(--line-strong); }
    .btn-primary { background: var(--primary-gradient); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(37,99,235,.24); }
    .btn-primary:hover { background: var(--primary-gradient-hover); box-shadow: 0 8px 20px rgba(37,99,235,.3); }
    .btn-secondary { background: var(--surface); border-color: var(--line); color: var(--text); }
    .btn-secondary:hover { border-color: var(--line-strong); }
    .btn-soft { background: linear-gradient(135deg, #dcfce7, #dbeafe); color: #087c70; }
    .btn-soft:hover { background: linear-gradient(135deg, #bbf7d0, #bfdbfe); }
    .btn-danger { background: var(--rose-bg); color: var(--rose); }
    .btn-danger:hover { background: linear-gradient(135deg, #fecdd3, #f5d0fe); }
    .btn-ghost { color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-soft); color: var(--text); }
    .btn-small { min-height: 30px; padding: 0 9px; border-radius: 8px; font-size: 12px; }

    .main-content {
      min-height: 100vh;
      margin-left: var(--sidebar);
      padding: calc(var(--topbar) + 28px) 28px 48px;
    }
    .content-inner { width: min(1500px, 100%); margin: 0 auto; }
    .page-heading {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
      margin-bottom: 22px;
    }
    .page-heading h1 { margin: 0; font-size: clamp(23px, 2vw, 30px); line-height: 1.2; letter-spacing: -.035em; }
    .page-heading p { margin: 7px 0 0; color: var(--text-2); }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .eyebrow { margin-bottom: 7px; color: var(--text-3); font-size: 11px; font-weight: 680; letter-spacing: .08em; text-transform: uppercase; }

    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 14px; }
    .metric-card {
      position: relative; min-width: 0; min-height: 151px; padding: 19px;
      overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: var(--surface);
      background: linear-gradient(145deg, #fff 0%, #fff 72%, color-mix(in srgb, var(--accent, var(--blue)) 8%, #fff) 100%);
      box-shadow: var(--shadow);
    }
    .metric-card::after {
      content: ""; position: absolute; top: 0; right: 0; width: 54px; height: 4px;
      border-radius: 0 0 0 8px;
      background: var(--accent, var(--blue));
      background: linear-gradient(90deg, var(--accent, var(--blue)), color-mix(in srgb, var(--accent, var(--blue)) 52%, #7c3aed));
    }
    .metric-label { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; font-weight: 560; }
    .metric-symbol { width: 8px; height: 8px; border-radius: 50%; background: var(--accent, var(--blue)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--blue)) 13%, transparent); }
    .metric-value { margin-top: 18px; font-size: clamp(24px, 2.35vw, 34px); font-weight: 720; line-height: 1; letter-spacing: -.05em; }
    .metric-meta { margin-top: 13px; color: var(--text-2); font-size: 12px; }
    .metric-meta strong { color: var(--text); font-weight: 630; }

    .insight-strip {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 14px;
      border: 1px solid var(--line); border-radius: var(--radius-md); background: #fff;
    }
    .insight-item { min-width: 0; padding: 13px 16px; border-right: 1px solid var(--line); }
    .insight-item:last-child { border-right: 0; }
    .insight-label { color: var(--text-3); font-size: 11px; }
    .insight-value { margin-top: 3px; font-weight: 650; font-variant-numeric: tabular-nums; }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 14px; }
    .stack { display: grid; gap: 14px; align-content: start; }
    .panel {
      min-width: 0; padding: 19px;
      border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: var(--surface); box-shadow: var(--shadow);
    }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .panel-title { margin: 0; font-size: 15px; font-weight: 690; letter-spacing: -.01em; }
    .panel-note { margin-top: 4px; color: var(--text-3); font-size: 11px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; color: var(--text-2); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .legend i { width: 8px; height: 8px; border-radius: 3px; background: var(--legend); }
    .chart-wrap { overflow-x: auto; padding: 4px 0 0; }
    .bar-chart {
      min-width: 540px; height: 232px;
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
      align-items: end; padding: 12px 6px 0;
      border-bottom: 1px solid var(--line);
      background-image: linear-gradient(to bottom, transparent 24%, rgba(203,215,232,.55) 25%, transparent 26%, transparent 49%, rgba(203,215,232,.55) 50%, transparent 51%, transparent 74%, rgba(203,215,232,.55) 75%, transparent 76%);
    }
    .bar-group { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
    .bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
    .bar { width: min(24px, 34%); min-height: 2px; border-radius: 6px 6px 2px 2px; background: var(--bar); background: linear-gradient(to top, var(--bar), color-mix(in srgb, var(--bar) 58%, #fff)); transition: height .25s ease; }
    .bar-label { color: var(--text-3); font-size: 11px; white-space: nowrap; }
    .chart-summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-top: 16px;
    }
    .chart-summary div { padding: 10px 11px; border-radius: 10px; background: var(--surface-soft); }
    .chart-summary span { display: block; color: var(--text-3); font-size: 10px; }
    .chart-summary strong { display: block; margin-top: 3px; font-size: 13px; }

    .progress-list { display: grid; gap: 15px; }
    .progress-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 12px; }
    .progress-head span:last-child { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: var(--surface-soft); }
    .progress-bar { height: 100%; border-radius: inherit; background: var(--fill, var(--blue)); background: linear-gradient(90deg, var(--fill, var(--blue)), color-mix(in srgb, var(--fill, var(--blue)) 52%, #7c3aed)); }
    .empty-mini { padding: 28px 12px; text-align: center; color: var(--text-3); }

    .todo-list { display: grid; gap: 3px; }
    .todo-item {
      display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 10px;
      padding: 10px 8px; border-radius: 10px;
    }
    .todo-item:hover { background: var(--surface-hover); }
    .todo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--ochre)); }
    .todo-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 590; }
    .todo-meta { color: var(--text-3); font-size: 11px; }
    .todo-amount { text-align: right; white-space: nowrap; font-weight: 630; font-variant-numeric: tabular-nums; }

    .filter-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      margin-bottom: 12px; padding: 9px;
      border: 1px solid var(--line); border-radius: 12px; background: #fff;
    }
    .filter-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-btn { min-height: 31px; padding: 0 10px; color: var(--text-2); font-size: 12px; font-weight: 540; }
    .filter-btn:hover { transform: none; background: var(--surface); }
    .filter-btn.active { background: linear-gradient(135deg, #eaf3ff, #f2edff); color: #1d4ed8; border-color: #cfddf4; box-shadow: 0 3px 10px rgba(37,99,235,.08); }
    .filter-spacer { flex: 1; }
    .record-count { padding: 0 7px; color: var(--text-3); font-size: 12px; white-space: nowrap; }

    .table-panel { padding: 0; overflow: hidden; }
    .invoice-record-panel { padding: 0; overflow: hidden; }
    .table-scroller { width: 100%; max-height: min(68vh, 720px); overflow: auto; overscroll-behavior: contain; }
    .data-table { width: 100%; min-width: 1080px; border-collapse: separate; border-spacing: 0; }
    .data-table caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .data-table th {
      position: sticky; top: 0; z-index: 2;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      background: #f7faff; color: var(--text-3);
      font-size: 11px; font-weight: 640; text-align: left; letter-spacing: .02em; white-space: nowrap;
    }
    .data-table td { padding: 13px 14px; border-bottom: 1px solid #edf1f7; vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table tbody tr { transition: background-color .14s ease; }
    .data-table tbody tr:hover { background: var(--surface-hover); }
    .data-table .cell-money { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .data-table th.cell-money { text-align: right; }
    .cell-primary { font-weight: 620; }
    .cell-secondary { margin-top: 2px; color: var(--text-3); font-size: 11px; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .table-actions { display: flex; justify-content: flex-end; gap: 4px; white-space: nowrap; }
    .status {
      display: inline-flex; align-items: center; gap: 5px;
      min-height: 25px; padding: 0 8px; border-radius: 999px;
      font-size: 11px; font-weight: 620; white-space: nowrap;
      background: var(--status-bg, var(--surface-soft)); color: var(--status-color, var(--text-2));
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .72; }
    .status.success { --status-bg: var(--sage-bg); --status-color: #087c70; }
    .status.info { --status-bg: var(--blue-bg); --status-color: #2459b8; }
    .status.warn { --status-bg: var(--ochre-bg); --status-color: #a45b05; }
    .status.danger { --status-bg: var(--rose-bg); --status-color: #c73558; }
    .status.neutral { --status-bg: linear-gradient(135deg, #f1f5f9, #eef2ff); --status-color: #64748b; }
    .tax-tag { display: inline-flex; padding: 2px 7px; border-radius: 6px; background: var(--plum-bg); color: var(--plum); font-size: 11px; white-space: nowrap; }

    .mobile-records { display: none; }
    .record-card { padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
    .record-card + .record-card { margin-top: 10px; }
    .record-card-head { display: flex; justify-content: space-between; gap: 12px; }
    .record-card-head > div { min-width: 0; }
    .record-card-head > strong { overflow: visible; white-space: nowrap; flex-shrink: 0; font-size: clamp(12px, 3.2vw, 15px); }
    .record-card-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 660; }
    .record-card-no { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: 11px; }
    .record-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 15px 0; }
    .record-card-grid span { display: block; color: var(--text-3); font-size: 10px; }
    .record-card-grid strong { display: block; max-width: 100%; margin-top: 2px; overflow-x: auto; font-size: clamp(11px, 3vw, 13px); white-space: nowrap; scrollbar-width: none; }
    .record-card-status { display: flex; flex-wrap: wrap; gap: 6px; }
    .record-card-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }

    .empty-state { padding: 64px 24px; text-align: center; }
    .empty-symbol {
      width: 52px; height: 52px; margin: 0 auto 13px;
      display: grid; place-items: center; border-radius: 15px;
      background: var(--surface-soft); color: var(--text-3); font-family: "Songti SC", serif; font-size: 20px;
    }
    .empty-state h3 { margin: 0; font-size: 16px; }
    .empty-state p { margin: 6px auto 17px; max-width: 390px; color: var(--text-2); }

    .data-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .data-card { min-height: 210px; display: flex; flex-direction: column; }
    .data-card h2 { margin: 0; font-size: 16px; }
    .data-card p { margin: 8px 0 18px; color: var(--text-2); }
    .data-card .data-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .excel-export-card .data-actions { margin-top: auto; padding-top: 18px; }
    .data-stat { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 10px 0 18px; }
    .data-stat div { padding: 10px; border-radius: 9px; background: var(--surface-soft); }
    .data-stat span { display: block; color: var(--text-3); font-size: 10px; }
    .data-stat strong { display: block; margin-top: 2px; }
    .formula-note { padding: 12px 13px; border-radius: 10px; background: var(--blue-bg); color: #395b8a; font-size: 12px; }

  <script>
  (() => {
    "use strict";

    const STORE_KEY = "portfolio-finance-v1";
    const RECOVERY_KEY = "portfolio-finance-v1-recovery";
    const LOCK_DB_NAME = "portfolio-finance-v1-coordination";
    const LOCK_STORE_NAME = "write-locks";
    const STORE_VERSION = 3;
    const DEMO_MONTH = "2026-10";
    const DEMO_TODAY = "2026-10-23";
    function createPortfolioStorage() {
      const memory = new Map();
      let persistent = true;
      try {
        const probe = `${STORE_KEY}-probe`;
        globalThis.localStorage.setItem(probe, "1");
        globalThis.localStorage.removeItem(probe);
      } catch (_) { persistent = false; }
      return {
        get persistent() { return persistent; },
        getItem(key) {
          if (persistent) {
            try {
              const value = globalThis.localStorage.getItem(key);
              if (value != null) memory.set(key, value);
              return value;
            } catch (_) { persistent = false; }
          }
          return memory.get(key) ?? null;
        },
        setItem(key, value) {
          const serialized = String(value);
          memory.set(key, serialized);
          if (persistent) {
            try { globalThis.localStorage.setItem(key, serialized); }
            catch (_) { persistent = false; }
          }
        }
      };
    }
    const demoStorage = createPortfolioStorage();
    const TAX_RATES = [0, 100, 300, 600, 900, 1300];
    const EXPENSE_CATEGORY_GROUPS = [
      { label: "服装业务费用", items: ["大货费用", "打版打样费用", "快递运费", "采购费用"] },
      { label: "日常固定费用", items: ["人工薪酬", "场地租金", "水电物业"] },
      { label: "其他经营费用", items: ["营销推广", "办公管理", "其他费用"] }
    ];
    const EXPENSE_CATEGORIES = EXPENSE_CATEGORY_GROUPS.flatMap(group => group.items);
    const PAYMENT_METHODS = ["银行转账", "微信", "支付宝", "现金", "承兑", "其他"];
    const INVOICE_TYPES = ["增值税专用发票", "增值税普通发票", "电子普通发票", "其他"];

    const viewContainer = document.getElementById("viewContainer");
    const monthPicker = document.getElementById("monthPicker");
    const globalSearch = document.getElementById("globalSearch");
    const recordDialog = document.getElementById("recordDialog");
    const recordForm = document.getElementById("recordForm");
    const confirmDialog = document.getElementById("confirmDialog");
    const backupInput = document.getElementById("backupInput");
    const employeeImportInput = document.getElementById("employeeImportInput");
    const toastRegion = document.getElementById("toastRegion");

    let loadNotice = "";
    let saveFeedback = { phase: "saved", message: "" };
    let confirmAction = null;
    let lastTrigger = null;
    const ui = {
      view: "dashboard",
      month: currentMonth(),
      query: "",
      status: "all",
      invoiceStatus: "all",
      category: "all",
      listAll: false
    };

    function nowISO() {
      return new Date().toISOString();
    }

    function localDateISO(date = new Date(`${DEMO_TODAY}T12:00:00`)) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function currentMonth() {
      return DEMO_MONTH;
    }

    function shiftMonth(month, delta) {
      const [year, mon] = month.split("-").map(Number);
      const date = new Date(year, mon - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function dateInMonth(month, day) {
      const [year, mon] = month.split("-").map(Number);
      const max = new Date(year, mon, 0).getDate();
      return `${month}-${String(Math.min(day, max)).padStart(2, "0")}`;
    }

    function toCents(value) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.round(number * 100) : 0;
    }

    function inputMoney(cents) {

      if (/^demo-(?:oct-\d{2}|sep-\d{2}|history-\d{6})$/.test(item.id || "") && /^DEMO-\d{6}-\d+$/.test(item.billNo || "")) {
        item = { ...item, billNo: `FIN-${item.billNo}` };
      }
      const hasQuantity = Object.prototype.hasOwnProperty.call(item, "quantity");
      const hasUnitPrice = Object.prototype.hasOwnProperty.call(item, "unitPriceCents");
      if (hasQuantity || hasUnitPrice) return item;
      return {
        ...item,
        quantity: 1,
        unitPriceCents: item.amountCents
      };
    }

    function normalizeState(value) {
      const archivedRecords = Array.isArray(value?.archivedRecords) ? value.archivedRecords.map(entry => {
        if (!entry || typeof entry !== "object") return entry;
        if (entry.archivedType === "bill") return { ...entry, record: normalizeBillRecord(entry.record) };
        if (entry.archivedType === "invoice") {
          const { billSnapshot, ...rest } = entry;
          return {
            ...rest,
            record: normalizeInvoiceRecord(entry.record),
            billSnapshots: Array.isArray(entry.billSnapshots)
              ? entry.billSnapshots
              : billSnapshot && typeof billSnapshot === "object" ? [billSnapshot] : []
          };
        }
        return entry;
      }) : [];
      return {
        ...value,
        version: [1, 2, STORE_VERSION].includes(value?.version) ? STORE_VERSION : value?.version,
        revision: Number.isSafeInteger(value?.revision) && value.revision >= 0 ? value.revision : 0,
        bills: Array.isArray(value?.bills) ? value.bills.map(normalizeBillRecord) : value?.bills,
        expenses: Array.isArray(value?.expenses) ? value.expenses.map(item => /^demo-exp-/.test(item?.id || "") && typeof item.description === "string"
          ? { ...item, description: item.description.replace(/(^|[^A-Z-])DEMO-(\d{6}-\d+)/g, "$1FIN-DEMO-$2") } : item) : value?.expenses,
        invoices: Array.isArray(value?.invoices) ? value.invoices.map(normalizeInvoiceRecord) : value?.invoices,
        archivedRecords
      };
    }

    function loadState() {
      let raw = "";
      try {
        raw = demoStorage.getItem(STORE_KEY) || "";
        if (!raw) {
          const demo = makeDemoState();
          demoStorage.setItem(STORE_KEY, JSON.stringify(demo));
          loadNotice = demoStorage.persistent ? "已载入虚拟示例账本，可自由操作" : "已载入虚拟示例账本，修改仅保留在本次演示";
          return demo;
        }
        const parsed = normalizeState(JSON.parse(raw));
        if (!isValidState(parsed)) throw new Error("数据结构不兼容");
        return parsed;
      } catch (error) {
        const fallback = makeDemoState();
        if (raw) {
          try {
            demoStorage.setItem(RECOVERY_KEY, raw);
            demoStorage.setItem(STORE_KEY, JSON.stringify(fallback));
          } catch (recoveryError) { /* Storage may be unavailable entirely. */ }
        }
        loadNotice = raw ? "演示数据异常，已保留恢复副本并重新载入虚拟示例" : "已载入临时虚拟示例账本";
        saveFeedback = { phase: "warning", message: raw ? "已恢复为虚拟示例账本。" : "修改仅保留在本次演示，可导出备份。" };
        return fallback;
      }
    }

    let state = loadState();
    let persistedSnapshot = JSON.stringify(state);

    function withIndexedDBWriteLock(commit) {
      return new Promise((resolve, reject) => {
        let request;
        try {
          request = globalThis.indexedDB.open(LOCK_DB_NAME, 1);
        } catch (error) {
          reject(error);
          return;
        }
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(LOCK_STORE_NAME)) {
            request.result.createObjectStore(LOCK_STORE_NAME, { keyPath: "name" });
          }
        };
        request.onerror = () => reject(request.error || new Error("无法打开浏览器写锁"));
        request.onsuccess = () => {
          const database = request.result;
          let result = false;
          let commitCompleted = false;
          let actionError = null;
          let transaction;
          try {
            transaction = database.transaction(LOCK_STORE_NAME, "readwrite");
            const store = transaction.objectStore(LOCK_STORE_NAME);
            const turn = store.get(STORE_KEY);
            turn.onsuccess = () => {
              try {
                result = commit();
                commitCompleted = true;
                store.put({ name: STORE_KEY, touchedAt: nowISO() });
              } catch (error) {
                actionError = error;
                transaction.abort();
              }
            };
            turn.onerror = () => {
              actionError = turn.error || new Error("无法取得浏览器写锁");
              transaction.abort();
            };
            transaction.oncomplete = () => {
              database.close();
              resolve(result);
            };
            transaction.onabort = () => {
              database.close();
              if (commitCompleted) resolve(result);
              else reject(actionError || transaction.error || new Error("浏览器写锁已中止"));
            };
            transaction.onerror = () => { /* onabort reports the final error. */ };
          } catch (error) {
            database.close();
            reject(error);
          }
        };
      });
    }

    async function withLedgerWriteLock(commit) {
      // The isolated demo can keep working in opaque srcdoc/file origins.
      if (!demoStorage.persistent) return commit();
      if (globalThis.navigator?.locks?.request) {
        try { return await globalThis.navigator.locks.request(`${STORE_KEY}-write`, { mode: "exclusive" }, commit); }
        catch (_) { /* Try the independent IndexedDB lock next. */ }
      }
      if (globalThis.indexedDB) {
        try { return await withIndexedDBWriteLock(commit); }
        catch (_) { /* Restricted offline origins retain optimistic revision checks. */ }
      }
      return commit();
    }

    async function saveState(message = "已保存到此浏览器") {
      const proposedSnapshot = JSON.stringify(state);
      const baseSnapshot = persistedSnapshot;
      setSaveFeedback("saving");
      const commit = () => {
        try {
          const base = normalizeState(JSON.parse(baseSnapshot));
          const proposed = normalizeState(JSON.parse(proposedSnapshot));
          const storedRaw = demoStorage.getItem(STORE_KEY);
          if (storedRaw) {
            const stored = normalizeState(JSON.parse(storedRaw));
            if (!isValidState(stored)) throw new Error("本地数据已损坏");
            const latest = stored;
            if (latest.revision !== base.revision || JSON.stringify(latest) !== JSON.stringify(base)) {
              state = latest;
              persistedSnapshot = JSON.stringify(latest);
              const interruptedEdit = Boolean(recordDialog.open || confirmDialog.open);
              if (recordDialog.open) recordDialog.close();
              if (confirmDialog.open) {
                confirmAction = null;
                confirmDialog.close();
              }
              setSaveFeedback("warning", "另一页面已更新账本，本次修改未保存，请重新操作。");
              render();
              toast(interruptedEdit
                ? "另一页面已先保存新数据，当前编辑已关闭并同步最新账本，请重新操作"
                : "另一页面已先保存新数据，本页已同步最新账本，请重新操作", "error", 5600);
              return false;
            }
          }
          if (base.revision >= Number.MAX_SAFE_INTEGER) throw new Error("账本版本号已达到安全上限");
          proposed.revision = base.revision + 1;
          proposed.updatedAt = nowISO();
          if (!isValidState(proposed)) throw new Error("待保存数据未通过完整性校验");
          const serialized = JSON.stringify(proposed);
          demoStorage.setItem(STORE_KEY, serialized);
          state = proposed;
          persistedSnapshot = serialized;
        } catch (error) {
          state = normalizeState(JSON.parse(persistedSnapshot || baseSnapshot));
          setSaveFeedback("error", "本次修改未保存，请导出备份并检查浏览器存储。");
          toast("保存失败：本地数据可能已变化或浏览器空间不足，请先导出备份并刷新页面", "error", 5600);
          return false;
        }
        try {
          setSaveFeedback("saved");
          if (message) toast(message, "success");
        } catch (notificationError) { /* The data is already durable; UI feedback must not change the result. */ }
        return true;
      };
      try {
        return await withLedgerWriteLock(commit);
      } catch (error) {
        state = normalizeState(JSON.parse(persistedSnapshot || baseSnapshot));
        setSaveFeedback("error", "无法建立安全写锁，本次修改未保存，请先导出备份。");
        toast("保存失败：当前浏览器无法建立安全写锁，请改用最新版浏览器并先导出备份", "error", 6000);
        return false;
      }
    }

    function taxDetails(record) {
      const input = Math.max(0, Number(record?.amountCents) || 0);
      const mode = record?.taxMode || "no_tax";
      const rate = mode === "no_tax" ? 0 : Math.max(0, Number(record?.taxRateBps) || 0);
      if (mode === "included") {
        const net = Math.round(input * 10000 / (10000 + rate));
        return { input, net, tax: input - net, gross: input, rate, mode };
      }
      if (mode === "excluded") {
        const tax = Math.round(input * rate / 10000);
        return { input, net: input, tax, gross: input + tax, rate, mode };
      }
      return { input, net: input, tax: 0, gross: input, rate: 0, mode: "no_tax" };
    }

    function billById(id) {
      return state.bills.find(item => item.id === id);
    }

    function paymentsForBill(id, exceptId = "") {
      return state.payments.filter(item => item.billId === id && item.id !== exceptId);
    }

    function invoicesForBill(id, exceptId = "") {
      return state.invoices.flatMap(invoice => {
        if (invoice.id === exceptId) return [];
        const allocation = invoice.allocations.find(item => item.billId === id);
        return allocation ? [{ ...invoice, amountCents: allocation.amountCents, allocation }] : [];
      });
    }

    function archivedRecordsFor(type) {
      return (state.archivedRecords || []).filter(item => item.archivedType === type);
    }

    function billHasFinancialHistory(id) {
      return paymentsForBill(id).length > 0
        || invoicesForBill(id).length > 0
        || archivedRecordsFor("payment").some(item => item.record?.billId === id)
        || archivedRecordsFor("invoice").some(item => item.record?.allocations?.some(allocation => allocation.billId === id));
    }

    function businessKeyExists(type, key, value, exceptId = "") {
      const normalized = String(value || "").trim().toLocaleLowerCase("zh-CN");
      if (!normalized) return false;
      const active = type === "bill" ? state.bills : state.invoices;
      const activeMatch = active.some(item => item.id !== exceptId && String(item[key] || "").trim().toLocaleLowerCase("zh-CN") === normalized);
      const archivedMatch = archivedRecordsFor(type).some(item => item.record?.id !== exceptId
        && String(item.record?.[key] || "").trim().toLocaleLowerCase("zh-CN") === normalized);
      const childSnapshotMatch = type === "bill" && (state.archivedRecords || []).some(item => {
        const snapshots = item.archivedType === "payment"
          ? item.billSnapshot ? [item.billSnapshot] : []
          : item.archivedType === "invoice" ? item.billSnapshots || [] : [];
        return snapshots.some(snapshot => snapshot.id !== exceptId
          && String(snapshot.billNo || "").trim().toLocaleLowerCase("zh-CN") === normalized);
      });
      return activeMatch || archivedMatch || childSnapshotMatch;
    }

    function sumCents(items, getter = item => item.amountCents) {
      return items.reduce((sum, item) => sum + (Number(getter(item)) || 0), 0);
    }

    function paidCents(billId, exceptId = "") {
      return sumCents(paymentsForBill(billId, exceptId));
    }

    function invoicedCents(billId, exceptId = "") {
      return sumCents(invoicesForBill(billId, exceptId));
    }

    function remainingCents(bill) {
      return Math.max(0, taxDetails(bill).gross - paidCents(bill.id));
    }

    function billPaymentStatus(bill) {
      const total = taxDetails(bill).gross;
      const paid = paidCents(bill.id);
      const remaining = Math.max(0, total - paid);
      if (paid > total) return { key: "overpaid", label: "超额回款", tone: "info", paid, remaining: 0 };
      if (remaining === 0) return { key: "paid", label: "已收清", tone: "success", paid, remaining: 0 };
      if (bill.dueDate && bill.dueDate < localDateISO()) return { key: "overdue", label: "已逾期", tone: "danger", paid, remaining };
      if (paid > 0) return { key: "partial", label: "部分回款", tone: "warn", paid, remaining };
      return { key: "unpaid", label: "未回款", tone: "neutral", paid, remaining };
    }

    function billInvoiceStatus(bill) {
      if (!bill.invoiceRequired) return { key: "not_needed", label: "无需开票", tone: "neutral" };
      const total = taxDetails(bill).gross;
      const invoiced = invoicedCents(bill.id);
      if (invoiced > total) return { key: "over", label: "超额开票", tone: "danger" };
      if (invoiced === total) return { key: "issued", label: "已开票", tone: "success" };
      if (invoiced > 0) return { key: "partial", label: "部分开票", tone: "warn" };
      return { key: "pending", label: "待开票", tone: "info" };
    }

    function paymentNetAllocations(bill, payments) {
      const tax = taxDetails(bill);
      if (!tax.gross) return payments.map(item => ({ id: item.id, netCents: item.amountCents }));
      const ordered = payments
        .slice()
        .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || "").localeCompare(b.createdAt || "") || a.id.localeCompare(b.id));
      let cumulative = 0;
      let allocatedBefore = 0;
      return ordered.map(item => {
        cumulative += item.amountCents;
        const capped = Math.min(cumulative, tax.gross);
        const allocatedThroughItem = capped === tax.gross ? tax.net : Math.round(capped * tax.net / tax.gross);
        const allocation = allocatedThroughItem - allocatedBefore;
        allocatedBefore = allocatedThroughItem;
        return { id: item.id, netCents: allocation };
      });
    }

    function paymentNetCents(payment) {
      const bill = billById(payment.billId);
      if (!bill) return payment.amountCents;
      const allocation = paymentNetAllocations(bill, state.payments.filter(item => item.billId === bill.id))
        .find(item => item.id === payment.id);
      return allocation?.netCents ?? Math.round(payment.amountCents * taxDetails(bill).net / Math.max(1, taxDetails(bill).gross));
    }

    function paymentTaxCents(payment) {
      return Math.max(0, payment.amountCents - paymentNetCents(payment));
    }

    function expenseManagementCost(expense) {
      const tax = taxDetails(expense);
      return expense.deductible ? tax.net : tax.gross;
    }

    function inMonth(date, month = ui.month) {
      return String(date || "").slice(0, 7) === month;
    }

    function queryMatch(values) {
      const query = ui.query.trim().toLocaleLowerCase("zh-CN");
      if (!query) return true;
      return values.some(value => String(value ?? "").toLocaleLowerCase("zh-CN").includes(query));
    }

    function autoBillNo(date) {
      const month = String(date || localDateISO()).slice(0, 7);
      const prefix = `FIN-DEMO-${month.replace("-", "")}-`;
      const max = [
        ...state.bills.map(item => item.billNo),
        ...archivedRecordsFor("bill").map(item => item.record?.billNo || ""),
        ...archivedRecordsFor("payment").filter(item => item.billSnapshot).map(item => item.billSnapshot.billNo || ""),
        ...archivedRecordsFor("invoice").flatMap(item => (item.billSnapshots || []).map(snapshot => snapshot.billNo || ""))
      ]
        .filter(no => no.toLocaleUpperCase().startsWith(prefix))
        .map(no => Number(no.slice(prefix.length)))
        .filter(Number.isFinite)
        .reduce((value, current) => Math.max(value, current), 0);
      return `${prefix}${String(max + 1).padStart(2, "0")}`;
    }

    function statusBadge(status) {
      return `<span class="status ${status.tone}">${escapeHTML(status.label)}</span>`;
    }

    function taxModeLabel(record) {
      const labels = { included: "含税", excluded: "未税另加税", no_tax: "无税" };
      return labels[record.taxMode] || "无税";
    }

    function rateLabel(rateBps) {
      const rate = Number(rateBps || 0) / 100;
      return `${Number.isInteger(rate) ? rate : rate.toFixed(2)}%`;
    }

    function monthStats(month = ui.month) {
      const payments = state.payments.filter(item => inMonth(item.date, month));
      const expenses = state.expenses.filter(item => inMonth(item.date, month));
      const received = sumCents(payments);
      const spent = sumCents(expenses, item => taxDetails(item).gross);
      const netReceived = sumCents(payments, paymentNetCents);
      const managementCost = sumCents(expenses, expenseManagementCost);
      const outputTax = sumCents(payments, paymentTaxCents);
      const inputTax = sumCents(expenses.filter(item => item.deductible), item => taxDetails(item).tax);
      const taxedReceived = sumCents(payments.filter(item => billById(item.billId)?.taxMode !== "no_tax"));
      const noTaxReceived = received - taxedReceived;
      const billed = sumCents(state.bills.filter(item => inMonth(item.date, month)), item => taxDetails(item).gross);
      return {
        payments, expenses, received, spent,
        cashProfit: received - spent,
        netReceived, managementCost,
        managementProfit: netReceived - managementCost,
        outputTax, inputTax, taxPosition: outputTax - inputTax,
        taxedReceived, noTaxReceived, billed
      };
    }

    function outstandingStats() {
      let outstanding = 0;
      let overdue = 0;
      let overdueCount = 0;
      let openCount = 0;
      let invoicePending = 0;
      let invoicePendingCount = 0;
      state.bills.forEach(bill => {
        const payment = billPaymentStatus(bill);
        const invoice = billInvoiceStatus(bill);
        if (payment.remaining > 0) {
          outstanding += payment.remaining;
          openCount += 1;
          if (payment.key === "overdue") {
            overdue += payment.remaining;
            overdueCount += 1;
          }
        }
        if (["pending", "partial"].includes(invoice.key)) {
          invoicePending += Math.max(0, taxDetails(bill).gross - invoicedCents(bill.id));
          invoicePendingCount += 1;
        }
      });
      return { outstanding, overdue, overdueCount, openCount, invoicePending, invoicePendingCount };
    }

    function toast(message, type = "success", duration = 2600) {
      const node = document.createElement("div");
      node.className = `toast ${type}`;
      node.textContent = message;
      toastRegion.appendChild(node);
      window.setTimeout(() => node.remove(), duration);
    }

    function setSaveFeedback(phase, message = "") {
      saveFeedback = { phase, message };
      updateSavedTime();
    }

    function updateSavedTime() {
      const node = document.getElementById("storageStatus");
      if (!node) return;
      const { phase, message } = saveFeedback;
      const date = new Date(state.updatedAt || "");
      const title = phase === "saving" ? "正在保存…" : phase === "error" ? "保存异常，请检查" : phase === "warning" ? "账本已更新，请核对" : demoStorage.persistent ? "演示修改已保存到浏览器" : "修改已保留在本次演示";
      const detail = message || (!demoStorage.persistent ? "临时演示 · 可导出备份" : Number.isFinite(date.getTime()) ? `最近保存 ${date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}` : "独立存储 · 数据不上传");
      const path = phase === "error" || phase === "warning" ? '<path d="m12 3 9 17H3L12 3Z"/><path d="M12 9v4m0 3h.01"/>' : phase === "saving" ? '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' : '<path d="m12 3 8 4v6c0 4-8 8-8 8s-8-4-8-8V7l8-4Z"/><path d="m8 12 3 3 5-6"/>';
      node.dataset.state = phase;
      node.innerHTML = `<strong><svg class="storage-status-icon" viewBox="0 0 24 24" aria-hidden="true">${path}</svg><span>${escapeHTML(title)}</span></strong><span class="saved-time" id="savedTime">${escapeHTML(detail)}</span>`;
    }

    function setActiveNavigation() {
      const viewNames = { dashboard: "财务概览", bills: "客户账单", payments: "回款记录", invoices: "开票管理", expenses: "成本支出", data: "数据与设置" };
      document.querySelectorAll("[data-view]").forEach(button => {
        const active = button.dataset.view === ui.view;
        button.classList.toggle("active", active);
        if (button.classList.contains("nav-item")) {
          button.setAttribute("aria-label", viewNames[button.dataset.view] || button.dataset.view);
          button.setAttribute("title", viewNames[button.dataset.view] || button.dataset.view);
          if (active) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        }
      });
      const stats = outstandingStats();
      document.getElementById("billNavCount").textContent = String(stats.openCount);
      document.getElementById("invoiceNavCount").textContent = String(stats.invoicePendingCount);
      updateSavedTime();
    }

    function heading(title, description, actions = "") {
      return `
        <div class="page-heading">
          <div>
            <div class="eyebrow">${escapeHTML(formatMonth(ui.month))}</div>
            <h1>${escapeHTML(title)}</h1>

    function renderDashboard() {
      const stats = monthStats();
      const open = outstandingStats();
      const profitColor = stats.cashProfit >= 0 ? "var(--sage)" : "var(--rose)";
      const managementColor = stats.managementProfit >= 0 ? "var(--blue)" : "var(--rose)";
      const trendMonths = Array.from({ length: 6 }, (_, index) => shiftMonth(ui.month, index - 5));
      const trend = trendMonths.map(month => ({ month, ...monthStats(month) }));
      const trendMax = Math.max(1, ...trend.flatMap(item => [item.received, item.spent]));
      const totalTrendReceived = sumCents(trend, item => item.received);
      const totalTrendSpent = sumCents(trend, item => item.spent);
      const costGroups = new Map();
      stats.expenses.forEach(expense => {
        costGroups.set(expense.category, (costGroups.get(expense.category) || 0) + taxDetails(expense).gross);
      });
      const costs = [...costGroups.entries()].sort((a, b) => b[1] - a[1]);
      const maxCost = Math.max(1, ...costs.map(item => item[1]));
      const costColors = ["var(--rose)", "var(--ochre)", "var(--blue)", "var(--plum)", "var(--sage)"];
      const receivables = state.bills
        .map(bill => ({ bill, status: billPaymentStatus(bill) }))
        .filter(item => item.status.remaining > 0)
        .sort((a, b) => (a.bill.dueDate || "9999").localeCompare(b.bill.dueDate || "9999"))
        .slice(0, 6);
      const invoiceTodos = state.bills
        .map(bill => ({ bill, status: billInvoiceStatus(bill) }))
        .filter(item => ["pending", "partial"].includes(item.status.key))
        .sort((a, b) => (a.bill.date || "").localeCompare(b.bill.date || ""))
        .slice(0, 5);

      const metric = (label, value, meta, accent, valueClass = "") => `
        <article class="metric-card" style="--accent:${accent}">
          <div class="metric-label"><span class="metric-symbol"></span>${label}</div>
          <div class="metric-value money ${valueClass}">${value}</div>
          <div class="metric-meta">${meta}</div>
        </article>`;

      const todoList = (items, type) => {
        if (!items.length) return `<div class="empty-mini">这个月没有需要处理的事项</div>`;
        return `<div class="todo-list">${items.map(item => {
          const bill = item.bill;
          const isInvoice = type === "invoice";
          const amount = isInvoice
            ? Math.max(0, taxDetails(bill).gross - invoicedCents(bill.id))
            : item.status.remaining;
          const meta = isInvoice
            ? `${item.status.label} · ${formatDate(bill.date)}`
            : `${item.status.key === "overdue" ? "逾期" : "到期"} ${shortDate(bill.dueDate)}`;
          return `
            <div class="todo-item">
              <span class="todo-dot" style="--dot:${isInvoice ? "var(--blue)" : item.status.key === "overdue" ? "var(--rose)" : "var(--ochre)"}"></span>
              <div><div class="todo-name">${safeText(bill.customer)}</div><div class="todo-meta">${safeText(meta)} · ${safeText(bill.billNo)}</div></div>
              <div class="todo-amount">${money(amount)}</div>
            </div>`;
        }).join("")}</div>`;
      };

      viewContainer.innerHTML = `
        ${heading("财务概览", "按实际到账与实际支付统计，不把未收账单当作收入。", `
          <button class="btn-secondary" type="button" data-action="add-expense">＋ 记录支出</button>
          <button class="btn-soft" type="button" data-action="add-payment">＋ 登记回款</button>
        `)}

        <section class="metric-grid" aria-label="本月关键指标">
          ${metric("本月实际收款", money(stats.received), `共 <strong>${stats.payments.length}</strong> 笔到账`, "var(--sage)")}
          ${metric("本月实际支出", money(stats.spent), `共 <strong>${stats.expenses.length}</strong> 笔支出`, "var(--rose)")}
          ${metric("本月现金盈亏", signedMoney(stats.cashProfit), `实际收款 − 实际支出`, profitColor, stats.cashProfit >= 0 ? "positive-text" : "danger-text")}
          ${metric("当前待收金额", money(open.outstanding), `<strong>${open.openCount}</strong> 笔未结 · 逾期 ${money(open.overdue)}`, "var(--ochre)")}
        </section>

        <section class="insight-strip" aria-label="税务与经营口径拆分">
          <div class="insight-item"><div class="insight-label">含税业务到账</div><div class="insight-value money">${money(stats.taxedReceived)}</div></div>
          <div class="insight-item"><div class="insight-label">无税业务到账</div><div class="insight-value money">${money(stats.noTaxReceived)}</div></div>
          <div class="insight-item"><div class="insight-label">去税经营盈亏</div><div class="insight-value money ${stats.managementProfit >= 0 ? "positive-text" : "danger-text"}" style="color:${managementColor}">${signedMoney(stats.managementProfit)}</div></div>
          <div class="insight-item"><div class="insight-label">估算增值税净额</div><div class="insight-value money">${signedMoney(stats.taxPosition)}</div></div>
        </section>

        <section class="dashboard-grid">
          <div class="stack">
            <article class="panel">
              <div class="panel-header">
                <div><h2 class="panel-title">近 6 个月现金收支</h2><div class="panel-note">柱高按各月实际到账和实际支付金额绘制</div></div>
                <div class="legend"><span><i style="--legend:var(--sage)"></i>实际收款</span><span><i style="--legend:var(--rose)"></i>实际支出</span></div>
              </div>
              <div class="chart-wrap" role="img" aria-label="近六个月实际收款与支出柱状图">
                <div class="bar-chart">
                  ${trend.map(item => {
                    const incomeHeight = item.received ? Math.max(3, Math.round(item.received / trendMax * 100)) : 0;
                    const costHeight = item.spent ? Math.max(3, Math.round(item.spent / trendMax * 100)) : 0;
                    return `<div class="bar-group">
                      <div class="bars">
                        <div class="bar" style="--bar:var(--sage);height:${incomeHeight}%" title="${escapeHTML(formatMonth(item.month))}收款 ${money(item.received)}"></div>
                        <div class="bar" style="--bar:var(--rose);height:${costHeight}%" title="${escapeHTML(formatMonth(item.month))}支出 ${money(item.spent)}"></div>
                      </div>
                      <div class="bar-label">${shortMonth(item.month)}</div>
                    </div>`;
                  }).join("")}
                </div>
              </div>
              <div class="chart-summary" aria-label="近六个月汇总">
                <div><span>累计实收</span><strong class="money">${money(totalTrendReceived)}</strong></div>
                <div><span>累计支出</span><strong class="money">${money(totalTrendSpent)}</strong></div>
                <div><span>累计现金结余</span><strong class="money ${totalTrendReceived - totalTrendSpent >= 0 ? "positive-text" : "danger-text"}">${signedMoney(totalTrendReceived - totalTrendSpent)}</strong></div>
              </div>
              <table class="sr-only">
                <caption>近六个月现金收支明细</caption>
                <thead><tr><th scope="col">月份</th><th scope="col">实际收款</th><th scope="col">实际支出</th><th scope="col">现金盈亏</th></tr></thead>
                <tbody>${trend.map(item => `<tr><th scope="row">${formatMonth(item.month)}</th><td>${money(item.received)}</td><td>${money(item.spent)}</td><td>${signedMoney(item.cashProfit)}</td></tr>`).join("")}</tbody>
              </table>
            </article>

            <article class="panel">
              <div class="panel-header">
                <div><h2 class="panel-title">本月成本构成</h2><div class="panel-note">按实际支付金额排序</div></div>
                <strong class="money">${money(stats.spent)}</strong>
              </div>
              ${costs.length ? `<div class="progress-list">${costs.map((item, index) => `
                <div>
                  <div class="progress-head"><span>${safeText(item[0])}</span><span>${money(item[1])} · ${stats.spent ? Math.round(item[1] / stats.spent * 100) : 0}%</span></div>
                  <div class="progress-track"><div class="progress-bar" style="--fill:${costColors[index % costColors.length]};width:${Math.max(2, Math.round(item[1] / maxCost * 100))}%"></div></div>
                </div>`).join("")}</div>` : `<div class="empty-mini">本月还没有支出记录</div>`}
            </article>
          </div>

          <div class="stack secondary">
            <article class="panel">
              <div class="panel-header">
                <div><h2 class="panel-title">应收提醒</h2><div class="panel-note">${open.overdueCount} 笔已逾期，优先跟进</div></div>
                <button class="btn-ghost btn-small" type="button" data-view="bills">查看全部</button>
              </div>
              ${todoList(receivables, "payment")}
            </article>

            <article class="panel">
              <div class="panel-header">
                <div><h2 class="panel-title">开票待办</h2><div class="panel-note">待开金额 ${money(open.invoicePending)}</div></div>
                <button class="btn-ghost btn-small" type="button" data-view="invoices">去处理</button>
              </div>
              ${todoList(invoiceTodos, "invoice")}
            </article>

            <article class="panel">
              <div class="panel-header">
                <div><h2 class="panel-title">本月经营口径</h2><div class="panel-note">将可抵扣进项税从成本中剔除</div></div>
              </div>
              <div class="progress-list">
                <div><div class="progress-head"><span>未税销售回款</span><span>${money(stats.netReceived)}</span></div></div>
                <div><div class="progress-head"><span>经营净成本</span><span>${money(stats.managementCost)}</span></div></div>
                <div><div class="progress-head"><strong>管理盈亏</strong><strong class="${stats.managementProfit >= 0 ? "positive-text" : "danger-text"}">${signedMoney(stats.managementProfit)}</strong></div></div>
              </div>
            </article>
          </div>
        </section>`;
    }

    function emptyState(symbol, title, description, action, actionLabel) {
      return `<div class="empty-state">
        <div class="empty-symbol">${escapeHTML(symbol)}</div>
        <h3>${escapeHTML(title)}</h3>
        <p>${escapeHTML(description)}</p>
        ${action ? `<button class="btn-primary" type="button" data-action="${escapeHTML(action)}">${escapeHTML(actionLabel)}</button>` : ""}
      </div>`;
    }

    function renderBillFilters(count) {
      const paymentFilters = [
        ["all", "全部状态"], ["unpaid", "未回款"], ["partial", "部分回款"], ["paid", "已收清"], ["overdue", "已逾期"]
      ];
      const invoiceFilters = [["all", "全部开票"], ["pending", "待开票"], ["partial", "部分开票"], ["issued", "已开票"], ["not_needed", "无需开票"]];
      return `<div class="filter-bar">
        <div class="filter-group" role="group" aria-label="回款状态筛选">${paymentFilters.map(item => `<button class="filter-btn ${ui.status === item[0] ? "active" : ""}" type="button" data-filter="status" data-value="${item[0]}">${item[1]}</button>`).join("")}</div>
        <div class="filter-group" role="group" aria-label="开票状态筛选">${invoiceFilters.map(item => `<button class="filter-btn ${ui.invoiceStatus === item[0] ? "active" : ""}" type="button" data-filter="invoiceStatus" data-value="${item[0]}">${item[1]}</button>`).join("")}</div>
        <div class="filter-spacer"></div>
        <button class="filter-btn ${ui.listAll ? "active" : ""}" type="button" data-action="toggle-all">${ui.listAll ? "只看本月" : "查看全部月份"}</button>
        <span class="record-count">共 ${count} 条</span>
      </div>`;
    }

    function billMobileCard(bill) {
      const total = taxDetails(bill).gross;
      const payment = billPaymentStatus(bill);
      const invoice = billInvoiceStatus(bill);
      return `<article class="record-card">
        <div class="record-card-head">
          <div><div class="record-card-title">${safeText(bill.customer)}</div><div class="record-card-no">${safeText(bill.billNo)} · ${shortDate(bill.date)}</div></div>
          <strong class="money">${money(total)}</strong>
        </div>
        <div class="record-card-grid">
          <div><span>已收</span><strong class="money">${money(payment.paid)}</strong></div>
          <div><span>待收</span><strong class="money">${money(payment.remaining)}</strong></div>
          <div><span>到期日</span><strong>${shortDate(bill.dueDate)}</strong></div>
        </div>
        <div class="record-card-status">${statusBadge(payment)}${statusBadge(invoice)}<span class="tax-tag">${taxModeLabel(bill)}${bill.taxMode !== "no_tax" ? ` · ${rateLabel(bill.taxRateBps)}` : ""}</span></div>
        <div class="record-card-actions">
          ${payment.remaining > 0 ? `<button class="btn-soft btn-small" type="button" data-action="add-payment" data-id="${bill.id}">登记回款</button>` : ""}
          ${bill.invoiceRequired && !["issued", "over"].includes(invoice.key) ? `<button class="btn-secondary btn-small" type="button" data-action="add-invoice" data-id="${bill.id}">登记开票</button>` : ""}
          <button class="btn-ghost btn-small" type="button" data-action="edit" data-type="bill" data-id="${bill.id}">编辑</button>
          <button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="bill" data-id="${bill.id}">作废</button>
        </div>
      </article>`;
    }

    function renderBills() {
      let bills = state.bills.filter(bill => {
        const payment = billPaymentStatus(bill);
        const invoice = billInvoiceStatus(bill);
        return (ui.listAll || inMonth(bill.date))
          && (ui.status === "all" || payment.key === ui.status || (ui.status === "partial" && payment.key === "overdue" && payment.paid > 0))
          && (ui.invoiceStatus === "all" || invoice.key === ui.invoiceStatus)
          && queryMatch([bill.billNo, bill.customer, bill.description, bill.notes]);
      });
      bills.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.billNo.localeCompare(a.billNo));

      viewContainer.innerHTML = `
        ${heading("客户账单", "跟踪每一笔应收、实际回款进度、到期情况和开票状态。", `<button class="btn-primary" type="button" data-action="add-bill">＋ 新建账单</button>`)}
        ${renderBillFilters(bills.length)}
        ${bills.length ? `
          <section class="panel table-panel">
            <div class="table-scroller">
              <table class="data-table">
                <caption>客户账单列表</caption>
                <thead><tr>
                  <th scope="col">账单 / 开单日</th><th scope="col">客户与摘要</th><th class="cell-money" scope="col">应收金额</th>
                  <th class="cell-money" scope="col">已收</th><th class="cell-money" scope="col">待收</th><th scope="col">到期日</th>
                  <th scope="col">回款状态</th><th scope="col">开票状态</th><th scope="col">税务属性</th><th scope="col" style="text-align:right">操作</th>
                </tr></thead>
                <tbody>${bills.map(bill => {
                  const total = taxDetails(bill).gross;
                  const payment = billPaymentStatus(bill);
                  const invoice = billInvoiceStatus(bill);
                  return `<tr>
                    <td><div class="cell-primary">${safeText(bill.billNo)}</div><div class="cell-secondary">${formatDate(bill.date)}</div></td>
                    <td><div class="cell-primary">${safeText(bill.customer)}</div><div class="cell-secondary" title="${safeText(bill.description)}">${safeText(bill.description || "暂无摘要")}</div></td>
                    <td class="cell-money"><strong>${money(total)}</strong><div class="cell-secondary">录入 ${money(bill.amountCents)}</div></td>
                    <td class="cell-money">${money(payment.paid)}</td><td class="cell-money">${money(payment.remaining)}</td>
                    <td>${formatDate(bill.dueDate)}</td><td>${statusBadge(payment)}</td><td>${statusBadge(invoice)}</td>
                    <td><span class="tax-tag">${taxModeLabel(bill)}${bill.taxMode !== "no_tax" ? ` · ${rateLabel(bill.taxRateBps)}` : ""}</span></td>
                    <td><div class="table-actions">
                      ${payment.remaining > 0 ? `<button class="btn-soft btn-small" type="button" data-action="add-payment" data-id="${bill.id}">收款</button>` : ""}
                      ${bill.invoiceRequired && !["issued", "over"].includes(invoice.key) ? `<button class="btn-secondary btn-small" type="button" data-action="add-invoice" data-id="${bill.id}">开票</button>` : ""}
                      <button class="btn-ghost btn-small" type="button" data-action="edit" data-type="bill" data-id="${bill.id}">编辑</button>
                      <button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="bill" data-id="${bill.id}">作废</button>
                    </div></td>
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </section>
          <section class="mobile-records">${bills.map(billMobileCard).join("")}</section>
        ` : `<section class="panel">${emptyState("单", "没有符合条件的账单", ui.query || ui.status !== "all" || ui.invoiceStatus !== "all" ? "试试清除搜索或筛选条件。" : "从第一张客户账单开始，系统会自动跟踪回款与开票。", "add-bill", "新建账单")}</section>`}`;
    }

    function simpleListFilter(count) {
      return `<div class="filter-bar">
        <button class="filter-btn ${!ui.listAll ? "active" : ""}" type="button" data-action="set-current-month">${formatMonth(ui.month)}</button>
        <button class="filter-btn ${ui.listAll ? "active" : ""}" type="button" data-action="toggle-all">全部月份</button>
        <div class="filter-spacer"></div><span class="record-count">共 ${count} 条</span>
      </div>`;
    }

    function renderPayments() {
      let payments = state.payments.filter(payment => {
        const bill = billById(payment.billId);
        return (ui.listAll || inMonth(payment.date)) && queryMatch([bill?.billNo, bill?.customer, payment.method, payment.account, payment.reference, payment.notes]);
      });
      payments.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt.localeCompare(a.createdAt));
      const monthTotal = sumCents(state.payments.filter(item => inMonth(item.date)));

      viewContainer.innerHTML = `
        ${heading("回款记录", "支持同一账单多次回款；月度收入只按实际到账日期归属。", `<button class="btn-primary" type="button" data-action="add-payment">＋ 登记回款</button>`)}
        <section class="insight-strip">
          <div class="insight-item"><div class="insight-label">本月实际到账</div><div class="insight-value money">${money(monthTotal)}</div></div>
          <div class="insight-item"><div class="insight-label">本月到账笔数</div><div class="insight-value">${state.payments.filter(item => inMonth(item.date)).length} 笔</div></div>
          <div class="insight-item"><div class="insight-label">累计已回款</div><div class="insight-value money">${money(sumCents(state.payments))}</div></div>
          <div class="insight-item"><div class="insight-label">当前待收</div><div class="insight-value money">${money(outstandingStats().outstanding)}</div></div>
        </section>
        ${simpleListFilter(payments.length)}
        ${payments.length ? `
          <section class="panel table-panel"><div class="table-scroller"><table class="data-table" style="min-width:960px">
            <caption>客户回款记录</caption>
            <thead><tr><th scope="col">到账日期</th><th scope="col">客户 / 账单</th><th class="cell-money" scope="col">实际到账</th><th class="cell-money" scope="col">未税归集</th><th scope="col">收款方式</th><th scope="col">账户 / 流水</th><th scope="col">备注</th><th scope="col" style="text-align:right">操作</th></tr></thead>
            <tbody>${payments.map(payment => {
              const bill = billById(payment.billId);
              return `<tr>
                <td>${formatDate(payment.date)}</td>
                <td><div class="cell-primary">${safeText(bill?.customer || "未知客户")}</div><div class="cell-secondary">${safeText(bill?.billNo || "账单已删除")}</div></td>
                <td class="cell-money"><strong>${money(payment.amountCents)}</strong></td><td class="cell-money">${money(paymentNetCents(payment))}</td>
                <td>${safeText(payment.method)}</td><td><div>${safeText(payment.account || "—")}</div><div class="cell-secondary">${safeText(payment.reference || "无流水备注")}</div></td>
                <td><div class="cell-secondary" title="${safeText(payment.notes)}">${safeText(payment.notes || "—")}</div></td>
                <td><div class="table-actions"><button class="btn-ghost btn-small" type="button" data-action="edit" data-type="payment" data-id="${payment.id}">编辑</button><button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="payment" data-id="${payment.id}">作废</button></div></td>
              </tr>`;
            }).join("")}</tbody>
          </table></div></section>
          <section class="mobile-records">${payments.map(payment => {
            const bill = billById(payment.billId);
            return `<article class="record-card"><div class="record-card-head"><div><div class="record-card-title">${safeText(bill?.customer || "未知客户")}</div><div class="record-card-no">${safeText(bill?.billNo || "")} · ${shortDate(payment.date)}</div></div><strong class="money positive-text">${money(payment.amountCents)}</strong></div><div class="record-card-grid"><div><span>未税归集</span><strong>${money(paymentNetCents(payment))}</strong></div><div><span>方式</span><strong>${safeText(payment.method)}</strong></div></div><div class="record-card-actions"><button class="btn-ghost btn-small" type="button" data-action="edit" data-type="payment" data-id="${payment.id}">编辑</button><button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="payment" data-id="${payment.id}">作废</button></div></article>`;
          }).join("")}</section>
        ` : `<section class="panel">${emptyState("收", "还没有回款记录", ui.query ? "没有找到匹配的回款，请调整搜索内容。" : "客户付款后在这里登记，支持一张账单分多次到账。", "add-payment", "登记第一笔回款")}</section>`}`;
    }

    function renderExpenses() {
      let expenses = state.expenses.filter(expense => (ui.listAll || inMonth(expense.date))
        && (ui.category === "all" || expense.category === ui.category)
        && queryMatch([expense.category, expense.payee, expense.description, expense.method, expense.notes]));
      expenses.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt.localeCompare(a.createdAt));
      const stats = monthStats();
      const legacyCategories = [...new Set(state.expenses.map(item => item.category).filter(category => !EXPENSE_CATEGORIES.includes(category)))];
      const categoryButtons = ["all", ...EXPENSE_CATEGORIES, ...legacyCategories];

      viewContainer.innerHTML = `
        ${heading("成本支出", "重点归集大货、打版打样、快递运费与采购费用，并同步统计人工、场地和水电等支出。", `<button class="btn-primary" type="button" data-action="add-expense">＋ 记录支出</button>`)}
        <section class="insight-strip">
          <div class="insight-item"><div class="insight-label">本月现金支出</div><div class="insight-value money">${money(stats.spent)}</div></div>
          <div class="insight-item"><div class="insight-label">本月经营成本</div><div class="insight-value money">${money(stats.managementCost)}</div></div>
          <div class="insight-item"><div class="insight-label">可抵扣进项税</div><div class="insight-value money">${money(stats.inputTax)}</div></div>
          <div class="insight-item"><div class="insight-label">本月支出笔数</div><div class="insight-value">${stats.expenses.length} 笔</div></div>
        </section>
        <div class="filter-bar">
          <div class="filter-group" role="group" aria-label="支出分类筛选">${categoryButtons.map(category => `<button class="filter-btn ${ui.category === category ? "active" : ""}" type="button" data-filter="category" data-value="${escapeHTML(category)}">${category === "all" ? "全部分类" : escapeHTML(category)}</button>`).join("")}</div>
          <div class="filter-spacer"></div><button class="filter-btn ${ui.listAll ? "active" : ""}" type="button" data-action="toggle-all">${ui.listAll ? "只看本月" : "查看全部月份"}</button><span class="record-count">共 ${expenses.length} 条</span>
        </div>
        ${expenses.length ? `
          <section class="panel table-panel"><div class="table-scroller"><table class="data-table" style="min-width:980px">
            <caption>成本支出明细</caption>
            <thead><tr><th scope="col">支付日期</th><th scope="col">分类</th><th scope="col">收款方 / 摘要</th><th class="cell-money" scope="col">实际支付</th><th class="cell-money" scope="col">经营成本</th><th scope="col">税务属性</th><th scope="col">支付方式</th><th scope="col" style="text-align:right">操作</th></tr></thead>
            <tbody>${expenses.map(expense => {
              const tax = taxDetails(expense);
              return `<tr>
                <td>${formatDate(expense.date)}</td><td><span class="status neutral">${safeText(expense.category)}</span></td>
                <td><div class="cell-primary">${safeText(expense.payee)}</div><div class="cell-secondary" title="${safeText(expense.description)}">${safeText(expense.description || "暂无摘要")}</div></td>
                <td class="cell-money"><strong>${money(tax.gross)}</strong><div class="cell-secondary">录入 ${money(expense.amountCents)}</div></td>
                <td class="cell-money">${money(expenseManagementCost(expense))}</td>
                <td><span class="tax-tag">${taxModeLabel(expense)}${expense.taxMode !== "no_tax" ? ` · ${rateLabel(expense.taxRateBps)}` : ""}</span><div class="cell-secondary">${expense.deductible ? "进项可抵扣" : "不抵扣"}</div></td>
                <td>${safeText(expense.method)}</td>

              </tr>`;

          </table></div></section>
          <section class="mobile-records">${expenses.map(expense => {

            return `<article class="record-card"><div class="record-card-head"><div><div class="record-card-title">${safeText(expense.payee)}</div><div class="record-card-no">${safeText(expense.category)} · ${shortDate(expense.date)}</div></div><strong class="money danger-text">${money(tax.gross)}</strong></div><div class="record-card-grid"><div><span>经营成本</span><strong>${money(expenseManagementCost(expense))}</strong></div><div><span>税务属性</span><strong>${taxModeLabel(expense)}</strong></div></div><div class="record-card-actions"><button class="btn-ghost btn-small" type="button" data-action="edit" data-type="expense" data-id="${expense.id}">编辑</button><button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="expense" data-id="${expense.id}">作废</button></div></article>`;
          }).join("")}</section>

    }

    function invoiceBills(invoice) {
      return invoice.allocations.map(allocation => billById(allocation.billId)).filter(Boolean);
    }

    function invoiceBillSummary(invoice) {
      const bills = invoiceBills(invoice);
      const numbers = bills.map(bill => bill.billNo);
      if (!numbers.length) return "关联账单不可用";
      const visible = numbers.slice(0, 2).join("、");
      return `${numbers.length} 张账单 · ${visible}${numbers.length > 2 ? ` 等` : ""}`;
    }

    function renderInvoices() {
      const pendingBills = state.bills
        .filter(bill => ["pending", "partial"].includes(billInvoiceStatus(bill).key))
        .filter(bill => (ui.listAll || inMonth(bill.date)) && queryMatch([bill.billNo, bill.customer, bill.description, bill.notes]))
        .sort((a, b) => (a.date || "").localeCompare(b.date || ""));

        .filter(invoice => {
          const bills = invoiceBills(invoice);

          <div class="insight-item"><div class="insight-label">本月发票张数</div><div class="insight-value">${state.invoices.filter(item => inMonth(item.date)).length} 张</div></div>
        </section>
        <div class="filter-bar">
          <button class="filter-btn ${ui.invoiceStatus === "all" ? "active" : ""}" type="button" data-filter="invoiceStatus" data-value="all">全部内容</button>

        ${ui.invoiceStatus !== "records" ? `

            ${pendingBills.length ? `<div class="table-scroller"><table class="data-table" style="min-width:820px"><caption>待开票账单</caption><thead><tr><th scope="col">客户 / 账单</th><th scope="col">账单日期</th><th class="cell-money" scope="col">应开金额</th><th class="cell-money" scope="col">已开金额</th><th class="cell-money" scope="col">待开金额</th><th scope="col">状态</th><th scope="col" style="text-align:right">操作</th></tr></thead><tbody>
              ${pendingBills.map(bill => {
                const total = taxDetails(bill).gross;
                const issued = invoicedCents(bill.id);
                return `<tr><td><div class="cell-primary">${safeText(bill.customer)}</div><div class="cell-secondary">${safeText(bill.billNo)}</div></td><td>${formatDate(bill.date)}</td><td class="cell-money">${money(total)}</td><td class="cell-money">${money(issued)}</td><td class="cell-money"><strong>${money(Math.max(0, total - issued))}</strong></td><td>${statusBadge(billInvoiceStatus(bill))}</td><td><div class="table-actions"><button class="btn-soft btn-small" type="button" data-action="add-invoice" data-id="${bill.id}">登记开票</button></div></td></tr>`;
              }).join("")}</tbody></table></div><div class="mobile-records">${pendingBills.map(bill => {
                const total = taxDetails(bill).gross;
                const issued = invoicedCents(bill.id);
                return `<article class="record-card"><div class="record-card-head"><div><div class="record-card-title">${safeText(bill.customer)}</div><div class="record-card-no">${safeText(bill.billNo)} · ${shortDate(bill.date)}</div></div><strong class="money">${money(Math.max(0, total - issued))}</strong></div><div class="record-card-grid"><div><span>应开</span><strong>${money(total)}</strong></div><div><span>已开</span><strong>${money(issued)}</strong></div></div><div class="record-card-status">${statusBadge(billInvoiceStatus(bill))}</div><div class="record-card-actions"><button class="btn-soft btn-small" type="button" data-action="add-invoice" data-id="${bill.id}">登记开票</button></div></article>`;
