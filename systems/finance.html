          </section>` : ""}
        ${ui.invoiceStatus !== "pending" ? `
          <section class="panel invoice-record-panel">
            <div class="panel-header" style="padding:19px 19px 0"><div><h2 class="panel-title">已开发票记录</h2><div class="panel-note">开票不会改变现金口径盈亏</div></div><span class="record-count">${invoices.length} 张</span></div>
            ${invoices.length ? `<div class="table-scroller"><table class="data-table" style="min-width:900px"><caption>已开发票列表</caption><thead><tr><th scope="col">开票日期</th><th scope="col">客户 / 关联账单</th><th scope="col">发票号码</th><th scope="col">发票类型</th><th class="cell-money" scope="col">票面金额</th><th scope="col">备注</th><th scope="col" style="text-align:right">操作</th></tr></thead><tbody>
              ${invoices.map(invoice => {
                const bills = invoiceBills(invoice);
                return `<tr><td>${formatDate(invoice.date)}</td><td><div class="cell-primary">${safeText(bills[0]?.customer || "未知客户")}</div><div class="cell-secondary" title="${safeText(invoiceBillSummary(invoice))}">${safeText(invoiceBillSummary(invoice))}</div></td><td>${invoice.invoiceNo ? safeText(invoice.invoiceNo) : `<span class="status neutral">未填写</span>`}</td><td>${safeText(invoice.type)}</td><td class="cell-money"><strong>${money(invoice.amountCents)}</strong></td><td><div class="cell-secondary">${safeText(invoice.notes || "—")}</div></td><td><div class="table-actions"><button class="btn-ghost btn-small" type="button" data-action="edit" data-type="invoice" data-id="${invoice.id}">编辑</button><button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="invoice" data-id="${invoice.id}">作废</button></div></td></tr>`;
              }).join("")}</tbody></table></div><div class="mobile-records invoice-mobile-records">${invoices.map(invoice => {
                const bills = invoiceBills(invoice);
                return `<article class="record-card"><div class="record-card-head"><div><div class="record-card-title">${safeText(bills[0]?.customer || "未知客户")}</div><div class="record-card-no">${safeText(invoice.invoiceNo || "发票号未填写")} · ${shortDate(invoice.date)}</div></div><strong class="money">${money(invoice.amountCents)}</strong></div><div class="record-card-grid"><div><span>关联账单</span><strong>${invoice.allocations.length} 张账单</strong></div><div><span>类型</span><strong>${safeText(invoice.type)}</strong></div></div><div class="record-card-actions"><button class="btn-ghost btn-small" type="button" data-action="edit" data-type="invoice" data-id="${invoice.id}">编辑</button><button class="btn-ghost btn-small danger-text" type="button" data-action="delete" data-type="invoice" data-id="${invoice.id}">作废</button></div></article>`;
              }).join("")}</div>` : `<div class="empty-state"><div class="empty-symbol">票</div><h3>还没有开票记录</h3><p>登记发票后，系统会自动更新每张账单的开票进度。</p></div>`}
          </section>` : ""}`;
    }

    function storageSize() {
      try {
        const bytes = new Blob([JSON.stringify(state)]).size;
        return bytes < 1024 ? `${bytes} B` : `${(bytes / 1024).toFixed(1)} KB`;
      } catch (error) {
        return "—";
      }
    }

    function hasRecoveryBackup() {
      try { return Boolean(demoStorage.getItem(RECOVERY_KEY)); }
      catch (error) { return false; }
    }

    function renderData() {
      const open = outstandingStats();
      viewContainer.innerHTML = `
        ${heading("数据与设置", "账本仅保存在当前浏览器；JSON 用于完整恢复，Excel 用于会计对账。")}
        <section class="data-grid">
          <article class="panel data-card">
            <div class="eyebrow">企业信息</div><h2>账本名称</h2><p>用于区分导出的备份文件，不会上传到任何服务器。</p>
            <div class="field"><label for="companyName">企业或账本名称</label><input class="control-input" id="companyName" type="text" maxlength="60" value="${safeText(state.companyName)}"></div>

            <p>当前待收 ${money(open.outstanding)}，已保留 ${state.archivedRecords?.length || 0} 条作废记录，占用本地空间约 ${storageSize()}。</p>

          </article>

          <article class="panel data-card excel-export-card">
            <div class="eyebrow">会计对账</div><h2>导出 Excel 对账工作簿</h2>
            <p>导出顶部当前选择月份的逐项目清单，包含项目名称、数量、单价、总金额、已付与未付金额、是否付款等字段。</p>
            <div class="local-note"><strong>当前导出月份：${formatMonth(ui.month)}</strong>每张账单对应一行项目，付款状态会结合该账单的全部回款自动判断。</div>
            <div class="data-actions"><button class="btn-primary" type="button" data-action="export-excel">导出 ${formatMonth(ui.month)}对账表</button></div>
          </article>

          <article class="panel data-card employee-import-card">
            <div class="eyebrow">员工数据交接</div><h2>导入员工账单 Excel</h2>
            <p>选择员工录单版直接导出的 Excel，将大货、样衣和打版记录合并为客户账单，随后即可跟踪回款与发票。</p>
            <div class="local-note"><strong>重复导入会自动识别</strong>录单编号已存在或曾被作废时不会再次入账；同编号但内容不同会停止导入并提醒检查。</div>
            <div class="data-actions"><button class="btn-primary" type="button" data-action="import-employee">导入员工账单</button></div>
          </article>

          <article class="panel data-card">
            <div class="eyebrow">计算口径</div><h2>现金与经营盈亏</h2><p>系统同时展示两套结果，避免把应收金额或增值税混入经营判断。</p>
            <div class="formula-note"><strong>现金盈亏</strong> = 当月实际到账 − 当月实际支付<br><strong>经营盈亏</strong> = 未税回款 − 扣除可抵扣进项税后的经营成本</div>
          </article>

          <article class="panel data-card">
            <div class="eyebrow">本地隐私</div><h2>数据不会离开设备</h2><p>刷新和关闭页面后数据仍会保留，但清理浏览器数据、无痕模式或更换浏览器会导致无法找回。</p>
            <div class="local-note"><strong><span class="local-dot"></span>建议每周导出一次备份</strong>备份文件可随时导入当前系统完整恢复。</div>

            <div class="eyebrow danger-text">谨慎操作</div><h2>重置本地账本</h2><p>清空后不可撤销；如需保留当前数据，请先导出备份。</p>
            <div class="data-actions"><button class="btn-secondary" type="button" data-action="restore-demo">恢复示例数据</button><button class="btn-danger" type="button" data-action="clear-data">清空全部数据</button></div>

    function render() {
      setActiveNavigation();
      monthPicker.value = ui.month;
      const renderers = {
        dashboard: renderDashboard,
        bills: renderBills,
        payments: renderPayments,
        expenses: renderExpenses,
        invoices: renderInvoices,
        data: renderData
      };
      (renderers[ui.view] || renderDashboard)();
      viewContainer.querySelectorAll("[data-filter]").forEach(button => {
        button.setAttribute("aria-pressed", button.classList.contains("active") ? "true" : "false");
      });
    }

    function addDays(dateString, days) {
      const [year, month, day] = dateString.split("-").map(Number);
      const date = new Date(year, month - 1, day + days);
      return localDateISO(date);
    }

    function taxModeOptions(selected) {
      return [
        ["included", "含税金额（录入金额已含税）"],
        ["excluded", "未税另加税（系统计算实付/应收）"],
        ["no_tax", "无税（不计算税额）"]
      ].map(item => `<option value="${item[0]}" ${selected === item[0] ? "selected" : ""}>${item[1]}</option>`).join("");
    }

    function taxRateOptions(selected) {
      return TAX_RATES.map(rate => `<option value="${rate}" ${Number(selected) === rate ? "selected" : ""}>${rateLabel(rate)}</option>`).join("");
    }

    function options(items, selected) {
      return items.map(item => `<option value="${escapeHTML(item)}" ${selected === item ? "selected" : ""}>${escapeHTML(item)}</option>`).join("");
    }

    function expenseCategoryOptions(selected) {
      const legacy = selected && !EXPENSE_CATEGORIES.includes(selected)
        ? `<optgroup label="历史分类"><option value="${escapeHTML(selected)}" selected>${escapeHTML(selected)}</option></optgroup>`
        : "";
      return `${legacy}${EXPENSE_CATEGORY_GROUPS.map(group => `<optgroup label="${escapeHTML(group.label)}">${options(group.items, selected)}</optgroup>`).join("")}`;
    }

    function invoiceCandidates(exceptInvoiceId = "") {
      return state.bills.filter(bill => bill.invoiceRequired
        && taxDetails(bill).gross - invoicedCents(bill.id, exceptInvoiceId) > 0);
    }

    function invoiceAllocationRowsHTML(customer, selectedAllocations = [], exceptInvoiceId = "") {
      const selectedByBill = new Map(selectedAllocations.map(item => [item.billId, item.amountCents]));
      const bills = invoiceCandidates(exceptInvoiceId).filter(bill => bill.customer === customer);
      if (!bills.length) return `<div class="allocation-empty">该客户当前没有可开票账单</div>`;
      return bills.map(bill => {
        const available = Math.max(0, taxDetails(bill).gross - invoicedCents(bill.id, exceptInvoiceId));
        const selectedAmount = selectedByBill.get(bill.id);
        const checked = Number.isInteger(selectedAmount) && selectedAmount > 0;
        return `<div class="allocation-row ${checked ? "selected" : ""}" data-allocation-row="${bill.id}">
          <label class="allocation-select" for="invoiceAllocation-${bill.id}">
            <input id="invoiceAllocation-${bill.id}" type="checkbox" value="${bill.id}" data-invoice-allocation-check ${checked ? "checked" : ""}>
            <span class="allocation-main">
              <span class="allocation-title">${safeText(bill.billNo)} · ${safeText(bill.description || "暂无摘要")}</span>
              <span class="allocation-meta">${formatDate(bill.date)} · 待开 <strong>${money(available)}</strong></span>
            </span>
          </label>
          <div class="allocation-amount">
            <label for="invoiceAllocationAmount-${bill.id}">本票分配金额（元）</label>
            <input class="control-input" id="invoiceAllocationAmount-${bill.id}" name="allocationAmount" type="number" min="0.01" step="0.01" inputmode="decimal"
              data-invoice-allocation-amount data-bill-id="${bill.id}" data-available-cents="${available}"
              value="${checked ? inputMoney(selectedAmount) : ""}" placeholder="0.00" ${checked ? "" : "disabled"}>
          </div>
        </div>`;
      }).join("");
    }

    function recordFor(type, id) {
      const map = { bill: state.bills, payment: state.payments, expense: state.expenses, invoice: state.invoices };
      return map[type]?.find(item => item.id === id) || null;
    }

    function field(name, label, control, full = false, help = "") {
      return `<div class="field ${full ? "full" : ""}"><label class="${control.includes("required") ? "required" : ""}" for="${name}">${label}</label>${control}${help ? `<div class="field-help">${help}</div>` : ""}</div>`;
    }

    function dialogShell(type, title, subtitle, body, isEdit) {
      return `<div class="dialog-shell">
        <input type="hidden" name="recordType" value="${type}">
        <div class="dialog-head"><div><h2 id="dialogTitle">${title}</h2><p id="dialogSubtitle">${subtitle}</p></div><button class="dialog-close" type="button" data-dialog-close aria-label="关闭">×</button></div>
        <div class="dialog-body"><div id="formError" class="field-error" role="alert" style="margin:0 0 12px"></div>${body}</div>
        <div class="dialog-foot"><button class="btn-ghost" type="button" data-dialog-close>取消</button><div class="dialog-foot-right"><button class="btn-primary" type="submit">${isEdit ? "保存修改" : "保存记录"}</button></div></div>
      </div>`;
    }

    function openRecordDialog(type, id = "", presetBillId = "", trigger = null) {
      const record = id ? recordFor(type, id) : null;
      const isEdit = Boolean(record);
      lastTrigger = trigger || document.activeElement;
      const today = localDateISO();
      let body = "";
      let title = "";
      let subtitle = "";

      if (type === "bill") {
        const value = record || {
          billNo: autoBillNo(today), customer: "", date: today, dueDate: addDays(today, 7), description: "",
          quantity: 1, unitPriceCents: 0, amountCents: 0, taxMode: "included", taxRateBps: 1300, invoiceRequired: true, notes: ""
        };
        const coreLocked = Boolean(record && billHasFinancialHistory(record.id));
        title = isEdit ? "编辑客户账单" : "新建客户账单";
        subtitle = "按项目名称、数量和单价生成账单总金额，后续可直接导出月度对账明细。";
        body = `
          <input type="hidden" name="id" value="${escapeHTML(record?.id || "")}">
          ${coreLocked ? `<div class="formula-note"><strong>财务核心字段已锁定</strong><br>这张账单已有回款或发票，账单编号、客户、总金额、税务属性和开票要求不可修改；数量与单价可以补充，但乘积必须保持原总金额。</div>` : ""}
          <div class="form-section"><div class="form-section-title">基本信息</div><div class="form-grid">
            ${field("customer", "客户名称", `<input class="control-input" id="customer" name="customer" type="text" maxlength="80" value="${safeText(value.customer)}" placeholder="例如：示例客户A" ${coreLocked ? "readonly" : ""} required>`)}
            ${field("billNo", "账单编号", `<input class="control-input" id="billNo" name="billNo" type="text" maxlength="40" value="${safeText(value.billNo)}" ${coreLocked ? "readonly" : ""} required>`)}
            ${field("billDate", "开单日期", `<input class="control-input" id="billDate" name="date" type="date" value="${escapeHTML(value.date)}" required>`)}
            ${field("dueDate", "约定到期日", `<input class="control-input" id="dueDate" name="dueDate" type="date" value="${escapeHTML(value.dueDate)}" required>`, false, isEdit ? "保留原有到期日，可按客户约定调整。" : "默认开单后 7 天，可按客户约定调整。")}
            ${field("description", "项目名称 / 款号", `<input class="control-input" id="description" name="description" type="text" maxlength="120" value="${safeText(value.description)}" placeholder="例如：秋季针织开衫首批货款" required>`, true)}
          </div></div>
          <div class="form-section"><div class="form-section-title">金额与税务</div><div class="form-grid">
            ${field("quantity", "数量（件）", `<input class="control-input" id="quantity" name="quantity" type="number" min="1" step="1" inputmode="numeric" value="${value.quantity || 1}" required>`)}
            ${field("unitPrice", "单价（元）", `<div class="input-prefix"><span>¥</span><input class="control-input" id="unitPrice" name="unitPrice" type="number" min="0.01" step="0.01" inputmode="decimal" value="${value.unitPriceCents ? inputMoney(value.unitPriceCents) : ""}" placeholder="0.00" required></div>`)}
            ${field("amount", "项目总金额（元）", `<div class="input-prefix"><span>¥</span><input class="control-input" id="amount" name="amount" type="number" value="${value.amountCents ? inputMoney(value.amountCents) : ""}" placeholder="自动计算" readonly required></div>`, false, "数量 × 单价自动计算；未税另加税时，最终应收会在下方另行显示。")}
            ${field("taxMode", "税务属性", `<select class="control-select" id="taxMode" name="taxMode" ${coreLocked ? "disabled" : ""}>${taxModeOptions(value.taxMode)}</select>`)}
            ${field("taxRate", "税率", `<select class="control-select" id="taxRate" name="taxRateBps" ${coreLocked ? "disabled" : ""}>${taxRateOptions(value.taxRateBps)}</select>`)}
            <div class="field"><label>开票要求</label><label class="check-row" for="invoiceRequired"><input id="invoiceRequired" name="invoiceRequired" type="checkbox" ${value.invoiceRequired ? "checked" : ""} ${coreLocked ? "disabled" : ""}><span><strong>客户需要开票</strong><span>勾选后会进入开票待办</span></span></label></div>
          </div><div class="tax-preview" id="taxPreview"></div></div>
          <div class="form-section"><div class="form-grid">${field("notes", "备注", `<textarea class="control-textarea" id="notes" name="notes" maxlength="500" placeholder="账期约定、跟进人或其他说明">${safeText(value.notes)}</textarea>`, true)}</div></div>`;
      }

      if (type === "payment") {
        const candidates = state.bills.filter(bill => remainingCents(bill) > 0 || bill.id === record?.billId);
        if (!candidates.length) {
          toast("当前没有可回款的账单，请先新建客户账单", "error");
          return;
        }
        const selectedBillId = presetBillId || record?.billId || candidates[0].id;
        const value = record || { billId: selectedBillId, date: today, amountCents: 0, method: "银行转账", account: "", reference: "", notes: "" };
        title = isEdit ? "编辑回款记录" : "登记客户回款";
        subtitle = "到账金额按到账日期计入月度实际收入。";
        body = `
          <input type="hidden" name="id" value="${escapeHTML(record?.id || "")}">
          <div class="form-section"><div class="form-section-title">到账信息</div><div class="form-grid">
            ${field("paymentBill", "关联账单", `<select class="control-select" id="paymentBill" name="billId" required>${candidates.map(bill => `<option value="${bill.id}" ${value.billId === bill.id ? "selected" : ""}>${safeText(bill.customer)} · ${safeText(bill.billNo)} · 待收 ${money(Math.max(0, taxDetails(bill).gross - paidCents(bill.id, record?.id || "")))}</option>`).join("")}</select>`, true)}
            ${field("paymentDate", "实际到账日期", `<input class="control-input" id="paymentDate" name="date" type="date" value="${escapeHTML(value.date)}" required>`)}
            ${field("paymentAmount", "实际到账金额（元）", `<div class="input-prefix"><span>¥</span><input class="control-input" id="paymentAmount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" value="${value.amountCents ? inputMoney(value.amountCents) : ""}" placeholder="0.00" required></div>`)}
            ${field("paymentMethod", "收款方式", `<select class="control-select" id="paymentMethod" name="method">${options(PAYMENT_METHODS, value.method)}</select>`)}
            ${field("account", "收款账户", `<input class="control-input" id="account" name="account" type="text" maxlength="80" value="${safeText(value.account)}" placeholder="例如：基本户">`)}
            ${field("reference", "流水号 / 凭证", `<input class="control-input" id="reference" name="reference" type="text" maxlength="80" value="${safeText(value.reference)}" placeholder="可选">`)}
            ${field("paymentNotes", "备注", `<textarea class="control-textarea" id="paymentNotes" name="notes" maxlength="500" placeholder="例如：首款、尾款">${safeText(value.notes)}</textarea>`, true)}
          </div><div class="tax-preview" id="paymentPreview"></div></div>`;
      }

      if (type === "expense") {
        const value = record || { date: today, category: "大货费用", payee: "", description: "", amountCents: 0, taxMode: "no_tax", taxRateBps: 0, deductible: false, method: "银行转账", notes: "" };
        title = isEdit ? "编辑支出记录" : "记录成本支出";
        subtitle = "以实际支付日期计入月度成本，并单独处理可抵扣进项税。";
        body = `
          <input type="hidden" name="id" value="${escapeHTML(record?.id || "")}">
          <div class="form-section"><div class="form-section-title">支出信息</div><div class="form-grid">
            ${field("expenseDate", "实际支付日期", `<input class="control-input" id="expenseDate" name="date" type="date" value="${escapeHTML(value.date)}" required>`)}
            ${field("category", "支出分类", `<select class="control-select" id="category" name="category">${expenseCategoryOptions(value.category)}</select>`)}
            ${field("payee", "收款方", `<input class="control-input" id="payee" name="payee" type="text" maxlength="80" value="${safeText(value.payee)}" placeholder="供应商、员工或物业名称" required>`)}
            ${field("expenseMethod", "支付方式", `<select class="control-select" id="expenseMethod" name="method">${options(PAYMENT_METHODS, value.method)}</select>`)}
            ${field("expenseDescription", "支出摘要", `<input class="control-input" id="expenseDescription" name="description" type="text" maxlength="120" value="${safeText(value.description)}" placeholder="例如：本月工资与计件费">`, true)}
          </div></div>
          <div class="form-section"><div class="form-section-title">金额与税务</div><div class="form-grid">
            ${field("expenseAmount", "录入金额（元）", `<div class="input-prefix"><span>¥</span><input class="control-input" id="expenseAmount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" value="${value.amountCents ? inputMoney(value.amountCents) : ""}" placeholder="0.00" required></div>`)}
            ${field("expenseTaxMode", "税务属性", `<select class="control-select" id="expenseTaxMode" name="taxMode">${taxModeOptions(value.taxMode)}</select>`)}
            ${field("expenseTaxRate", "税率", `<select class="control-select" id="expenseTaxRate" name="taxRateBps">${taxRateOptions(value.taxRateBps)}</select>`)}
            <div class="field"><label>进项税处理</label><label class="check-row" for="deductible"><input id="deductible" name="deductible" type="checkbox" ${value.deductible ? "checked" : ""}><span><strong>进项税可抵扣</strong><span>抵扣税额不计入经营成本</span></span></label></div>
          </div><div class="tax-preview" id="taxPreview"></div></div>
          <div class="form-section"><div class="form-grid">${field("expenseNotes", "备注", `<textarea class="control-textarea" id="expenseNotes" name="notes" maxlength="500" placeholder="发票、付款或归属说明">${safeText(value.notes)}</textarea>`, true)}</div></div>`;
      }

      if (type === "invoice") {
        const candidates = invoiceCandidates(record?.id || "");
        if (!candidates.length) {
          toast("当前没有需要开票的账单", "error");
          return;
        }
        const recordBill = record?.allocations?.length ? billById(record.allocations[0].billId) : null;
        const presetBill = candidates.find(bill => bill.id === presetBillId);
        const selectedBill = presetBill || recordBill || candidates[0];
        const selectedCustomer = selectedBill.customer;
        const customers = [...new Set(candidates.map(bill => bill.customer))].sort((a, b) => a.localeCompare(b, "zh-CN"));
        const initialAllocations = record?.allocations || [{
          billId: selectedBill.id,
          amountCents: Math.max(0, taxDetails(selectedBill).gross - invoicedCents(selectedBill.id))
        }];
        const value = record || { date: today, invoiceNo: "", type: "增值税专用发票", notes: "" };
        title = isEdit ? "编辑发票记录" : "登记开票";
        subtitle = "一张发票可分配到同一客户的多张账单，票面金额由分配金额自动合计。";
        body = `
          <input type="hidden" name="id" value="${escapeHTML(record?.id || "")}">
          <div class="form-section"><div class="form-section-title">发票信息</div><div class="form-grid">
            ${field("invoiceCustomer", "客户", `<select class="control-select" id="invoiceCustomer" name="customer" required>${customers.map(customer => `<option value="${escapeHTML(customer)}" ${customer === selectedCustomer ? "selected" : ""}>${safeText(customer)}</option>`).join("")}</select>`)}
            ${field("invoiceDate", "开票日期", `<input class="control-input" id="invoiceDate" name="date" type="date" value="${escapeHTML(value.date)}" required>`)}
            ${field("invoiceNo", "发票号码（选填）", `<input class="control-input" id="invoiceNo" name="invoiceNo" type="text" maxlength="40" value="${safeText(value.invoiceNo)}" placeholder="可稍后补录">`, false, "不填写也可以保存，后续编辑时再补上。")}
            ${field("invoiceType", "发票类型", `<select class="control-select" id="invoiceType" name="type">${options(INVOICE_TYPES, value.type)}</select>`)}
          </div></div>
          <div class="form-section">
            <fieldset class="allocation-fieldset">
              <legend>关联账单与本次开票金额</legend>
              <div class="allocation-list" id="invoiceAllocationList">${invoiceAllocationRowsHTML(selectedCustomer, initialAllocations, record?.id || "")}</div>
            </fieldset>
            <div class="invoice-total-note" id="invoicePreview" aria-live="polite"><span>已选择 0 张账单</span><strong>${money(0)}</strong></div>
          </div>
          <div class="form-section"><div class="form-grid">
            ${field("invoiceNotes", "备注", `<textarea class="control-textarea" id="invoiceNotes" name="notes" maxlength="500" placeholder="例如：合并开票、号码待补">${safeText(value.notes)}</textarea>`, true)}
          </div></div>`;
      }

      if (!body) return;
      recordForm.innerHTML = dialogShell(type, title, subtitle, body, isEdit);
      recordForm.dataset.autoDueDate = String(type === "bill" && !isEdit);
      updateFormPreview();
      recordDialog.showModal();
      window.setTimeout(() => recordForm.querySelector("input:not([type=hidden]), select, textarea")?.focus(), 0);
    }

    function resetInvoiceAllocationList(customer) {
      const list = recordForm.querySelector("#invoiceAllocationList");
      if (!list) return;
      const id = recordForm.elements.id?.value || "";
      const bills = invoiceCandidates(id).filter(bill => bill.customer === customer);
      const first = bills[0];
      const initial = first ? [{
        billId: first.id,
        amountCents: Math.max(0, taxDetails(first).gross - invoicedCents(first.id, id))
      }] : [];
      list.innerHTML = invoiceAllocationRowsHTML(customer, initial, id);
    }

    function toggleInvoiceAllocation(checkbox) {
      const row = checkbox.closest("[data-allocation-row]");
      const amountInput = row?.querySelector("[data-invoice-allocation-amount]");
      if (!amountInput) return;
      amountInput.disabled = !checkbox.checked;
      if (checkbox.checked && toCents(amountInput.value) <= 0) {
        amountInput.value = inputMoney(Number(amountInput.dataset.availableCents || 0));
      }
      if (!checkbox.checked) amountInput.value = "";
      row.classList.toggle("selected", checkbox.checked);
    }

    function updateFormPreview() {
      const type = recordForm.elements.recordType?.value;
      const id = recordForm.elements.id?.value || "";
      if (type === "bill" || type === "expense") {
        const amountInput = recordForm.elements.amount;
        const taxMode = recordForm.elements.taxMode;
        const taxRate = recordForm.elements.taxRateBps;
        if (!amountInput || !taxMode || !taxRate) return;
        const billCoreLocked = type === "bill" && Boolean(id) && billHasFinancialHistory(id);
        if (type === "bill" && !billCoreLocked) {
          const quantity = Number(recordForm.elements.quantity?.value || 0);
          const unitPriceCents = toCents(recordForm.elements.unitPrice?.value);
          const calculated = Number.isSafeInteger(quantity) && quantity > 0
            && Number.isSafeInteger(quantity * unitPriceCents) ? quantity * unitPriceCents : 0;
          amountInput.value = calculated > 0 ? inputMoney(calculated) : "";
        }
        taxRate.disabled = billCoreLocked || taxMode.value === "no_tax";
        if (taxMode.value === "no_tax") taxRate.value = "0";
        const details = taxDetails({ amountCents: toCents(amountInput.value), taxMode: taxMode.value, taxRateBps: Number(taxRate.value) });
        const preview = recordForm.querySelector("#taxPreview");
        if (preview) preview.innerHTML = `<div><span>未税金额</span><strong>${money(details.net)}</strong></div><div><span>税额</span><strong>${money(details.tax)}</strong></div><div><span>${type === "bill" ? "最终应收" : "实际支付"}</span><strong>${money(details.gross)}</strong></div>`;
      }
      if (type === "payment") {
        const bill = billById(recordForm.elements.billId?.value);
        const preview = recordForm.querySelector("#paymentPreview");
        if (!bill || !preview) return;
        const total = taxDetails(bill).gross;
        const before = paidCents(bill.id, id);
        const amount = toCents(recordForm.elements.amount?.value);
        preview.innerHTML = `<div><span>账单应收</span><strong>${money(total)}</strong></div><div><span>此前已收</span><strong>${money(before)}</strong></div><div><span>本次后待收</span><strong>${money(Math.max(0, total - before - amount))}</strong></div>`;
      }
      if (type === "invoice") {
        const preview = recordForm.querySelector("#invoicePreview");
        if (!preview) return;
        const selected = [...recordForm.querySelectorAll("[data-invoice-allocation-check]:checked")];
        const total = selected.reduce((sum, checkbox) => {
          const input = recordForm.querySelector(`[data-invoice-allocation-amount][data-bill-id="${checkbox.value}"]`);
          return sum + toCents(input?.value);
        }, 0);
        preview.innerHTML = `<span>已选择 ${selected.length} 张账单 · 票面含税金额自动合计</span><strong>${money(total)}</strong>`;
      }
    }

    function formError(message, fieldName = "") {
      const node = recordForm.querySelector("#formError");
      if (!node) return;
      node.textContent = message;
      node.classList.add("show");
      node.scrollIntoView({ block: "nearest" });
      recordForm.querySelectorAll("[aria-invalid='true']").forEach(control => control.removeAttribute("aria-invalid"));
      const target = fieldName ? recordForm.querySelector(`[name="${fieldName}"]`) : recordForm.querySelector(":invalid");
      if (target) {
        target.setAttribute("aria-invalid", "true");
        target.setAttribute("aria-describedby", "formError");
        target.focus();
        target.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    function readFormValue(formData, key) {
      return String(formData.get(key) || "").trim();
    }

    function upsert(list, record) {
      const index = list.findIndex(item => item.id === record.id);
      if (index >= 0) list[index] = record;
      else list.push(record);
    }

    async function submitRecord(event) {
      event.preventDefault();
      if (recordForm.dataset.saving === "true") return;
      const data = new FormData(recordForm);
      const type = readFormValue(data, "recordType");
      const id = readFormValue(data, "id");
      const existing = id ? recordFor(type, id) : null;
      const createdAt = existing?.createdAt || nowISO();

      if (type === "bill") {
        const coreLocked = Boolean(existing && billHasFinancialHistory(existing.id));
        const billNo = coreLocked ? existing.billNo : readFormValue(data, "billNo");
        const customer = coreLocked ? existing.customer : readFormValue(data, "customer");
        const date = readFormValue(data, "date");
        const dueDate = readFormValue(data, "dueDate");
        const description = readFormValue(data, "description");
        const quantity = Number(data.get("quantity"));
        const unitPriceCents = toCents(data.get("unitPrice"));
        const calculatedAmountCents = quantity * unitPriceCents;
        const amountCents = coreLocked ? existing.amountCents : calculatedAmountCents;
        const taxMode = coreLocked ? existing.taxMode : readFormValue(data, "taxMode") || "no_tax";
        const taxRateBps = coreLocked ? existing.taxRateBps : taxMode === "no_tax" ? 0 : Number(data.get("taxRateBps") || 0);
        if (!customer || !billNo || !description || !date || !dueDate) return formError("请完整填写客户、项目名称、账单编号和日期。");
        if (!Number.isSafeInteger(quantity) || quantity <= 0) return formError("数量必须是大于 0 的整数。", "quantity");
        if (!Number.isSafeInteger(unitPriceCents) || unitPriceCents <= 0 || !Number.isSafeInteger(calculatedAmountCents)) {
          return formError("请填写大于 0 的有效单价。", "unitPrice");
        }
        if (coreLocked && calculatedAmountCents !== existing.amountCents) {
          return formError(`数量 × 单价必须保持原项目总金额 ${money(existing.amountCents)}。`, "unitPrice");
        }
        if (dueDate < date) return formError("到期日不能早于开单日期。 ", "dueDate");
        if (businessKeyExists("bill", "billNo", billNo, id)) return formError("账单编号已存在或曾被作废，请换一个编号。 ", "billNo");
        const candidate = { amountCents, taxMode, taxRateBps };
        const finalGross = taxDetails(candidate).gross;
        if (existing && finalGross < paidCents(id)) return formError(`账单应收不能小于已回款 ${money(paidCents(id))}。`, "amount");
        if (existing && finalGross < invoicedCents(id)) return formError(`账单应收不能小于已开票 ${money(invoicedCents(id))}。`, "amount");
        upsert(state.bills, {
          id: id || uniqueId("bill"), billNo, customer, date, dueDate,
          description, quantity, unitPriceCents, amountCents, taxMode, taxRateBps,
          invoiceRequired: coreLocked ? existing.invoiceRequired : data.get("invoiceRequired") === "on", notes: readFormValue(data, "notes"), createdAt
        });
      }

      if (type === "payment") {
        const billId = readFormValue(data, "billId");
        const bill = billById(billId);
        const date = readFormValue(data, "date");
        const amountCents = toCents(data.get("amount"));
        if (!bill || !date || amountCents <= 0) return formError("请选择账单，并填写实际到账日期和大于 0 的金额。 ");
        const available = Math.max(0, taxDetails(bill).gross - paidCents(bill.id, id));
        if (amountCents > available) return formError(`本次回款不能超过当前待收 ${money(available)}。`, "amount");
        upsert(state.payments, {
          id: id || uniqueId("pay"), billId, date, amountCents,
          method: readFormValue(data, "method"), account: readFormValue(data, "account"),
          reference: readFormValue(data, "reference"), notes: readFormValue(data, "notes"), createdAt
        });
      }

      if (type === "expense") {
        const date = readFormValue(data, "date");
        const payee = readFormValue(data, "payee");
        const amountCents = toCents(data.get("amount"));
        const taxMode = readFormValue(data, "taxMode") || "no_tax";
        const taxRateBps = taxMode === "no_tax" ? 0 : Number(data.get("taxRateBps") || 0);
        if (!date || !payee || amountCents <= 0) return formError("请填写支付日期、收款方和大于 0 的金额。 ");
        upsert(state.expenses, {
          id: id || uniqueId("exp"), date, category: readFormValue(data, "category"), payee,
          description: readFormValue(data, "description"), amountCents, taxMode, taxRateBps,
          deductible: data.get("deductible") === "on" && taxMode !== "no_tax",
          method: readFormValue(data, "method"), notes: readFormValue(data, "notes"), createdAt
        });
      }

      if (type === "invoice") {
        const date = readFormValue(data, "date");
        const invoiceNo = readFormValue(data, "invoiceNo");
        const selectedCustomer = readFormValue(data, "customer");
        const selectedChecks = [...recordForm.querySelectorAll("[data-invoice-allocation-check]:checked")];
        if (!date) return formError("请填写开票日期。", "date");
        if (!selectedChecks.length) return formError("请至少勾选一张需要关联的账单。", "allocationAmount");
        if (invoiceNo && businessKeyExists("invoice", "invoiceNo", invoiceNo, id)) return formError("发票号码已存在或曾被作废，请检查后再保存。 ", "invoiceNo");
        const allocations = [];
        for (const checkbox of selectedChecks) {
          const bill = billById(checkbox.value);
          const amountInput = recordForm.querySelector(`[data-invoice-allocation-amount][data-bill-id="${checkbox.value}"]`);
          const amountCents = toCents(amountInput?.value);
          if (!bill || !bill.invoiceRequired || customerKey(bill.customer) !== customerKey(selectedCustomer)) {
            return formError("关联账单必须属于当前选择的同一客户，请重新选择。");
          }
          if (amountCents <= 0) return formError(`请填写账单 ${bill.billNo} 的本次开票金额。`, "allocationAmount");
          const available = Math.max(0, taxDetails(bill).gross - invoicedCents(bill.id, id));
          if (amountCents > available) return formError(`账单 ${bill.billNo} 的分配金额不能超过待开 ${money(available)}。`, "allocationAmount");
          allocations.push({ billId: bill.id, amountCents });
        }
        const amountCents = sumCents(allocations);
        upsert(state.invoices, {
          id: id || uniqueId("inv"), date, invoiceNo, amountCents, allocations,
          type: readFormValue(data, "type"), notes: readFormValue(data, "notes"), createdAt
        });
      }

      const formButtons = [...recordForm.querySelectorAll("button")];
      recordForm.dataset.saving = "true";
      formButtons.forEach(button => { button.disabled = true; });
      let saved = false;
      try {
        saved = await saveState(type === "bill" ? "账单已保存" : type === "payment" ? "回款已保存" : type === "expense" ? "支出已保存" : "发票已保存");
      } finally {
        delete recordForm.dataset.saving;
        formButtons.forEach(button => { button.disabled = false; });
      }
      if (!saved) return;
      recordDialog.close();
      render();
    }

    function askConfirm({ title, message, confirmLabel = "确认", danger = true }, action, trigger = null) {
      lastTrigger = trigger || document.activeElement;
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMessage").textContent = message;
      const button = document.getElementById("confirmOk");
      button.textContent = confirmLabel;
      button.className = danger ? "btn-danger" : "btn-primary";
      confirmAction = action;
      confirmDialog.showModal();
      window.setTimeout(() => button.focus(), 0);
    }

    function deleteRecord(type, id, trigger) {
      const record = recordFor(type, id);
      if (!record) return;
      const labels = { bill: "客户账单", payment: "回款记录", expense: "支出记录", invoice: "发票记录" };
      if (type === "bill") {
        const paymentCount = paymentsForBill(id).length;
        const invoiceCount = invoicesForBill(id).length;
        if (paymentCount || invoiceCount) {
          toast(`该账单已有 ${paymentCount} 笔回款和 ${invoiceCount} 张发票，请先作废关联记录后再处理账单`, "error", 5200);
          return;
        }
      }
      const message = `确定作废这条${labels[type]}吗？作废后不再参与统计，但原记录会保留在导出的备份中。`;
      askConfirm({ title: `作废${labels[type]}`, message, confirmLabel: "确认作废" }, async () => {

    function excelXmlEscape(value) {
      return String(value ?? "")
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&apos;");
    }

    function excelColumnName(index) {
      let value = index;
      let result = "";
      while (value > 0) {
        value -= 1;
        result = String.fromCharCode(65 + value % 26) + result;
        value = Math.floor(value / 26);
      }
      return result;
    }

    function excelDateSerial(dateString) {
      const [year, month, day] = String(dateString || "").split("-").map(Number);
      return (Date.UTC(year, month - 1, day) / 86400000) + 25569;
    }

    function excelIdentifier(value) {
      const text = String(value ?? "");
      return /^\d{11,}$/.test(text) ? `${text}\u200B` : text;
    }

    function excelCellXml(reference, value, column, header = false) {
      if (header) {
        return `<c r="${reference}" s="1" t="inlineStr"><is><t>${excelXmlEscape(value)}</t></is></c>`;
      }
      if (value && typeof value === "object" && typeof value.formula === "string") {
        const style = column.type === "money" ? 2 : column.type === "percent" ? 4 : 0;
        return `<c r="${reference}" s="${style}"><f>${excelXmlEscape(value.formula)}</f><v>${Number(value.value) || 0}</v></c>`;
      }
      if (value == null) return `<c r="${reference}" s="5" t="inlineStr"><is><t></t></is></c>`;
      if (column.type === "date") {
        return `<c r="${reference}" s="3"><v>${excelDateSerial(value)}</v></c>`;
      }
      if (column.type === "money" || column.type === "number" || column.type === "percent") {
        const style = column.type === "money" ? 2 : column.type === "percent" ? 4 : 0;
        return `<c r="${reference}" s="${style}"><v>${Number(value) || 0}</v></c>`;
      }
      const text = String(value);
      const preserve = /^\s|\s$|\n/.test(text) ? ` xml:space="preserve"` : "";
      return `<c r="${reference}" s="5" t="inlineStr"><is><t${preserve}>${excelXmlEscape(text)}</t></is></c>`;
    }

    function excelSheetXml(columns, rows) {
      const lastColumn = excelColumnName(columns.length);
      const lastRow = rows.length + 1;
      const headerCells = columns.map((column, index) => excelCellXml(`${excelColumnName(index + 1)}1`, column.label, column, true)).join("");
      const bodyRows = rows.map((row, rowIndex) => {
        const excelRow = rowIndex + 2;
        const cells = columns.map((column, columnIndex) => {
          const value = typeof column.value === "function" ? column.value(row, excelRow) : row[column.key];
          return excelCellXml(`${excelColumnName(columnIndex + 1)}${excelRow}`, value, column);
        }).join("");
        return `<row r="${excelRow}">${cells}</row>`;
      }).join("");
      const widths = columns.map((column, index) => `<col min="${index + 1}" max="${index + 1}" width="${column.width || 14}" customWidth="1"/>`).join("");
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <dimension ref="A1:${lastColumn}${lastRow}"/>
  <sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
  <sheetFormatPr defaultRowHeight="18"/>
  <cols>${widths}</cols>
  <sheetData><row r="1" ht="24" customHeight="1">${headerCells}</row>${bodyRows}</sheetData>
  <autoFilter ref="A1:${lastColumn}${lastRow}"/>
  <pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/>
</worksheet>`;
    }

    function uint16(value) {
      const bytes = new Uint8Array(2);
      new DataView(bytes.buffer).setUint16(0, value, true);
      return bytes;
    }

    function uint32(value) {
      const bytes = new Uint8Array(4);
      new DataView(bytes.buffer).setUint32(0, value >>> 0, true);
      return bytes;
    }

    function concatBytes(parts) {
      const size = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(size);
      let offset = 0;
      parts.forEach(part => {
        output.set(part, offset);
        offset += part.length;
      });
      return output;
    }

    let crc32Table = null;
    function crc32(bytes) {
      if (!crc32Table) {
        crc32Table = new Uint32Array(256);
        for (let index = 0; index < 256; index += 1) {
          let value = index;
          for (let bit = 0; bit < 8; bit += 1) value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0);
          crc32Table[index] = value >>> 0;
        }
      }
      let value = 0xffffffff;
      bytes.forEach(byte => { value = (value >>> 8) ^ crc32Table[(value ^ byte) & 0xff]; });
      return (value ^ 0xffffffff) >>> 0;
    }

    function zipStoredFiles(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      const now = new Date();
      const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
      const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
      files.forEach(file => {
        const name = encoder.encode(file.name);
        const data = typeof file.data === "string" ? encoder.encode(file.data) : file.data;
        const checksum = crc32(data);
        const localHeader = concatBytes([
          uint32(0x04034b50), uint16(20), uint16(0x0800), uint16(0), uint16(dosTime), uint16(dosDate),
          uint32(checksum), uint32(data.length), uint32(data.length), uint16(name.length), uint16(0)
        ]);
        localParts.push(localHeader, name, data);
        const centralHeader = concatBytes([
          uint32(0x02014b50), uint16(20), uint16(20), uint16(0x0800), uint16(0), uint16(dosTime), uint16(dosDate),
          uint32(checksum), uint32(data.length), uint32(data.length), uint16(name.length), uint16(0), uint16(0),
          uint16(0), uint16(0), uint32(0), uint32(offset)
        ]);
        centralParts.push(centralHeader, name);
        offset += localHeader.length + name.length + data.length;
      });
      const centralDirectory = concatBytes(centralParts);
      const end = concatBytes([
        uint32(0x06054b50), uint16(0), uint16(0), uint16(files.length), uint16(files.length),
        uint32(centralDirectory.length), uint32(offset), uint16(0)
      ]);
      return concatBytes([...localParts, centralDirectory, end]);
    }

    function employeeZipFiles(input) {
      const bytes = input instanceof Uint8Array ? input : new Uint8Array(input);
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const decoder = new TextDecoder("utf-8", { fatal: true });
      const files = new Map();
      let offset = 0;
      while (offset + 4 <= bytes.length) {
        const signature = view.getUint32(offset, true);
        if (signature !== 0x04034b50) break;
        if (offset + 30 > bytes.length) throw new Error("Excel 文件结构不完整");
        const flags = view.getUint16(offset + 6, true);
        const compression = view.getUint16(offset + 8, true);
        const compressedSize = view.getUint32(offset + 18, true);
        const nameLength = view.getUint16(offset + 26, true);
        const extraLength = view.getUint16(offset + 28, true);
        if (flags & 0x0008) throw new Error("请导入员工版直接导出的原始 Excel 文件");
        if (compression !== 0) throw new Error("请勿用 Excel 另存文件，直接导入员工版导出的原文件");
        const nameStart = offset + 30;
        const dataStart = nameStart + nameLength + extraLength;
        const dataEnd = dataStart + compressedSize;
        if (dataEnd > bytes.length) throw new Error("Excel 文件内容不完整");
        const name = decoder.decode(bytes.subarray(nameStart, nameStart + nameLength));
        files.set(name, bytes.slice(dataStart, dataEnd));
        offset = dataEnd;
      }
      if (!files.size) throw new Error("这不是有效的员工账单 Excel 文件");
      return files;
    }

    function employeeColumnIndex(reference) {
      const letters = String(reference || "").match(/^[A-Z]+/)?.[0] || "";
      let index = 0;
      for (const letter of letters) index = index * 26 + letter.charCodeAt(0) - 64;
      return index - 1;
    }

    function employeeSheetRows(xml) {
      const rows = [];
      const seenRows = new Set();
      for (const rowMatch of xml.matchAll(/<row\b[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)) {
        const rowNumber = Number(rowMatch[1]);
        if (!Number.isSafeInteger(rowNumber) || rowNumber < 1 || rowNumber > 10001 || seenRows.has(rowNumber)) throw new Error("Excel 工作表行号无效或记录过多");
        seenRows.add(rowNumber);
        const cells = [];
        for (const cellMatch of rowMatch[2].matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>/g)) {
          const reference = cellMatch[1].match(/\br="([A-Z]+\d+)"/)?.[1];
          if (!reference) continue;
          const referencedRow = Number(reference.match(/\d+$/)?.[0]);
          if (referencedRow !== rowNumber) throw new Error("Excel 单元格行号与工作表不一致");
          const columnIndex = employeeColumnIndex(reference);
          if (!Number.isSafeInteger(columnIndex) || columnIndex < 0 || columnIndex > 63 || cells[columnIndex] != null) throw new Error("Excel 工作表列号无效或存在重复单元格");
          const inline = cellMatch[2].match(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/)?.[1];
          const numeric = cellMatch[2].match(/<v>([\s\S]*?)<\/v>/)?.[1];
          cells[columnIndex] = employeeXmlUnescape(inline != null ? inline : numeric != null ? numeric : "");
        }
        rows.push({ rowNumber, cells });
      }
      return rows.sort((a, b) => a.rowNumber - b.rowNumber);
    }

    function employeeExcelDate(value, rowNumber, label) {
      const text = String(value ?? "").trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      const serial = Number(text);
      if (!Number.isFinite(serial) || serial < 1 || serial > 2958465) throw new Error(`第 ${rowNumber} 行${label}无效`);
      return new Date(Math.round(serial - 25569) * 86400000).toISOString().slice(0, 10);
    }

    function employeeMoneyCents(value, rowNumber, label, allowZero = false) {
      const text = String(value ?? "").trim();
      if (!/^\d+(?:\.\d{1,2})?$/.test(text)) throw new Error(`第 ${rowNumber} 行${label}必须精确到分`);
      const cents = Math.round(Number(text) * 100);
      if (!Number.isSafeInteger(cents) || cents < (allowZero ? 0 : 1)) throw new Error(`第 ${rowNumber} 行${label}无效`);
      return cents;
    }

    function employeeDescription(row) {
      const prefix = `[${row.businessType}] `;
      return `${prefix}${row.projectName.slice(0, 120 - prefix.length)}`;
    }

    function employeeNotes(row) {
      const parts = [`员工录单：${row.recordNo}`, `单位：${row.unit || "件"}`];
      if (row.recorder) parts.push(`经办人：${row.recorder}`);
      if (row.styleNo) parts.push(`款号/版号：${row.styleNo}`);
      if (row.specification) parts.push(`颜色/尺码/规格：${row.specification}`);
      if (`[${row.businessType}] ${row.projectName}`.length > 120) parts.push(`完整项目：${row.projectName}`);
      const metadata = parts.join("；");
      if (!row.notes) return metadata.slice(0, 500);
      if (row.notes.length >= 500) return row.notes.slice(0, 500);
      return `${row.notes}；${metadata}`.slice(0, 500);
    }

    function parseEmployeeWorkbook(input) {
      const files = employeeZipFiles(input);
      const sheetBytes = files.get("xl/worksheets/sheet1.xml");
      if (!sheetBytes) throw new Error("文件中找不到员工账单工作表");
      const xml = new TextDecoder("utf-8", { fatal: true }).decode(sheetBytes);
      const rows = employeeSheetRows(xml);
      const headers = rows.find(row => row.rowNumber === 1)?.cells || [];
      const normalizedHeaders = headers.map(header => String(header || "").trim());
      const repeatedHeaders = normalizedHeaders.filter((header, index) => header && normalizedHeaders.indexOf(header) !== index);
      if (repeatedHeaders.length) throw new Error(`Excel 表头重复：${repeatedHeaders[0]}`);
      const missing = EMPLOYEE_REQUIRED_COLUMNS.filter(header => !normalizedHeaders.includes(header));
      if (missing.length) throw new Error(`Excel 缺少字段：${missing.slice(0, 3).join("、")}`);
      const column = Object.fromEntries(normalizedHeaders.map((header, index) => [header, index]));
      const parsed = [];
      const numbers = new Set();
      for (const rowEntry of rows.filter(row => row.rowNumber > 1)) {
        const cells = rowEntry.cells;
        if (!cells.some(value => String(value ?? "").trim())) continue;
        const rowNumber = rowEntry.rowNumber;
        const get = label => String(cells[column[label]] ?? "").trim().normalize("NFKC");
        if (get("系统标识") !== EMPLOYEE_WORKBOOK_TAG) throw new Error(`第 ${rowNumber} 行不是本系统员工账单数据`);
        const recordNo = get("录单编号");
        if (!/^[A-Za-z0-9_-]{1,40}$/.test(recordNo)) throw new Error(`第 ${rowNumber} 行录单编号无效`);
        const recordKey = recordNo.toLocaleLowerCase("zh-CN");
        if (numbers.has(recordKey)) throw new Error(`文件内录单编号重复：${recordNo}`);
        numbers.add(recordKey);
        const date = employeeExcelDate(get("业务日期"), rowNumber, "业务日期");
        const dueDate = employeeExcelDate(get("预计收款日"), rowNumber, "预计收款日");
        if (dueDate < date) throw new Error(`第 ${rowNumber} 行预计收款日不能早于业务日期`);
        const customer = get("客户名称");
        const businessType = get("业务类型");
        const projectName = get("项目名称");
        if (!customer || customer.length > 80 || !projectName || projectName.length > 120 || !EMPLOYEE_BUSINESS_TYPES.includes(businessType)) throw new Error(`第 ${rowNumber} 行客户、类型或项目名称无效`);
        const quantityText = get("数量");
        if (!/^\d+$/.test(quantityText)) throw new Error(`第 ${rowNumber} 行数量必须是正整数`);
        const quantity = Number(quantityText);
        if (!Number.isSafeInteger(quantity) || quantity <= 0) throw new Error(`第 ${rowNumber} 行数量无效`);
        const unitPriceCents = employeeMoneyCents(get("单价"), rowNumber, "单价");
        const amountCents = quantity * unitPriceCents;
        if (!Number.isSafeInteger(amountCents)) throw new Error(`第 ${rowNumber} 行总金额超出安全范围`);
        const exportedTotalCents = employeeMoneyCents(get("总金额"), rowNumber, "总金额");
        if (exportedTotalCents !== amountCents) throw new Error(`第 ${rowNumber} 行总金额与数量 × 单价不一致`);
        const taxLabel = get("税务属性");
        const taxMode = taxLabel === "含税" ? "included" : taxLabel === "未税另加税" ? "excluded" : taxLabel === "无税" ? "no_tax" : "";
        const taxRateNumber = Number(get("税率(%)"));
        const taxRateBps = taxMode === "no_tax" ? 0 : Math.round(taxRateNumber * 100);
        const exactRate = Number.isFinite(taxRateNumber) && Math.abs(taxRateNumber * 100 - Math.round(taxRateNumber * 100)) < 1e-8;
        if (!taxMode || !exactRate || !TAX_RATES.includes(taxRateBps) || (taxMode === "no_tax" && taxRateNumber !== 0)) throw new Error(`第 ${rowNumber} 行税务属性或税率无效`);
        const invoiceText = get("是否需要开票");
        if (!["是", "否"].includes(invoiceText)) throw new Error(`第 ${rowNumber} 行是否需要开票必须填写“是”或“否”`);
        const row = {
          recordNo, date, dueDate, customer, businessType, projectName,
          styleNo: get("款号/版号").slice(0, 60), specification: get("颜色/尺码/规格").slice(0, 80),
          quantity, unit: get("单位").slice(0, 20), unitPriceCents, amountCents,
          taxMode, taxRateBps, invoiceRequired: invoiceText === "是",
          recorder: get("经办人").slice(0, 60), notes: get("备注").slice(0, 500),
          exportBatch: get("导出批次").slice(0, 80)
        };
        parsed.push({
          id: uniqueId("bill"), billNo: row.recordNo, customer: row.customer, date: row.date, dueDate: row.dueDate,
          description: employeeDescription(row), quantity: row.quantity, unitPriceCents: row.unitPriceCents,
          amountCents: row.amountCents, taxMode: row.taxMode, taxRateBps: row.taxRateBps,
          invoiceRequired: row.invoiceRequired, notes: employeeNotes(row), createdAt: nowISO()
        });
      }
      if (!parsed.length) throw new Error("员工账单 Excel 中没有可导入的记录");
      return parsed;
    }

    function employeeBillEquivalent(left, right) {
      return ["billNo", "customer", "date", "dueDate", "description", "quantity", "unitPriceCents", "amountCents", "taxMode", "taxRateBps", "invoiceRequired", "notes"]
        .every(key => left?.[key] === right?.[key]);
    }

    function employeeBillNumberReserved(ledger, billNo) {
      const normalized = String(billNo || "").trim().toLocaleLowerCase("zh-CN");
      if (!normalized) return false;
      if ((ledger.bills || []).some(item => String(item.billNo || "").trim().toLocaleLowerCase("zh-CN") === normalized)) return true;
      return (ledger.archivedRecords || []).some(item => {
        if (item.archivedType === "bill" && String(item.record?.billNo || "").trim().toLocaleLowerCase("zh-CN") === normalized) return true;
        const snapshots = item.archivedType === "payment"
          ? item.billSnapshot ? [item.billSnapshot] : []
          : item.archivedType === "invoice" ? item.billSnapshots || [] : [];
        return snapshots.some(snapshot => String(snapshot.billNo || "").trim().toLocaleLowerCase("zh-CN") === normalized);
      });
    }

    function planEmployeeImport(input, ledger = state) {
      const bills = parseEmployeeWorkbook(input);
      const newBills = [];
      const duplicateNumbers = [];
      const conflictNumbers = [];
      bills.forEach(bill => {
        const active = (ledger.bills || []).find(existing => String(existing.billNo).trim().toLocaleLowerCase("zh-CN") === bill.billNo.trim().toLocaleLowerCase("zh-CN"));
        if (active) {
          if (employeeBillEquivalent(active, bill)) duplicateNumbers.push(bill.billNo);
          else conflictNumbers.push(bill.billNo);
          return;
        }
        const archivedBill = (ledger.archivedRecords || []).find(item => item.archivedType === "bill"
          && String(item.record?.billNo || "").trim().toLocaleLowerCase("zh-CN") === bill.billNo.trim().toLocaleLowerCase("zh-CN"));
        if (archivedBill) {
          if (employeeBillEquivalent(archivedBill.record, bill)) duplicateNumbers.push(bill.billNo);
          else conflictNumbers.push(bill.billNo);
          return;
        }
        if (employeeBillNumberReserved(ledger, bill.billNo)) conflictNumbers.push(bill.billNo);
        else newBills.push(bill);
      });
      return { bills, newBills, duplicateNumbers, conflictNumbers };
    }

    async function importEmployeeWorkbook(file) {
      try {
        if (!file || file.size > 10 * 1024 * 1024) throw new Error("文件过大，请按月份分别导出后导入");
        const plan = planEmployeeImport(new Uint8Array(await file.arrayBuffer()));
        if (plan.conflictNumbers.length) {
          throw new Error(`录单编号 ${plan.conflictNumbers.slice(0, 3).join("、")} 已存在但内容不同，请先核对`);
        }
        if (!plan.newBills.length) {
          return toast(`没有新增账单，${plan.duplicateNumbers.length} 条记录已导入过或曾被作废`, "error", 5000);
        }
        const candidate = { ...state, bills: [...state.bills, ...plan.newBills] };
        if (!isValidState(candidate)) throw new Error("导入后的账本未通过完整性校验");
        const gross = plan.newBills.reduce((sum, bill) => sum + taxDetails(bill).gross, 0);
        askConfirm({
          title: "确认导入员工账单",
          message: `将新增 ${plan.newBills.length} 张客户账单，最终应收合计 ${money(gross)}。${plan.duplicateNumbers.length ? `另有 ${plan.duplicateNumbers.length} 条重复记录会自动跳过。` : ""}导入后可继续登记回款和发票。`,
          confirmLabel: "确认导入",
          danger: false
        }, async () => {
          state.bills.push(...plan.newBills);
          if (await saveState(`已导入 ${plan.newBills.length} 张员工账单`)) {
            ui.view = "bills";
            ui.month = plan.newBills[0].date.slice(0, 7);
            ui.listAll = false;
            render();
          }
        });
      } catch (error) {
        toast(`无法导入：${String(error?.message || "请选择员工版直接导出的有效 Excel")}`.slice(0, 220), "error", 6200);
      } finally {
        employeeImportInput.value = "";
      }
    }

    async function importBackup(file) {
      try {
        const text = await file.text();
        const parsed = normalizeState(JSON.parse(text));
        if (!isValidState(parsed)) throw new Error("格式错误");
        askConfirm({
          title: "导入并覆盖当前账本",
          message: `备份包含 ${parsed.bills.length} 张账单、${parsed.payments.length} 笔回款、${parsed.invoices.length} 张发票和 ${parsed.expenses.length} 笔支出。确认后将完整替换当前本地数据。`,
          confirmLabel: "确认导入",
          danger: false
        }, async () => {
          state = normalizeState(parsed);
          if (await saveState("备份已成功导入")) {
            ui.view = "dashboard";
            ui.listAll = false;
            render();
          }
        });
      } catch (error) {
        toast("无法导入：请选择由本系统导出的有效 JSON 备份", "error", 5000);
      } finally {
        backupInput.value = "";
      }
    }

    function navigate(view) {
      if (!view) return;
      const searchBox = globalSearch.closest(".search-box");
      const searchToggle = document.getElementById("mobileSearchToggle");
      searchBox?.classList.toggle("mobile-open", Boolean(ui.query));
      searchToggle?.setAttribute("aria-expanded", String(Boolean(ui.query)));
      ui.view = view;
      ui.listAll = false;
      if (view === "bills") {
        ui.status = "all";
        ui.invoiceStatus = "all";
      } else if (view === "invoices") {
        ui.invoiceStatus = "all";
      } else if (view === "expenses") {
        ui.category = "all";
      }
      render();
      document.getElementById("mainContent")?.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("click", async event => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        navigate(viewButton.dataset.view);
        return;
      }

      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const id = button.dataset.id || "";

      if (action === "add-bill") openRecordDialog("bill", "", "", button);
      if (action === "add-payment") openRecordDialog("payment", "", id, button);
      if (action === "add-expense") openRecordDialog("expense", "", "", button);
      if (action === "add-invoice") openRecordDialog("invoice", "", id, button);
      if (action === "edit") openRecordDialog(button.dataset.type, id, "", button);
      if (action === "delete") deleteRecord(button.dataset.type, id, button);
      if (action === "toggle-all") { ui.listAll = !ui.listAll; render(); }
      if (action === "set-current-month") { ui.listAll = false; render(); }
      if (action === "export") exportBackup();
      if (action === "export-excel") exportExcel();
      if (action === "import-employee") employeeImportInput.click();
      if (action === "export-recovery") exportRecoveryBackup();
      if (action === "import") backupInput.click();
      if (action === "save-company") {
        const input = document.getElementById("companyName");
        const value = input?.value.trim();
        if (!value) return toast("账本名称不能为空", "error");
        state.companyName = value;
        if (await saveState("账本名称已保存")) render();
      }
      if (action === "restore-demo") {
        askConfirm({ title: "恢复示例数据", message: "当前账本会被示例数据完整替换。建议先导出备份。", confirmLabel: "恢复示例", danger: true }, async () => {
          state = makeDemoState();
          if (await saveState("示例数据已恢复")) {
            ui.view = "dashboard";
            ui.query = "";
            globalSearch.value = "";
            render();
          }
        }, button);
      }
      if (action === "clear-data") {
        askConfirm({ title: "清空全部本地数据", message: "所有账单、回款、发票和支出都将被删除，且无法撤销。请确认已导出需要保留的备份。", confirmLabel: "永久清空", danger: true }, async () => {
          state = blankState();
          if (await saveState("全部数据已清空")) {
            ui.view = "dashboard";
            ui.query = "";
            globalSearch.value = "";
            render();
          }
        }, button);
      }
    });

    document.addEventListener("click", event => {
      const filter = event.target.closest("[data-filter]");
      if (!filter) return;
      const filterName = filter.dataset.filter;
      const filterValue = filter.dataset.value;
      ui[filterName] = filterValue;
      render();
      [...viewContainer.querySelectorAll(`[data-filter="${filterName}"]`)]
        .find(button => button.dataset.value === filterValue)?.focus({ preventScroll: true });
    });

    function syncDefaultDueDate(target) {
      // Only new, untouched bill terms follow the issue date. Existing/custom terms stay intact.
      if (recordForm.elements.recordType?.value !== "bill" || recordForm.dataset.autoDueDate !== "true") return;
      if (target.id === "dueDate") {
        recordForm.dataset.autoDueDate = "false";
      } else if (target.id === "billDate" && target.value && target.validity.valid) {
        recordForm.elements.dueDate.value = addDays(target.value, 7);
      }
    }

    recordForm.addEventListener("submit", submitRecord);
    recordForm.addEventListener("input", event => {
      event.target.removeAttribute?.("aria-invalid");
      syncDefaultDueDate(event.target);
      updateFormPreview();
    });
    recordForm.addEventListener("change", event => {
      syncDefaultDueDate(event.target);
      if (recordForm.elements.recordType?.value === "invoice") {
        if (event.target.id === "invoiceCustomer") resetInvoiceAllocationList(event.target.value);
        if (event.target.matches?.("[data-invoice-allocation-check]")) toggleInvoiceAllocation(event.target);
      }
      updateFormPreview();
    });
    recordForm.addEventListener("click", event => {
      if (event.target.closest("[data-dialog-close]")) recordDialog.close();
    });
    recordDialog.addEventListener("close", () => {
      if (lastTrigger?.isConnected) lastTrigger.focus();
    });

    document.getElementById("confirmCancel").addEventListener("click", () => {
      confirmAction = null;
      confirmDialog.close();
    });
    document.getElementById("confirmOk").addEventListener("click", () => {
      const action = confirmAction;
      confirmAction = null;
      confirmDialog.close();
      if (typeof action === "function") action();
    });
    confirmDialog.addEventListener("close", () => {
      if (lastTrigger?.isConnected) lastTrigger.focus();
    });

    document.getElementById("globalAddBill").addEventListener("click", event => openRecordDialog("bill", "", "", event.currentTarget));
    document.getElementById("mobileSearchToggle").addEventListener("click", event => {
      const box = globalSearch.closest(".search-box");
      const isOpen = box.classList.toggle("mobile-open");
      event.currentTarget.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) {
        globalSearch.focus();
      } else if (ui.query) {
        ui.query = "";
        globalSearch.value = "";
        render();
      }
    });
    document.getElementById("prevMonth").addEventListener("click", () => { ui.month = shiftMonth(ui.month, -1); render(); });
    document.getElementById("nextMonth").addEventListener("click", () => { ui.month = shiftMonth(ui.month, 1); render(); });
    monthPicker.addEventListener("change", () => {
      if (!monthPicker.value) return;
      ui.month = monthPicker.value;
      ui.listAll = false;
      render();
    });
    globalSearch.addEventListener("input", () => {
      ui.query = globalSearch.value;
      render();
    });
    globalSearch.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      ui.query = "";
      globalSearch.value = "";
      render();
      globalSearch.closest(".search-box")?.classList.remove("mobile-open");
      document.getElementById("mobileSearchToggle")?.setAttribute("aria-expanded", "false");
      document.getElementById("mobileSearchToggle")?.focus();
    });
    backupInput.addEventListener("change", () => {
      const file = backupInput.files?.[0];
      if (file) importBackup(file);
    });
    employeeImportInput.addEventListener("change", () => {
      const file = employeeImportInput.files?.[0];
      if (file) importEmployeeWorkbook(file);
    });

    window.addEventListener("storage", event => {
      if (event.key !== STORE_KEY || !event.newValue) return;
      try {
        const parsed = normalizeState(JSON.parse(event.newValue));
        if (!isValidState(parsed)) return;
        const incoming = parsed;
        if (incoming.revision < state.revision) return;
        const incomingSnapshot = JSON.stringify(incoming);
        const sameRevisionConflict = incoming.revision === state.revision && incomingSnapshot !== persistedSnapshot;
        if (incoming.revision === state.revision && !sameRevisionConflict) return;
        if (sameRevisionConflict) {
          try {
            demoStorage.setItem(RECOVERY_KEY, JSON.stringify({
              type: "same-revision-conflict",
              preservedAt: nowISO(),
              localSnapshot: JSON.parse(persistedSnapshot),
              incomingSnapshot: incoming
            }));
          } catch (recoveryError) { /* Continue by following the value currently stored on disk. */ }
        }
        const interruptedEdit = Boolean(recordDialog.open || confirmDialog.open);
        if (recordDialog.open) recordDialog.close();
        if (confirmDialog.open) {
          confirmAction = null;
          confirmDialog.close();
        }
        state = incoming;
        persistedSnapshot = incomingSnapshot;
        setSaveFeedback(sameRevisionConflict || interruptedEdit ? "warning" : "saved", sameRevisionConflict ? "检测到账本版本冲突，请导出恢复副本并核对。" : interruptedEdit ? "已同步另一页面的账本，刚才的编辑未保存，请重新操作。" : "");
        render();
        toast(sameRevisionConflict
          ? "检测到异常的同版本冲突，双方副本已保留到恢复备份，本页已跟随磁盘中的最新账本"
          : interruptedEdit ? "检测到另一页面的数据更新，已关闭当前编辑以避免覆盖最新记录" : "已同步同一浏览器中的最新数据",
        sameRevisionConflict || interruptedEdit ? "error" : "success", sameRevisionConflict ? 6200 : interruptedEdit ? 5200 : 2600);
      } catch (error) {
        // Ignore invalid cross-tab values without affecting the current in-memory ledger.
      }
    });

    window.__ZH_FINANCE__ = Object.freeze({
      version: STORE_VERSION,
      demo: Object.freeze({ namespace: STORE_KEY, asOf: DEMO_TODAY }),
      summary: month => ({ ...monthStats(month || ui.month) }),
      snapshot: () => JSON.parse(JSON.stringify(state)),
      taxDetails: record => ({ ...taxDetails(record) }),
      paymentNetAllocations: (bill, payments) => paymentNetAllocations(bill, payments).map(item => ({ ...item })),
      validateState: value => isValidState(value),
      normalizeState: value => JSON.parse(JSON.stringify(normalizeState(value))),
      buildReconciliationWorkbook: () => buildReconciliationWorkbook(),
      parseEmployeeWorkbook: input => parseEmployeeWorkbook(input).map(item => ({ ...item })),
      planEmployeeImport: (input, ledger) => {
        const plan = planEmployeeImport(input, ledger || state);
        return {
          bills: plan.bills.map(item => ({ ...item })),
          newBills: plan.newBills.map(item => ({ ...item })),
          duplicateNumbers: [...plan.duplicateNumbers],
          conflictNumbers: [...plan.conflictNumbers]
        };
      }
    });

    render();
    if (loadNotice) window.setTimeout(() => toast(loadNotice, loadNotice.includes("无法") ? "error" : "success", 4800), 100);
  })();
  </script>
