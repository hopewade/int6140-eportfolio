<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跟单系统 · 作品集演示</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #68758b;
      --line: #dfe6f0;
      --line-soft: #edf1f7;
      --soft: #f6f8fc;
      --indigo: #4f5ee8;
      --indigo-strong: #3d49cf;
      --cyan: #06a8bd;
      --sky: #0ea5e9;
      --green: #07886b;
      --amber: #d97706;
      --red: #e11d48;
      --violet: #8b5cf6;
      --rose: #e11d48;
      --deep: #111a2e;
      --shadow: 0 8px 30px rgba(25, 39, 72, .07);
      --shadow-soft: 0 18px 44px rgba(25, 39, 72, .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 78% -12%, rgba(79,94,232,.10), transparent 32%),
        radial-gradient(circle at 20% 110%, rgba(6,168,189,.08), transparent 30%),
        var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 264px 1fr; }
    .side {
      background:
        radial-gradient(circle at 20% 0, rgba(99,102,241,.30), transparent 34%),
        linear-gradient(180deg, rgba(79,94,232,.10), transparent 46%),
        var(--deep);
      color: #cbd5e1;
      padding: 26px 17px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 12px 0 40px rgba(15, 23, 42, .12);
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 8;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 8px 8px 20px; border-bottom: 1px solid rgba(255,255,255,.10); }
    .mark { width: 46px; height: 46px; border-radius: 15px; background: linear-gradient(135deg, #7c83ff, #3453d7); display: grid; place-items: center; color: #fff; font-weight: 900; box-shadow: 0 12px 26px rgba(79,94,232,.40); font-size: 12px; }
    .brand strong { color: #fff; display: block; font-size: 18px; line-height: 1.15; font-weight: 900; }
    .brand span { display: block; color: #9ca3af; font-size: 12px; margin-top: 2px; }
    .nav { display: grid; gap: 8px; }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 13px 14px;
      border-radius: 13px;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: .16s ease;
      position: relative;
      font-weight: 700;
    }
    .nav button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #6b768a; flex: 0 0 auto; }
    .nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav button.active { background: linear-gradient(135deg, #5b67ed, #4351d6); color: #fff; box-shadow: 0 14px 30px rgba(49,63,184,.34); }
    .nav button.active::before { background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.16); }
    .side-foot { margin-top: auto; color: #a0abc0; font-size: 12px; line-height: 1.7; padding: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; background: rgba(255,255,255,.04); }
    .main { min-width: 0; padding: 28px 32px 48px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      padding: 24px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.90);
      border-radius: 24px;
      box-shadow: var(--shadow);
      position: relative;
      top: auto;
      z-index: 1;
      overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .topbar::after {
      content: "";
      position: absolute;
      right: -96px;
      top: -110px;
      width: 288px;
      height: 288px;
      border-radius: 999px;
      background: #eef2ff;
      filter: blur(54px);
      pointer-events: none;
    }
    .title, .actions { position: relative; z-index: 1; }
    .title h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 900; }
    .title p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 900;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      box-shadow: 0 1px 2px rgba(15,23,42,.05);
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: #c7d2fe; box-shadow: var(--shadow-soft); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible, .nav button:focus-visible { outline: 3px solid rgba(79,94,232,.24); outline-offset: 2px; }
    .btn.primary { background: linear-gradient(135deg, #5c68ed, #4351d5); color: #fff; border-color: transparent; box-shadow: 0 8px 18px rgba(67,81,213,.22); }
    .btn.green { background: linear-gradient(135deg, #0b9a79, #08755e); color: #fff; border-color: transparent; box-shadow: 0 8px 18px rgba(8,117,94,.18); }
    .btn.red { color: var(--red); }
    .btn.dark { background: var(--deep); color: #fff; border-color: var(--deep); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px; background: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(14px); }
    .input, .select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 11px;
      padding: 10px 12px;
      outline: none;
      min-height: 40px;
      color: var(--ink);
      transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
    }
    textarea { resize: vertical; line-height: 1.55; }
    .input:focus, .select:focus, textarea:focus { background: #fff; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, .14); }
    .search { flex: 1 1 280px; }
    .filter { flex: 0 0 152px; }
    .grid { display: grid; gap: 14px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
    .stat {
      background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(248,250,255,.92));
      border: 1px solid rgba(255,255,255,.94);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .stat::after { content: ""; position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border-radius: 15px; background: rgba(79,70,229,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); }
    .stat.orders::after { background: rgba(79,70,229,.12); }
    .stat.late::after { background: rgba(225,29,72,.12); }
    .stat.today::after { background: rgba(217,119,6,.14); }
    .stat.materials::after { background: rgba(14,165,233,.14); }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 800; }
    .stat strong { display: block; font-size: 30px; margin-top: 8px; line-height: 1; font-weight: 900; }
    .split { grid-template-columns: minmax(0, 1.1fr) minmax(380px, .9fr); align-items: start; }
    .order-workspace { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); }
    .panel {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border-color: rgba(222,229,240,.82);
    }
    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      background: linear-gradient(180deg, #fff, #fcfdff);
    }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 900; }
    .panel-body { padding: 22px; }
    .orders { display: grid; gap: 10px; }
    .order-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 17px;
      padding: 16px;
      display: grid;
      gap: 10px;
      transition: .15s ease;
      position: relative;
      overflow: hidden;
    }
    .order-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--cyan); opacity: .85; }
    .order-card.bulk::before { background: var(--violet); }
    .order-card.sample::before { background: var(--cyan); }
    .order-card.late-order::before { background: var(--red); }
    .order-card:hover, .order-card.selected { border-color: #bfc8ff; box-shadow: 0 14px 30px rgba(79,94,232,.13); transform: translateY(-1px); }
    .order-card.selected { background: linear-gradient(135deg, #fff, #f6f7ff); }
    .order-card strong { padding-left: 3px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row.wrap { flex-wrap: wrap; }
    .meta { color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 12px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      background: var(--soft);
      color: var(--muted);
      border: 1px solid transparent;
    }
    .badge.sample { background: #ecfeff; color: #0e7490; border-color: #a5f3fc; }
    .badge.bulk { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .badge.late { background: #fff1f2; color: #be123c; border-color: #fecdd3; }
    .badge.ok { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .badge.warn { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .progress {
      width: 100%;
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--indigo), var(--cyan)); box-shadow: 0 0 12px rgba(79,70,229,.20); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    label span { display: block; }
    .wide { grid-column: 1 / -1; }
    .field-block { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field-label { display: block; }
    .section-card { padding: 16px; border: 1px solid var(--line); border-radius: 17px; background: linear-gradient(145deg, #fbfcff, #f6f8fc); }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; color: var(--ink); font-size: 14px; font-weight: 900; }
    .section-hint { color: var(--muted); font-size: 11px; font-weight: 600; }
    .list-edit { display: grid; gap: 8px; padding: 10px; background: #f8fafc; border: 1px solid var(--line); border-radius: 16px; }
    .list-line { display: grid; grid-template-columns: 1fr 34px; gap: 8px; align-items: start; }
    .image-strip { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px; border: 1px solid var(--line); border-radius: 17px; background: #f8faff; }
    .thumb { width: 112px; height: 112px; border: 1px solid var(--line); border-radius: 16px; background: #fff; position: relative; overflow: hidden; box-shadow: 0 8px 18px rgba(15,23,42,.07); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .thumb button { position: absolute; right: 6px; top: 6px; border: 0; background: rgba(225,29,72,.94); color: #fff; border-radius: 8px; width: 25px; height: 25px; display: grid; place-items: center; box-shadow: 0 5px 12px rgba(159,18,57,.25); }
    .upload {
      width: 112px;
      height: 112px;
      border: 1.5px dashed #8e9ab1;
      border-radius: 16px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: linear-gradient(145deg, #fff, #f4f6ff);
      font-size: 12px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .upload:hover { border-color: var(--indigo); background: #f0f2ff; transform: translateY(-1px); color: var(--indigo-strong); }
    .upload input, .hidden-input { display: none; }
    .table-wrap { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line-soft); padding: 12px 10px; text-align: left; vertical-align: top; }
    th { background: #f6f8fc; color: var(--muted); font-size: 12px; font-weight: 900; white-space: nowrap; word-break: keep-all; }
    tbody tr:hover { background: #f8fafc; }
    .matrix-table { min-width: 560px; }
    .matrix-table th, .matrix-table td { padding: 7px; text-align: center; vertical-align: middle; }
    .matrix-table th:first-child, .matrix-table td:first-child { min-width: 132px; text-align: left; }
    .matrix-table .input { min-width: 74px; padding: 8px; text-align: center; }
    .matrix-total { min-width: 78px; font-weight: 900; color: var(--indigo-strong); background: #f4f5ff; white-space: nowrap; word-break: keep-all; }
    .mini-btn { border: 0; border-radius: 8px; background: #fff1f2; color: var(--red); width: 26px; height: 26px; font-weight: 900; cursor: pointer; }
    .mini-btn:disabled { opacity: .35; cursor: not-allowed; }
    .material-summary { margin-top: 18px; border: 1px solid #cfe4df; border-radius: 17px; overflow: hidden; background: #fff; }
    .material-summary-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: linear-gradient(135deg, #f0fdf9, #f4f8ff); border-bottom: 1px solid #dbeae7; }
    .material-summary-head strong { font-size: 14px; }
    .money-summary { display: flex; gap: 8px; flex-wrap: wrap; }
    .money-summary .badge { font-variant-numeric: tabular-nums; }
    .check-control { display: inline-flex; grid-auto-flow: column; align-items: center; gap: 7px; cursor: pointer; color: var(--ink); }
    .check-control input { width: 17px; height: 17px; accent-color: var(--green); }
    .timeline { overflow: auto; padding-bottom: 8px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .timeline-row { display: grid; grid-template-columns: 205px max-content; width: max-content; min-width: 100%; border-bottom: 1px solid var(--line-soft); }
    .timeline-row:last-child { border-bottom: 0; }
    .timeline-title { padding: 12px 14px; background: #fff; border-right: 1px solid var(--line); position: sticky; left: 0; z-index: 2; box-shadow: 5px 0 10px rgba(23,32,51,.035); }
    .timeline-header { position: sticky; top: 0; z-index: 4; }
    .timeline-header .timeline-title { display: flex; align-items: center; font-size: 12px; font-weight: 900; background: #f5f7fb; z-index: 5; }
    .timeline-dates { display: flex; min-height: 56px; background: #f5f7fb; }
    .timeline-date { width: 46px; flex: 0 0 46px; display: grid; place-items: center; align-content: center; gap: 2px; border-right: 1px solid var(--line); color: var(--muted); font-size: 10px; line-height: 1.1; }
    .timeline-date strong { color: var(--ink); font-size: 11px; }
    .timeline-date.weekend { background: #f8f3ff; }
    .timeline-date.today { background: #e9ecff; color: var(--indigo-strong); box-shadow: inset 0 -3px 0 var(--indigo); }
    .bar-wrap { position: relative; min-height: 56px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 46px 100%; }
    .bar { position: absolute; top: 14px; height: 28px; border-radius: 999px; background: var(--indigo); min-width: 34px; color: #fff; font-size: 11px; overflow: hidden; white-space: nowrap; box-shadow: 0 8px 18px rgba(79,70,229,.20); font-weight: 900; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0 9px; }
    .empty { color: var(--muted); text-align: center; padding: 34px 24px; border: 1px dashed #cbd5e1; border-radius: 16px; background: #f8fafc; }
    .notice {
      border: 1px solid #b7e2ea;
      background: #ecfeff;
      color: #155e75;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .print-sheet { display: none; }
    .danger-zone { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .side { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; overflow-x: auto; }
      .brand { border-bottom: 0; padding: 0 8px; min-width: 190px; }
      .nav { display: flex; min-width: max-content; }
      .side-foot { display: none; }
      .split, .stats { grid-template-columns: 1fr; }
      .form-grid, .form-grid.three { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; position: relative; top: 0; }
      .actions { justify-content: flex-start; }
    }

    @media (min-width: 981px) and (max-width: 1180px) {
      .order-workspace { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .main { padding: 18px 14px 36px; }
      .topbar { padding: 18px; border-radius: 20px; }
      .title h1 { font-size: 25px; }
      .panel-body { padding: 16px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .thumb, .upload { width: 96px; height: 96px; }
      .material-summary-head { align-items: flex-start; flex-direction: column; }
    }

    /* UI refresh: screen-only so the proven print layout stays unchanged. */
    @media screen {
      :root {
        --bg: #eef3f5;
        --panel: #ffffff;
        --ink: #1c1d21;
        --muted: #777c86;
        --line: #e5e7eb;
        --line-soft: #eff0f2;
        --soft: #f8f8f7;
        --indigo: #7658da;
        --indigo-strong: #5c41be;
        --cyan: #168b91;
        --sky: #3d89c7;
        --green: #237d63;
        --amber: #a96312;
        --red: #c63e5e;
        --violet: #7658da;
        --rose: #c63e5e;
        --deep: #202126;
        --shadow: 0 1px 2px rgba(30,31,36,.025), 0 10px 26px rgba(30,31,36,.045);
        --shadow-soft: 0 16px 36px rgba(30,31,36,.08);
      }

      html { scrollbar-gutter: stable; }
      body {
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #c8ccd2; border: 2px solid transparent; border-radius: 999px; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: #aaafb8; border: 2px solid transparent; background-clip: padding-box; }

      .app { grid-template-columns: 230px minmax(0, 1fr); background: #f8f9f8; }
      .side {
        padding: 24px 15px 18px;
        gap: 22px;
        background: #ffffff;
        box-shadow: none;
        border-right: 1px solid var(--line);
        color: #62666f;
      }
      .brand { gap: 11px; padding: 4px 8px 21px; border-bottom-color: var(--line-soft); }
      .mark {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: linear-gradient(135deg, #9c7cf0 0%, #7253da 52%, #52c8d2 100%);
        box-shadow: 0 8px 18px rgba(109,79,205,.22);
        letter-spacing: .5px;
      }
      .brand strong { color: var(--ink); font-size: 17px; font-weight: 800; letter-spacing: .1px; }
      .brand span { color: #969aa2; font-size: 11px; margin-top: 3px; }
      .nav { gap: 5px; }
      .nav button {
        min-height: 44px;
        padding: 10px 12px;
        gap: 11px;
        border-radius: 10px;
        color: #656a73;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .nav button::before { display: none; }
      .nav button:hover { background: #f5f5f4; color: var(--ink); transform: translateX(1px); }
      .nav button.active {
        background: linear-gradient(100deg, rgba(166,128,242,.24), rgba(111,218,230,.22) 56%, rgba(255,211,125,.20));
        color: #28222f;
        box-shadow: inset 0 0 0 1px rgba(112,78,194,.055);
      }
      .nav-icon {
        width: 20px;
        height: 20px;
        display: inline-grid;
        place-items: center;
        flex: 0 0 20px;
        color: #8d929a;
      }
      .nav-icon svg { width: 18px; height: 18px; display: block; }
      .nav button:hover .nav-icon { color: #383a40; }
      .nav button.active .nav-icon { color: var(--indigo-strong); }
      .side-foot {
        padding: 13px 14px;
        border-radius: 11px;
        border-color: var(--line);
        background: #f7f7f6;
        color: #858991;
        line-height: 1.65;
      }

      .main {
        width: 100%;

  <script>
/* WAREHOUSE CORE START */
    // Warehouse quantities are kept separately from legacy parcel descriptions.
    const WH_AREAS = { A: '面料色卡', B: '布料', C: '辅料', D: '成品' };
    let warehouseBusy = false;
    function whNumber(value) { return Math.round(Number(value) * 1000) / 1000; }
    function whText(value) { return String(value ?? '').trim(); }
    function whCode(item) { return `${item.area}-${item.shelf}-${String(item.serial).padStart(4, '0')}`; }
    function whCloneWarehouse() {
      const current = state.warehouse;
      // Images and old ledger rows are immutable here; avoid serializing every photo on each operation.
      return {items:current.items.map(item => ({...item,images:[...(item.images || [])],orderLinks:[...item.orderLinks]})),transactions:current.transactions.slice(),shelves:Object.fromEntries(Object.entries(current.shelves).map(([area,shelves]) => [area,shelves.slice()]))};
    }
    function whItemKey(item) {
      return ['area','shelf','name','spec','color','batch','unit','supplier','styleNo','size','composition','width','weight'].map(key => whText(item[key]).toLowerCase()).join('\u001f');
    }
    function normalizeWarehouse(source) {
      const raw = source && typeof source === 'object' ? source : {};
      const shelves = {};
      for (const area of ['A','B','C','D']) {
        shelves[area] = [...new Set((Array.isArray(raw.shelves?.[area]) ? raw.shelves[area] : [1]).map(Number).filter(n => Number.isInteger(n) && n > 0 && n <= 9999))].sort((a,b) => a-b);
        if (!shelves[area].length) shelves[area] = [1];
      }
      return {
        items: Array.isArray(raw.items) ? raw.items.map(item => ({...item, orderLinks: uniqueOrderLinks(item.orderLinks || []), images: Array.isArray(item.images) ? item.images : []})) : [],
        transactions: Array.isArray(raw.transactions) ? raw.transactions.map(tx => ({...tx, lines: (tx.lines || []).map(line => ({...line})), orderLinks: uniqueOrderLinks(tx.orderLinks || [])})) : [],
        shelves
      };
    }
    function validateWarehouse(raw) {
      if (raw === undefined) return true; // Backups predating inventory remain importable.
      if (!raw || !Array.isArray(raw.items) || !Array.isArray(raw.transactions) || !raw.shelves) return false;
      if (typeof raw.shelves !== 'object' || Array.isArray(raw.shelves)) return false;
      for (const area of ['A','B','C','D']) {
        const shelves = raw.shelves[area];
        if (!Array.isArray(shelves) || !shelves.length || new Set(shelves).size !== shelves.length || shelves.some(n => !Number.isInteger(n) || n < 1 || n > 9999)) return false;
      }
      const ids = new Set(), codes = new Set(), keys = new Set(), txIds = new Set();
      for (const item of raw.items) {
        if (!item || !item.id || ids.has(item.id) || !['A','B','C','D'].includes(item.area)
            || !Number.isInteger(Number(item.shelf)) || !raw.shelves[item.area].includes(Number(item.shelf))
            || !/^\d{4}$/.test(String(item.serial)) || !whText(item.name) || !whText(item.unit)
            || typeof item.qty !== 'number' || !Number.isFinite(item.qty) || item.qty < 0 || item.qty > 1e12
            || codes.has(whCode(item)) || keys.has(whItemKey(item)) || item.code !== whCode(item)
            || (item.orderLinks !== undefined && !Array.isArray(item.orderLinks)) || (item.images !== undefined && !Array.isArray(item.images))) return false;
        ids.add(item.id); codes.add(item.code); keys.add(whItemKey(item));
      }
      for (const tx of raw.transactions) {
        if (!tx || !tx.id || txIds.has(tx.id) || !Array.isArray(tx.lines) || !tx.lines.length || !['in','out','adjust','transfer','reverse'].includes(tx.type) || (tx.orderLinks !== undefined && !Array.isArray(tx.orderLinks))) return false;
        txIds.add(tx.id);

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = safeParse(saved,null);
          if (!isValidStateData(data)) throw new Error("演示存储数据格式异常");
          return {orders:data.orders.map(o => normalizeOrder(o,o.type || "sample")),materials:data.materials.map(normalizeMaterial),warehouse:normalizeWarehouse(data.warehouse)};
        }
      } catch (error) {
        // A blocked localStorage must not prevent the IndexedDB or offline demo from opening.
        console.warn("演示数据暂不能从普通存储读取，将尝试独立数据库",error);
      }
      return makePortfolioDemoState();
    }

    function isValidStateData(data) {
      return Boolean(data && Array.isArray(data.orders) && data.orders.every(order => order && typeof order === "object" && !Array.isArray(order)) && Array.isArray(data.materials) && data.materials.every(material => material && typeof material === "object" && !Array.isArray(material)) && validateWarehouse(data.warehouse));
    }

    function applyStateData(data) {
      state.orders = (data.orders || []).map(order => normalizeOrder(order, order.type || "sample"));
      state.materials = (data.materials || []).map(normalizeMaterial);
      state.warehouse = normalizeWarehouse(data.warehouse);
    }

    function openDatabase() {
      if (databasePromise) return databasePromise;
      databasePromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("当前浏览器不支持 IndexedDB"));
          return;
        }
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(DB_STORE)) database.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => {
          const database = request.result;
          database.onversionchange = () => database.close();
          resolve(database);
        };
        request.onerror = () => reject(request.error || new Error("打开本地数据库失败"));
        request.onblocked = () => reject(new Error("本地数据库升级被其他页面阻止"));
      });
      return databasePromise;
    }

    async function readIndexedState() {
      const database = await openDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(DB_STORE, "readonly");
        const request = transaction.objectStore(DB_STORE).get(DB_STATE_KEY);
        let result = null;
        request.onsuccess = () => { result = request.result || null; };
        request.onerror = () => reject(request.error || transaction.error || new Error("读取本地数据库失败"));
        transaction.oncomplete = () => resolve(result);
        transaction.onerror = () => reject(transaction.error || new Error("读取本地数据库失败"));
        transaction.onabort = () => reject(transaction.error || new Error("读取本地数据库已中止"));
      });
    }

    async function writeIndexedState(data) {
      const database = await openDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(DB_STORE, "readwrite");
        const record = { version: 8, savedAt: new Date().toISOString(), data };
        transaction.objectStore(DB_STORE).put(record, DB_STATE_KEY);
        transaction.oncomplete = () => { lastSavedAt = record.savedAt; resolve(true); };
        transaction.onerror = () => reject(transaction.error || new Error("写入本地数据库失败"));
        transaction.onabort = () => reject(transaction.error || new Error("写入本地数据库已中止"));
      });
    }

    function hasFallbackData() {
      try {
        return Boolean(localStorage.getItem(FALLBACK_MARKER_KEY) && localStorage.getItem(STORAGE_KEY));
      } catch {
        return false;
      }
    }

    function clearMigratedLocalStorage() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(FALLBACK_MARKER_KEY);
        Object.values(LEGACY_KEYS).forEach(key => localStorage.removeItem(key));
      } catch (error) {
        console.warn("旧存储副本未能清理，但不影响新数据库使用", error);
      }
    }

    function setStorageNotice(message, failed = false) {
      storageWarning = failed ? message : "";
      renderStorageStatus();
    }

    function renderStorageStatus() {
      const notice = document.getElementById("storageStatus");
      if (!notice) return;
      const { phase, message } = currentSaveStatus;
      const failed = phase === "error" || storageBlocked;
      const pending = phase === "saving" || phase === "loading";
      const tone = failed ? "error" : pending || storageWarning ? "pending" : "saved";
      const title = storageBlocked ? "已暂停写入，保护数据" : failed ? "保存失败，尚未保存" : pending ? message : "已保存到本地浏览器";
      const time = new Date(lastSavedAt);
      const detail = failed ? message : Number.isFinite(time.getTime()) ? `最近保存 ${time.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}` : "独立存储 · 数据不上传";
      const path = failed ? '<path d="m12 3 9 17H3L12 3Z"/><path d="M12 9v4m0 3h.01"/>' : pending ? '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' : '<path d="m12 3 8 4v6c0 4-8 8-8 8s-8-4-8-8V7l8-4Z"/><path d="m8 12 3 3 5-6"/>';
      notice.dataset.state = tone;
      notice.innerHTML = `<strong><svg class="storage-status-icon" viewBox="0 0 24 24" aria-hidden="true">${path}</svg><span>${esc(title)}</span></strong><span class="storage-status-detail">${esc(detail)}</span>${storageWarning && storageWarning !== detail ? `<span class="storage-status-warning">${esc(storageWarning)}</span>` : ""}`;
    }

    async function initializeStorage() {
      try {
        const record = await readIndexedState();
        const indexedData = record && (record.data || record);
        loadedSchemaVersion = Number(record?.version || 0);
        let migrated = false;
        if (loadedSchemaVersion > 8 || (hasFallbackData() && legacyReadError)) {
          storageBlocked = true;
          throw new Error("存储格式无法安全读取，已保留原数据并停止写入");
        }
        if (hasFallbackData()) {
          await writeIndexedState({ orders: state.orders, materials: state.materials, warehouse: state.warehouse });
          migrated = true;
        } else if (isValidStateData(indexedData)) {
          try { applyStateData(indexedData); }
          catch (error) { storageBlocked = true; throw error; }
          lastSavedAt = record.savedAt || "";
        } else if (record) {
          storageBlocked = true;
          throw new Error("本地数据库内容异常，已停止自动覆盖");
        } else {
          if (legacyReadError) {
            storageBlocked = true;
            throw new Error("旧数据无法安全读取，已保留原数据并停止写入");
          }
          await writeIndexedState({ orders: state.orders, materials: state.materials, warehouse: state.warehouse });
          migrated = true;
        }
        if (migrated) {
          const verificationRecord = await readIndexedState();
          const verificationData = verificationRecord && (verificationRecord.data || verificationRecord);
          if (!isValidStateData(verificationData)
              || verificationData.orders.length !== state.orders.length
              || verificationData.materials.length !== state.materials.length
              || JSON.stringify(verificationData.warehouse) !== JSON.stringify(state.warehouse)) {
            throw new Error("迁移后的本地数据库校验失败");
          }
        }
        storageBackend = "indexeddb";
        if (migrated) loadedSchemaVersion = 8;
        clearMigratedLocalStorage();
        setStorageNotice("已启用大容量本地数据库。建议每天下班前导出一次备份。");
        setSaveState("所有修改已自动保存到本机");
        if (navigator.storage && typeof navigator.storage.persist === "function") {
          navigator.storage.persist().catch(() => false);
        }
      } catch (error) {
        if (storageBlocked) {
          storageBackend = "indexeddb";
          setStorageNotice("数据校验未通过，已停止写入并保留原始数据。请勿清理浏览器数据。", true);
          setSaveState("数据校验未通过，请勿清理浏览器数据。", true);
          return;
        }
        storageBackend = "localstorage";
        loadedSchemaVersion = 0;
        console.error("大容量本地数据库不可用，暂时回退普通存储", error);
        setStorageNotice("大容量存储不可用，已暂时回退普通存储。请尽快导出备份。", true);
        currentSaveStatus = { phase: "loading", message: "已切换普通存储" };
        renderStorageStatus();
      }
    }

    function setSaveState(message, failed = false) {
      currentSaveStatus = { phase: failed ? "error" : message.includes("正在") ? "saving" : "saved", message };
      document.querySelectorAll(".save-state").forEach(element => {
        element.textContent = message;
        element.style.color = failed ? "var(--red)" : "";
      });
      renderStorageStatus();
    }

    function persistState() {
      if (storageBlocked) return Promise.resolve(false);
      if (saveTimer) {
        clearTimeout(saveTimer);
        saveTimer = null;
      }
      if (flushActive) return persistChain;
      if (savedVersion >= saveVersion) {
        savePending = false;
        return Promise.resolve(true);
      }
      flushActive = true;
      persistChain = (async () => {
        try {
          while (savedVersion < saveVersion) {
            const targetVersion = saveVersion;
            if (storageBackend === "indexeddb") {
              await writeIndexedState({ orders: state.orders, materials: state.materials, warehouse: state.warehouse });
              clearMigratedLocalStorage();
            } else {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              const savedAt = Date.now();
              localStorage.setItem(FALLBACK_MARKER_KEY, String(savedAt));
              lastSavedAt = new Date(savedAt).toISOString();
            }
            savedVersion = targetVersion;
          }
          savePending = false;
          setSaveState("所有修改已自动保存到本机");
          return true;
        } catch (error) {
          savePending = true;
          console.error("本地保存失败", error);
          const message = storageBackend === "indexeddb"
            ? "保存失败：浏览器大容量存储暂时不可用，请立即导出备份"
            : "保存失败：普通浏览器存储空间不足，请启用支持 IndexedDB 的浏览器";
          setSaveState(message, true);
          return false;
        } finally {
          flushActive = false;
        }
      })();
      return persistChain;
    }

    function save(immediate = false) {
      saveVersion += 1;
      savePending = true;
      setSaveState("正在保存…");
      if (saveTimer) clearTimeout(saveTimer);
      if (immediate === true) return persistState();
      saveTimer = setTimeout(persistState, 240);
      return true;
    }

    window.addEventListener("pagehide", persistState);
    window.addEventListener("beforeunload", event => {
      if (savedVersion >= saveVersion && !warehouseBusy) return;
      persistState();
      event.preventDefault();
      event.returnValue = "";
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") persistState();
    });
    document.addEventListener("change", () => {
      if (savePending) persistState();
    });

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
    }

    function isDone(order) {
      return (order.status || "").includes("已完成");
    }

    function isLate(order) {
      return !isDone(order) && order.deadline && new Date(order.deadline + "T23:59:59") < new Date();
    }

    function dayDiff(date) {
      const a = new Date(todayISO());
      const b = new Date(date);
      return Math.ceil((b - a) / 86400000);
    }

    function progress(order) {
      const steps = statusSteps[order.type] || statusSteps.sample;
      const idx = Math.max(0, steps.indexOf(order.status));
      return Math.round(((idx + 1) / steps.length) * 100);
    }

    function textMatch(order) {
      const hay = [
        order.client, order.code, order.title, order.status, order.requirements.join(" "),
        order.materialNotes
      ].join(" ").toLowerCase();
      return orderQuery.trim().toLowerCase().split(/\s+/).filter(Boolean).every(k => hay.includes(k));
    }

    function compareOrderText(a, b, field, fallbackField = "", direction = 1) {
      const left = String(a[field] || (fallbackField ? a[fallbackField] : "") || "").trim();
      const right = String(b[field] || (fallbackField ? b[fallbackField] : "") || "").trim();
      if (!left && right) return 1;
      if (left && !right) return -1;
      return orderTextCollator.compare(left, right) * direction;
    }

    function compareOrderDate(a, b, field, direction = 1) {
      const left = new Date(a[field] || "").getTime();
      const right = new Date(b[field] || "").getTime();
      const leftValid = Number.isFinite(left);
      const rightValid = Number.isFinite(right);
      if (!leftValid && rightValid) return 1;
      if (leftValid && !rightValid) return -1;
      if (!leftValid && !rightValid) return 0;
      return (left - right) * direction;
    }

    function compareOrders(a, b) {
      let result = 0;
      if (orderSort === "created_desc") result = compareOrderDate(a, b, "createdAt", -1);
      else if (orderSort === "created_asc") result = compareOrderDate(a, b, "createdAt", 1);
      else if (orderSort === "deadline_desc") result = compareOrderDate(a, b, "deadline", -1);
      else if (orderSort === "deadline_asc") result = compareOrderDate(a, b, "deadline", 1);
      else if (orderSort === "code_asc") result = compareOrderText(a, b, "code");
      else if (orderSort === "code_desc") result = compareOrderText(a, b, "code", "", -1);
      else if (orderSort === "title_asc") result = compareOrderText(a, b, "title", "code");
      else if (orderSort === "title_desc") result = compareOrderText(a, b, "title", "code", -1);
      else {
        if (isLate(a) !== isLate(b)) result = isLate(a) ? -1 : 1;
        if (!result) result = compareOrderDate(a, b, "deadline", 1);
      }
      return result || compareOrderDate(a, b, "updatedAt", -1) || orderTextCollator.compare(String(a.id), String(b.id));
    }

    function filteredOrders(includeDone = false) {
      return state.orders
        .filter(o => typeFilter === "all" || o.type === typeFilter)
        .filter(o => includeDone ? true : statusFilter === "done" ? isDone(o) : statusFilter === "late" ? isLate(o) : statusFilter === "today" ? (!isDone(o) && dayDiff(o.deadline) === 0) : !isDone(o))
        .filter(textMatch)
        .sort(compareOrders);
    }

    function syncNav(next) {
      document.querySelectorAll(".nav button").forEach(btn => {
        const isActive = btn.dataset.view === next;
        btn.classList.toggle("active", isActive);
        if (isActive) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });
    }

    function setView(next, force = false) {
      if (!force && next === activeView) return;
      activeView = next;
      syncNav(next);
      render();
    }

    function render() {
      const copy = {
        dashboard: ["工作台", "集中查看延期、今日到期和进行中的跟单任务。"],
        orders: ["订单中心", "打样和大货在同一处维护，减少重复切换。"],
        materials: ["仓储管理", "按区域与货架管理库存，追溯每一笔入库、出库和物流记录。"],
        timeline: ["排期大盘", "用日期轴快速查看当前生产压力。"],
        archive: ["归档库", "查看已完成订单，也可以改回进行中。"]
      }[activeView];
      pageTitle.textContent = copy[0];
      pageHint.textContent = copy[1];
      if (activeView === "dashboard") renderDashboard();
      if (activeView === "orders") renderOrders();
      if (activeView === "materials") renderMaterials();
      if (activeView === "timeline") renderTimeline();
      if (activeView === "archive") renderArchive();
    }

    function renderStats() {
      const active = state.orders.filter(o => !isDone(o));
      const late = active.filter(isLate);
      const dueToday = active.filter(o => dayDiff(o.deadline) === 0);
      const materialsWaiting = state.materials.flatMap(materialItems).filter(isWaitingMaterialItem);
      return `
        <div class="grid stats">

          setView("materials", true);

    function orderCard(order) {
      const kind = order.type === "sample" ? "打样" : "大货";

      return `
        <article class="order-card ${order.type} ${late ? "late-order" : ""} ${selectedId === order.id ? "selected" : ""}" data-order="${order.id}" role="button" tabindex="0" aria-selected="${selectedId === order.id ? "true" : "false"}" aria-label="打开${kind}订单：${esc(order.client)}，${esc(order.code || "未编号")}">

    function refreshOrderList(options = {}) {
      const list = view.querySelector(".order-list-scroll");
      if (!list) return;
      const previousScrollTop = options.resetScroll === true ? 0 : list.scrollTop;
      const orders = filteredOrders();
      let selected = orders.find(order => order.id === selectedId) || null;
      let detailChanged = false;
      if (!selected) {
        selected = orders[0] || null;
        selectedId = selected?.id || null;
        const detailPanel = view.querySelector(".order-detail-panel");
        if (detailPanel) {
          detailPanel.innerHTML = selected
            ? orderEditor(selected)
            : `<div class="panel-body order-detail-scroll" role="region" aria-label="订单详情，可独立滚动" tabindex="0"><div class="empty">请选择或新建一个订单</div></div>`;
          detailChanged = true;
        }
      }
      list.innerHTML = orderListContent(orders);
      const count = view.querySelector(".order-list-count");
      if (count) count.textContent = `${orders.length} 条`;
      bindOrderCards();
      if (detailChanged && selected) bindOrderEditor(selected);
      list.scrollTop = previousScrollTop;
      if (options.revealSelected === true && selectedId && typeof requestAnimationFrame === "function") {
        requestAnimationFrame(() => list.querySelector(`[data-order="${selectedId}"]`)?.scrollIntoView({ block: "nearest" }));
      }
    }

    function renderOrders(options = {}) {
      const previousList = view.querySelector(".order-list-scroll");
      const previousDetail = view.querySelector(".order-detail-scroll");
      const previousListScrollTop = options.resetListScroll === true ? 0 : (previousList?.scrollTop || 0);
      const previousDetailScrollTop = options.resetDetailScroll === true ? 0 : (previousDetail?.scrollTop || 0);
      const orders = filteredOrders();
      if (!orders.some(order => order.id === selectedId)) selectedId = orders[0]?.id || null;
      const selected = orders.find(o => o.id === selectedId) || orders[0] || null;
      if (selected) selectedId = selected.id;
      view.innerHTML = `
        ${toolbarHtml()}
        <div class="grid split order-workspace">
          <div class="panel order-list-panel">
            <div class="panel-head"><h2>订单列表</h2><span class="badge order-list-count">${orders.length} 条</span></div>
            <div class="panel-body order-list-scroll" role="region" aria-label="订单列表，可独立滚动" tabindex="0">
              ${orderListContent(orders)}
            </div>
          </div>
          <div class="panel printable order-detail-panel">
            ${selected ? orderEditor(selected) : `<div class="panel-body order-detail-scroll" role="region" aria-label="订单详情，可独立滚动" tabindex="0"><div class="empty">请选择或新建一个订单</div></div>`}
          </div>
        </div>`;
      bindToolbar();
      bindOrderCards();
      if (selected) bindOrderEditor(selected);
      const currentList = view.querySelector(".order-list-scroll");
      if (currentList) currentList.scrollTop = previousListScrollTop;
      const currentDetail = view.querySelector(".order-detail-scroll");
      if (currentDetail) currentDetail.scrollTop = previousDetailScrollTop;
    }

    function imageEditor(order) {
      return `<div class="image-strip">
        ${(order.images || []).map((img, i) => `<div class="thumb"><img src="${esc(img)}" alt="款式图片 ${i + 1}" data-preview-image="${i}" tabindex="0" role="button" title="点击放大查看" aria-label="放大查看款式图片 ${i + 1}"><button type="button" title="删除图片" aria-label="删除图片 ${i + 1}" data-remove-image="${i}">×</button></div>`).join("")}
        <label class="upload" for="orderImages">＋<br>上传图片<input type="file" id="orderImages" multiple accept="image/*"></label>
      </div>`;

    function viewedImage() {
      const order = state.orders.find(item => item.id === imageViewerOrderId);
      const src = order && Array.isArray(order.images) ? order.images[imageViewerIndex] : "";
      return src ? { order, src } : null;
    }

    function isAllowedImageSource(src) {
      return /^data:image\//i.test(String(src || "")) || /^blob:/i.test(String(src || ""));
    }

    function openImageViewer(orderId, index, trigger) {
      const nextIndex = Number(index);
      const order = state.orders.find(item => item.id === orderId);
      const src = order && Array.isArray(order.images) ? order.images[nextIndex] : "";
      if (!src || !isAllowedImageSource(src)) {
        alert("这张图片的数据无效，无法预览。");
        return;
      }
      imageViewerOrderId = orderId;
      imageViewerIndex = nextIndex;
      imageViewerReturnFocus = trigger || document.activeElement;
      const current = { order, src };
      const viewer = document.getElementById("imageViewer");
      const picture = document.getElementById("imageViewerPicture");
      document.getElementById("imageViewerTitle").textContent = `${current.order.code || current.order.title || "未编号订单"} · 图片 ${imageViewerIndex + 1}`;
      picture.src = current.src;
      picture.alt = `${current.order.code || current.order.title || "订单"} 款式图片 ${imageViewerIndex + 1}`;
      viewer.hidden = false;
      document.querySelector(".app").inert = true;
      document.body.classList.add("image-viewer-open");
      document.getElementById("closeImageViewer").focus();
    }

    function closeImageViewer() {
      const viewer = document.getElementById("imageViewer");
      if (viewer.hidden) return;
      viewer.hidden = true;
      document.getElementById("imageViewerPicture").removeAttribute("src");
      document.querySelector(".app").inert = false;
      document.body.classList.remove("image-viewer-open");
      imageViewerOrderId = "";
      imageViewerIndex = -1;
      const focusTarget = imageViewerReturnFocus && imageViewerReturnFocus.isConnected
        ? imageViewerReturnFocus
        : (view.querySelector(".order-detail-scroll") || document.querySelector('[data-view="orders"]'));
      if (focusTarget) focusTarget.focus();
      imageViewerReturnFocus = null;
    }

    function imageFileExtension(src) {
      const mime = String(src || "").match(/^data:([^;,]+)/i)?.[1]?.toLowerCase() || "";
      return ({ "image/jpeg": "jpg", "image/jpg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif", "image/svg+xml": "svg", "image/bmp": "bmp", "image/avif": "avif", "image/heic": "heic", "image/heif": "heif" })[mime] || "jpg";
    }

    function safeDownloadName(value) {
      return String(value || "款式图片").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").trim().slice(0, 80) || "款式图片";
    }

    async function downloadViewedImage() {
      const current = viewedImage();
      if (!current) return;
      if (!isAllowedImageSource(current.src)) {
        alert("这张图片的数据无效，无法下载。");
        return;
      }
      const filename = `${safeDownloadName(current.order.code || current.order.title || current.order.id)}_图片${imageViewerIndex + 1}.${imageFileExtension(current.src)}`;
      let href = current.src;
      let objectUrl = "";
      try {
        const response = await fetch(current.src);
        const blob = await response.blob();
        if (!String(blob.type || "").toLowerCase().startsWith("image/")) throw new Error("下载内容不是图片");
        objectUrl = URL.createObjectURL(blob);
        href = objectUrl;
      } catch (error) {
        if (/^blob:/i.test(current.src)) {
          console.warn("Blob 图片校验失败，已停止下载", error);
          alert("这张图片的数据无效，无法下载。");
          return;
        }
        console.warn("图片转为下载文件失败，使用已验证的图片数据", error);
      }
      const anchor = document.createElement("a");
      anchor.href = href;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      if (objectUrl) setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    }

            </div>`).join("")}

        </div>`;
    }

                <th class="matrix-total">行合计</th>

              <tbody>${matrix.rows.map((row, rowIndex) => `<tr>
                <td><div style="display:flex;align-items:center;gap:5px"><input class="input" data-qty-color="${rowIndex}" value="${esc(row.color)}" aria-label="颜色 ${rowIndex + 1}"><button class="mini-btn no-print" type="button" title="删除颜色" data-remove-qty-color="${rowIndex}"${matrix.rows.length <= 1 ? " disabled" : ""}>×</button></div></td>
                ${matrix.sizes.map((_, colIndex) => `<td><input class="input" inputmode="numeric" min="0" step="1" type="number" data-qty-cell="${rowIndex},${colIndex}" value="${esc((row.quantities || [])[colIndex] || "")}" aria-label="${esc(row.color || `颜色 ${rowIndex + 1}`)} ${esc(matrix.sizes[colIndex] || `尺码 ${colIndex + 1}`)}件数"></td>`).join("")}
                <td class="matrix-total" data-qty-row-total="${rowIndex}">${quantityRowTotal(row)}</td>
              </tr>`).join("")}</tbody>
              <tfoot><tr>
                <td class="matrix-total">尺码合计</td>
                ${matrix.sizes.map((_, colIndex) => `<td class="matrix-total" data-qty-col-total="${colIndex}">${quantityColTotal(matrix, colIndex)}</td>`).join("")}

    function matrixEditor(order) {
      const matrix = order.sizeMatrix || { cols: ["S", "M", "L"], rows: [] };
      return `
        <div class="wide section-card">
          <div class="section-title"><span>大货尺寸表</span><span class="section-hint">成衣各部位尺寸记录</span></div>
          <div class="no-print" style="display:flex; gap:8px; margin-bottom:10px;">

            <button class="btn" id="addSizeCol" type="button">＋ 加尺码</button>
          </div>

            <table class="matrix-table">
              <thead><tr><th>部位 / 尺码</th>${matrix.cols.map((c, i) => `<th><div style="display:flex;align-items:center;gap:5px"><input class="input" data-col="${i}" value="${esc(c)}"><button class="mini-btn no-print" type="button" title="删除尺码" aria-label="删除尺码 ${i + 1}" data-remove-size-col="${i}"${matrix.cols.length <= 1 ? " disabled" : ""}>×</button></div></th>`).join("")}</tr></thead>

              </tr>`).join("")}</tbody>
            </table>
          </div>
        </div>`;
    }

    function quantityValue(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? Math.floor(number) : 0;
    }

    function quantityRowTotal(row) {
      return (row.quantities || []).reduce((sum, value) => sum + quantityValue(value), 0);
    }

    function quantityMatrixTotal(matrix) {
      return (matrix.rows || []).reduce((sum, row) => sum + quantityRowTotal(row), 0);
    }

    function quantityColTotal(matrix, colIndex) {
      return (matrix.rows || []).reduce((sum, row) => sum + quantityValue((row.quantities || [])[colIndex]), 0);
    }

    function refreshQuantityTotals(order) {
      const matrix = order.orderQtyMatrix;
      matrix.rows.forEach((row, rowIndex) => {
        const cell = document.querySelector(`[data-qty-row-total="${rowIndex}"]`);
        if (cell) cell.textContent = quantityRowTotal(row);
      });
      matrix.sizes.forEach((_, colIndex) => {
        const cell = document.querySelector(`[data-qty-col-total="${colIndex}"]`);
        if (cell) cell.textContent = quantityColTotal(matrix, colIndex);
      });
      const total = quantityMatrixTotal(matrix);
      const badge = document.getElementById("qtyGrandTotal");
      const tableTotal = document.querySelector("[data-qty-table-total]");
      if (badge) badge.textContent = total;
      if (tableTotal) tableTotal.textContent = total;
    }

    function freightCents(value) {
      const number = Number(String(value ?? "").replace(/[^\d.-]/g, ""));
      return Number.isFinite(number) && number > 0 ? Math.round(number * 100) : 0;
    }

    function formatMoney(value) {
      return `¥${(freightCents(value) / 100).toFixed(2)}`;
    }

    function materialItems(material) {
      return Array.isArray(material?.items) && material.items.length
        ? material.items
        : [normalizeMaterialItem(material || {})];
    }

    function isWaitingMaterialItem(item) {
      const status = String(item?.status || "");
      return !status.includes("入库") && !status.includes("耗尽");
    }

    function orderReferenceText(order) {
      return `${order.type === "sample" ? "打样" : "大货"} · ${order.client || "未填客户"} · ${order.code || "未编号"}${order.title ? ` · ${order.title}` : ""}`;
    }

    function legacyReferenceHasTerm(reference, term) {
      const ref = String(reference || "").trim().toLowerCase();
      const target = String(term || "").trim().toLowerCase();
      if (!ref || !target) return false;
      if (ref === target) return true;
      const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp(`(^|[^0-9a-z_\\u3400-\\u9fff])${escaped}($|[^0-9a-z_\\u3400-\\u9fff])`, "i").test(ref);
    }

    function longestLegacyMatches(orders, field, reference) {
      const matches = orders.filter(order => legacyReferenceHasTerm(reference, order[field]));
      if (!matches.length) return [];
      const longest = Math.max(...matches.map(order => String(order[field] || "").trim().length));
      return matches.filter(order => String(order[field] || "").trim().length === longest);
    }

    function ordersMatchingLegacyReference(reference, orders = state.orders) {
      const ref = String(reference || "").trim().toLowerCase();
      if (!ref) return [];
      const codeMatches = longestLegacyMatches(orders, "code", ref);
      if (codeMatches.length === 1) return codeMatches;
      if (codeMatches.length > 1) {
        const clientMatches = longestLegacyMatches(codeMatches, "client", ref);
        return clientMatches.length ? clientMatches : codeMatches;
      }
      return longestLegacyMatches(orders, "client", ref);
    }

    function resolveUniqueOrderLinks(links, orders = state.orders) {
      const resolved = uniqueOrderLinks(links).map(link => {
        if (link.orderId || !link.orderRef) return link;
        const matches = ordersMatchingLegacyReference(link.orderRef, orders);
        return matches.length === 1
          ? { orderId: matches[0].id, orderRef: orderReferenceText(matches[0]) }
          : link;
      });
      return uniqueOrderLinks(resolved);
    }

    function upgradeLegacyMaterialLinks(target = state) {
      let changed = false;
      const orders = Array.isArray(target.orders) ? target.orders : [];
      (target.materials || []).forEach(material => {
        material.items = materialItems(material).map(item => {
          const before = uniqueOrderLinks(item.orderLinks);
          const after = resolveUniqueOrderLinks(before, orders);
          if (before.length !== after.length || after.some((link, index) => link.orderId !== before[index]?.orderId || link.orderRef !== before[index]?.orderRef)) changed = true;
          return { ...item, orderLinks: after };
        });
        syncMaterialLegacyFields(material);
      });
      return changed;
    }

    function materialItemMatchesOrder(item, order) {
      const links = resolveUniqueOrderLinks(item.orderLinks || []);
      if (links.some(link => link.orderId === order.id)) return true;
      return links.filter(link => !link.orderId && link.orderRef).some(link => {
        const matches = ordersMatchingLegacyReference(link.orderRef);
        return matches.length === 1 && matches[0].id === order.id;
      });
    }

    function materialGroupsForOrder(order) {
      return state.materials.map(material => ({
        material,
        items: materialItems(material).filter(item => materialItemMatchesOrder(item, order))
      })).filter(group => group.items.length);
    }

    function freightSummary(materials) {
      const seen = new Set();
      const cents = materials.reduce((summary, material) => {
        if (seen.has(material.id)) return summary;
        seen.add(material.id);
        const amount = freightCents(material.freightAmount);
        summary.total += amount;
        summary[material.freightPaid ? "paid" : "unpaid"] += amount;
        return summary;
      }, { total: 0, paid: 0, unpaid: 0 });
      return { total: cents.total / 100, paid: cents.paid / 100, unpaid: cents.unpaid / 100 };
    }

          <div class="money-summary">

          <tbody>${groups.map(({ material, items }) => `<tr>

            <td><div class="material-lines">${items.map(item => `<div class="material-line"><span class="badge ${String(item.status).includes("入库") ? "ok" : "warn"}">${esc(item.status)}</span><div class="meta">筐号：${esc(item.binLocation || "未分配")}</div></div>`).join("")}</div></td>

      return items.length ? items.map((item, i) => `${i + 1}. ${item}`).join("\n") : "无";

    function printOrderQtyMatrix(order) {
      if (order.type !== "bulk" || !order.orderQtyMatrix) return "";

              <tr class="print-total-row"><td>尺码合计</td>${matrix.sizes.map((_, index) => `<td>${quantityColTotal(matrix, index)}</td>`).join("")}<td>${quantityMatrixTotal(matrix)} 件</td></tr>

    function bindOrderCards() {
      document.querySelectorAll("[data-order]").forEach(card => {
        const openOrder = () => {
          const fromDashboard = activeView === "dashboard";
          if (fromDashboard) {
            orderQuery = "";
            typeFilter = "all";
            statusFilter = "active";
          }
          const changedOrder = selectedId !== card.dataset.order;
          selectedId = card.dataset.order;
          if (changedOrder) {
            const detail = view.querySelector(".order-detail-scroll");
            if (detail) detail.scrollTop = 0;
          }
          setView("orders", true);
          if (fromDashboard && typeof requestAnimationFrame === "function") requestAnimationFrame(() => {
            view.querySelector(`[data-order="${selectedId}"]`)?.scrollIntoView({ block: "nearest" });
          });
        };
        card.addEventListener("click", openOrder);
        card.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          openOrder();
        });
      });
    }

    function updateOrder(order, patch, immediate = false) {
      Object.assign(order, patch, { updatedAt: new Date().toISOString() });
      save(immediate);
    }

    function bindOrderEditor(order) {
      document.querySelectorAll("[data-field]").forEach(el => {
        el.addEventListener("input", () => updateOrder(order, { [el.dataset.field]: el.value }));
        el.addEventListener("change", () => {
          updateOrder(order, { [el.dataset.field]: el.value }, true);
          refreshOrderList();
        });
      });
      document.querySelectorAll("[data-list-field]").forEach(el => {
        el.addEventListener("input", () => {
          const arr = [...toList(order[el.dataset.listField])];
          arr[Number(el.dataset.index)] = el.value;
          updateOrder(order, { [el.dataset.listField]: arr });
        });
      });
      document.querySelectorAll("[data-add-list]").forEach(btn => btn.addEventListener("click", () => {
        const field = btn.dataset.addList;
        updateOrder(order, { [field]: [...toList(order[field]), ""] });
        renderOrders();
      }));
      document.querySelectorAll("[data-remove-list]").forEach(btn => btn.addEventListener("click", () => {
        const field = btn.dataset.removeList;
        const arr = toList(order[field]).filter((_, i) => i !== Number(btn.dataset.index));
        updateOrder(order, { [field]: arr.length ? arr : [""] });
        renderOrders();
      }));
      document.querySelectorAll("[data-remove-image]").forEach(btn => btn.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        order.images.splice(Number(btn.dataset.removeImage), 1);
        save();
        renderOrders();
      }));
      document.querySelectorAll("[data-preview-image]").forEach(image => {
        const preview = () => openImageViewer(order.id, image.dataset.previewImage, image);
        image.addEventListener("click", preview);
        image.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          preview();
        });
      });
      document.getElementById("orderImages")?.addEventListener("change", e => {
        const files = Array.from(e.currentTarget.files || []);
        if (!files.length) return;
        handleImages(files, imgs => {
          if (!imgs.length || !state.orders.includes(order)) return;
          order.images = [...(Array.isArray(order.images) ? order.images : []), ...imgs];
          save();
          renderOrders();
        });
      });
      document.querySelectorAll("[data-order-stock]").forEach(button => button.addEventListener("click", () => whOpenOrderStock(button.dataset.orderStock)));
      document.querySelectorAll("[data-order-freight-id]").forEach(input => input.addEventListener("change", () => {
        const material = state.materials.find(item => item.id === input.dataset.orderFreightId);
        if (!material) return;
        material.freightPaid = input.checked;
        save();
        renderOrders();
      }));
      document.getElementById("addQtyColor")?.addEventListener("click", () => {
        order.orderQtyMatrix.rows.push({ color: `颜色 ${order.orderQtyMatrix.rows.length + 1}`, quantities: order.orderQtyMatrix.sizes.map(() => "") });
        save(); renderOrders();
      });
      document.getElementById("addQtySize")?.addEventListener("click", () => {
        order.orderQtyMatrix.sizes.push("新尺码");
        order.orderQtyMatrix.rows.forEach(row => row.quantities.push(""));
        save(); renderOrders();
      });
      document.querySelectorAll("[data-remove-qty-color]").forEach(btn => btn.addEventListener("click", () => {
        if (order.orderQtyMatrix.rows.length <= 1) return;
        order.orderQtyMatrix.rows.splice(Number(btn.dataset.removeQtyColor), 1);
        save(); renderOrders();
      }));
      document.querySelectorAll("[data-remove-qty-size]").forEach(btn => btn.addEventListener("click", () => {
        if (order.orderQtyMatrix.sizes.length <= 1) return;
        const index = Number(btn.dataset.removeQtySize);
        order.orderQtyMatrix.sizes.splice(index, 1);
        order.orderQtyMatrix.rows.forEach(row => row.quantities.splice(index, 1));
        save(); renderOrders();
      }));
      document.querySelectorAll("[data-qty-size]").forEach(input => input.addEventListener("input", () => {
        order.orderQtyMatrix.sizes[Number(input.dataset.qtySize)] = input.value;
        save();
      }));
      document.querySelectorAll("[data-qty-color]").forEach(input => input.addEventListener("input", () => {

        save();
      }));
      document.querySelectorAll("[data-qty-cell]").forEach(input => input.addEventListener("input", () => {
        const [rowIndex, colIndex] = input.dataset.qtyCell.split(",").map(Number);
        order.orderQtyMatrix.rows[rowIndex].quantities[colIndex] = input.value;
        save();
        refreshQuantityTotals(order);
      }));
      document.querySelectorAll("[data-qty-cell]").forEach(input => input.addEventListener("change", () => {
        const [rowIndex, colIndex] = input.dataset.qtyCell.split(",").map(Number);
        input.value = input.value === "" ? "" : String(quantityValue(input.value));
        order.orderQtyMatrix.rows[rowIndex].quantities[colIndex] = input.value;
        save();

      }));
      document.getElementById("copyOrderBtn")?.addEventListener("click", () => duplicateOrder(order));
      document.getElementById("copyToBulkBtn")?.addEventListener("click", () => duplicateOrder(order, "bulk"));
      document.getElementById("deleteOrderBtn")?.addEventListener("click", () => {
        if (!confirm("确定删除这个订单吗？")) return;
        state.orders = state.orders.filter(o => o.id !== order.id);
        selectedId = null;
        save();
        renderOrders({ resetDetailScroll: true });
      });
      document.getElementById("printOrderBtn")?.addEventListener("click", () => {
        persistState();
        view.querySelector(".print-sheet")?.remove();
        view.insertAdjacentHTML("beforeend", printSheet(order));
        const cleanupPrintSheet = () => view.querySelector(".print-sheet")?.remove();
        window.addEventListener("afterprint", cleanupPrintSheet, { once: true });
        setTimeout(() => window.print(), 0);
      });
      document.getElementById("saveOrderBtn")?.addEventListener("click", renderOrders);
      document.getElementById("addSizeRow")?.addEventListener("click", () => {
        order.sizeMatrix.rows.push({ point: "新部位", vals: order.sizeMatrix.cols.map(() => "") });
        save(); renderOrders();
      });
      document.getElementById("addSizeCol")?.addEventListener("click", () => {
        order.sizeMatrix.cols.push("新码");
        order.sizeMatrix.rows.forEach(r => r.vals.push(""));
        save(); renderOrders();
      });
      document.querySelectorAll("[data-remove-size-row]").forEach(btn => btn.addEventListener("click", () => {
        if (order.sizeMatrix.rows.length <= 1) return;
        order.sizeMatrix.rows.splice(Number(btn.dataset.removeSizeRow), 1);
        save(); renderOrders();
      }));
      document.querySelectorAll("[data-remove-size-col]").forEach(btn => btn.addEventListener("click", () => {
        if (order.sizeMatrix.cols.length <= 1) return;
        const index = Number(btn.dataset.removeSizeCol);
        order.sizeMatrix.cols.splice(index, 1);
        order.sizeMatrix.rows.forEach(row => row.vals.splice(index, 1));
        save(); renderOrders();
      }));
      document.querySelectorAll("[data-col]").forEach(el => el.addEventListener("input", () => { order.sizeMatrix.cols[Number(el.dataset.col)] = el.value; save(); }));
      document.querySelectorAll("[data-row-name]").forEach(el => el.addEventListener("input", () => { order.sizeMatrix.rows[Number(el.dataset.rowName)].point = el.value; save(); }));
      document.querySelectorAll("[data-cell]").forEach(el => el.addEventListener("input", () => {
        const [r, c] = el.dataset.cell.split(",").map(Number);
        order.sizeMatrix.rows[r].vals[c] = el.value;
        save();
      }));
    }

    function createOrder(type) {
      const id = uid(type === "sample" ? "S" : "B");
      const order = normalizeOrder({
        id,
        client: "新客户",
        code: (type === "sample" ? "S" : "B") + id.slice(-5).toUpperCase(),
        deadline: todayISO()
      }, type);
      state.orders.unshift(order);
      selectedId = order.id;
      orderQuery = "";
      typeFilter = "all";
      statusFilter = "active";
      const orderList = view.querySelector(".order-list-scroll");
      if (orderList) orderList.scrollTop = 0;
      const orderDetail = view.querySelector(".order-detail-scroll");
      if (orderDetail) orderDetail.scrollTop = 0;
      save();
      setView("orders", true);
      if (typeof requestAnimationFrame === "function") requestAnimationFrame(() => {
        view.querySelector(`[data-order="${order.id}"]`)?.scrollIntoView({ block: "nearest" });
      });
    }

    function duplicateOrder(source, targetType = source.type) {
      // 先把可唯一识别的旧式文字关联固定到原订单，避免同款返单后关联变得歧义。
      upgradeLegacyMaterialLinks();
      const clonedData = typeof structuredClone === "function"
        ? structuredClone(source)
        : JSON.parse(JSON.stringify(source));
      const copy = normalizeOrder(clonedData, targetType);
      copy.id = uid(targetType === "sample" ? "S" : "B");
      copy.status = statusSteps[targetType][0];
      copy.createdAt = todayISO();
      copy.deadline = todayISO();

    async function compressImage(file) {
      const dataUrl = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const max = 1100;
          let w = img.width, h = img.height;
          const scale = Math.min(1, max / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", .72));
        };
        img.src = dataUrl;
      });
    }

    async function handleImages(files, callback) {
      const result = [];
      for (const file of Array.from(files || [])) result.push(await compressImage(file));
      callback(result);
    }

        const itemText = items.flatMap(item => [
          item.name, item.qty, item.status, item.binLocation,
          ...uniqueOrderLinks(item.orderLinks).flatMap(link => {
            const order = ordersById.get(link.orderId);
            return [link.orderRef, order?.client, order?.code, order?.title, order?.type === "sample" ? "打样" : order ? "大货" : ""];
          })
        ]);
        const hay = [m.courier, m.trackingNo, m.date, m.freightAmount, m.freightPaid ? "已付" : "未付", ...itemText].join(" ").toLowerCase();
        return materialQuery.trim().toLowerCase().split(/\s+/).filter(Boolean).every(k => hay.includes(k));
      });

    function populateOrderPicker(picker) {
      if (!picker || picker.dataset.loaded === "true") return;
      const selectedLinks = storedOrderPickerLinks(picker);
      const selectedIds = new Set(selectedLinks.map(link => link.orderId));
      const liveOrderIds = new Set(state.orders.map(order => order.id));
      const choices = state.orders.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).map(order => {
        const label = orderReferenceText(order);
        return `<label class="order-choice" data-order-search-text="${esc(label.toLowerCase())}"><input type="checkbox" data-item-order-link data-order-id="${esc(order.id)}" data-order-ref="${esc(label)}"${selectedIds.has(order.id) ? " checked" : ""}><span>${esc(label)}</span></label>`;
      });
      selectedLinks.filter(link => !liveOrderIds.has(link.orderId)).forEach(link => {
        const label = link.orderRef || `已删除订单 ${link.orderId}`;
        choices.push(`<label class="order-choice" data-order-search-text="${esc(label.toLowerCase())}"><input type="checkbox" data-item-order-link data-order-id="${esc(link.orderId)}" data-order-ref="${esc(link.orderRef)}" checked><span>${esc(label)}（历史关联）</span></label>`);

    const TIMELINE_WINDOW_DAYS = 30;
    let timelineWindowStart = null;

    function timelineStrictDay(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ""))) return null;
      const day = new Date(`${value}T00:00:00Z`).getTime() / DAY_MS;
      return Number.isFinite(day) && dayToISO(day) === value ? day : null;
    }

    function timelineOrderRange(order) {
      const start = timelineStrictDay(order.createdAt);
      const end = timelineStrictDay(order.deadline);
      const invalid = [start === null ? "启动日期" : "", end === null ? "交期" : ""].filter(Boolean);
      const issue = invalid.length ? `${invalid.join("、")}缺失或无效` : end < start ? "交期早于启动日期" : "";
      return { order, start, end, issue };
    }

    function renderTimeline() {
      const todayDay = isoToDay(todayISO(), 0);
      const earliestDay = timelineStrictDay("0001-01-01");
      const latestStart = timelineStrictDay("9999-12-31") - TIMELINE_WINDOW_DAYS + 1;
      const minDay = Math.min(latestStart, Math.max(earliestDay, timelineWindowStart ?? todayDay - 7));
      const maxDay = minDay + TIMELINE_WINDOW_DAYS - 1;
      const span = TIMELINE_WINDOW_DAYS;
      const ranges = state.orders.filter(order => !isDone(order)).map(timelineOrderRange)
        .sort((a, b) => (a.start ?? Infinity) - (b.start ?? Infinity));
      const dates = Array.from({ length: span }, (_, index) => timelineDateCell(minDay + index, todayDay)).join("");
      view.innerHTML = `
        <div class="panel">
          <div class="panel-head"><h2>生产排期</h2><span class="badge" role="status">${dayToISO(minDay)} 至 ${dayToISO(maxDay)} · ${span} 天</span></div>
          <div class="timeline-window-controls no-print" aria-label="排期日期窗口">
            <button class="btn" type="button" id="timelinePrev"${minDay <= earliestDay ? " disabled" : ""}>上 30 天</button>
            <button class="btn" type="button" id="timelineToday">回到今天</button>
            <button class="btn" type="button" id="timelineNext"${minDay >= latestStart ? " disabled" : ""}>下 30 天</button>
            <span class="timeline-window-hint">固定显示 30 天，可翻页查看其他日期。仅显示未完成订单，条形按窗口裁切，不改变真实日期或完成状态。</span>
          </div>
          <div class="panel-body timeline">
            <div class="timeline-row timeline-header">
              <div class="timeline-title">订单 / 日期</div>
              <div class="timeline-dates">${dates}</div>
            </div>
            ${ranges.length ? ranges.map(({ order, start, end, issue }) => {
              const late = !issue && end < todayDay;
              const outside = issue ? `日期待核对：${issue}`
                : end < minDay ? (late ? "已逾期未完成 · 排期在窗口之前" : "排期在窗口之前")
                : start > maxDay ? "排期在窗口之后" : "";
              const clippedStart = Math.max(start, minDay);
              const clippedEnd = Math.min(end, maxDay);
              const left = (clippedStart - minDay) * 46;
              const width = (clippedEnd - clippedStart + 1) * 46;
              const classes = ["bar", start < minDay ? "is-clipped-start" : "", end > maxDay ? "is-clipped-end" : ""].filter(Boolean).join(" ");
              const rangeTitle = `${order.createdAt || "未填启动日期"} 至 ${order.deadline || "未填交期"} · ${order.status}`;
              const bar = outside ? `<span class="timeline-outside">${esc(outside)}</span>`
