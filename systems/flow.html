    async function exportBackup() {
      if (storageBlocked) {
        alert("当前数据尚未通过校验，已保留浏览器中的原始内容。请勿导出空白备份覆盖旧备份，也不要清理浏览器数据。");
        return;
      }
      await persistState();
      try {
        const payload = { schemaVersion: 8, exportedAt: new Date().toISOString(), orders: state.orders, materials: state.materials, warehouse: state.warehouse };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `跟单系统备份_${todayISO()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        console.error("导出备份失败", error);
        alert("备份生成失败，请关闭其他页面后重试。");
      }
    }

    function importBackup(file) {
      const reader = new FileReader();
      reader.onload = async () => {
        if (warehouseBusy) { alert("有一笔仓储操作正在保存，请稍后重新导入。"); return; }
        const data = safeParse(reader.result, null);
        if (!isValidStateData(data)) {
          alert("备份文件格式不正确。");
          return;
        }
        if (!confirm(`导入将替换当前全部订单、物流包裹和仓储数据。${data.warehouse ? `备份含 ${data.warehouse.items.length} 条库存、${data.warehouse.transactions.length} 笔流水。` : '这是旧版备份，不含库存与出入库流水；导入后仓储台账将为空。'}\n请确认已经导出当前备份。是否继续？`)) return;
        const candidate = {
          orders: data.orders.map(order => normalizeOrder(order, order.type || "sample")),
          materials: data.materials.map(normalizeMaterial),
          warehouse: normalizeWarehouse(data.warehouse)
        };
        upgradeLegacyMaterialLinks(candidate);
        try {
          await persistState();
          setSaveState("正在保存导入备份…");
          if (storageBackend === "indexeddb") {
            await writeIndexedState(candidate);
            const verificationRecord = await readIndexedState();
            const verificationData = verificationRecord && (verificationRecord.data || verificationRecord);
            if (!isValidStateData(verificationData) || verificationData.orders.length !== candidate.orders.length || verificationData.materials.length !== candidate.materials.length || JSON.stringify(verificationData.warehouse) !== JSON.stringify(candidate.warehouse)) {
              throw new Error("导入后的数据库校验失败");
            }
            clearMigratedLocalStorage();
          } else {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(candidate));
            const savedAt = Date.now();
            localStorage.setItem(FALLBACK_MARKER_KEY, String(savedAt));
            lastSavedAt = new Date(savedAt).toISOString();
          }
          applyStateData(candidate);
          storageBlocked = false;
          legacyReadError = null;
          document.querySelectorAll("[data-storage-disabled]").forEach(button => { button.disabled = false; button.removeAttribute("data-storage-disabled"); });
          loadedSchemaVersion = 8;
          selectedId = null;
          saveVersion += 1;
          savedVersion = saveVersion;
          savePending = false;
          setStorageNotice(storageBackend === "localstorage" ? "当前使用普通存储，请定期导出备份。" : "", storageBackend === "localstorage");
          setSaveState("备份已导入并保存");
          render();
        } catch (error) {
          console.error("导入备份失败", error);
          setSaveState("导入备份未成功，请保留备份文件并重试。", true);
          alert("备份无法写入本地数据库，原有数据未改变。请先导出当前备份后再重试。");
        }
      };
      reader.onerror = () => alert("备份文件读取失败，请重新选择。");
      reader.readAsText(file);
    }

    function bindAppShell() {
      document.querySelectorAll(".nav button").forEach(btn => btn.addEventListener("click", () => setView(btn.dataset.view)));
      document.getElementById("newSampleBtn").addEventListener("click", () => createOrder("sample"));
      document.getElementById("newBulkBtn").addEventListener("click", () => createOrder("bulk"));
      document.getElementById("exportBtn").addEventListener("click", exportBackup);
      document.getElementById("closeImageViewer").addEventListener("click", closeImageViewer);
      document.getElementById("downloadViewerImage").addEventListener("click", downloadViewedImage);
      document.getElementById("imageViewer").addEventListener("click", event => {
        if (event.target.id === "imageViewer") closeImageViewer();
      });
      document.addEventListener("keydown", event => {
        const viewer = document.getElementById("imageViewer");
        if (viewer.hidden) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeImageViewer();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = [...viewer.querySelectorAll("button:not(:disabled)")];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      document.getElementById("importInput").addEventListener("change", event => {
        const file = event.target.files[0];
        if (file) importBackup(file);
        event.target.value = "";
      });
    }

    async function initializeApp() {
      view.innerHTML = `<div class="panel"><div class="empty">正在加载本地数据…</div></div>`;
      await initializeStorage();
      if (storageBlocked) {
        bindAppShell();
        document.querySelectorAll(".nav button,#newSampleBtn,#newBulkBtn").forEach(button => { button.disabled = true; button.dataset.storageDisabled = "true"; });
        pageTitle.textContent = "数据读取保护";
        pageHint.textContent = "检测到数据不完整或版本不兼容，原始数据没有被覆盖。";
        view.innerHTML = `<div class="panel"><div class="panel-body"><h2>已暂停写入，保护现有数据</h2><p>请勿清理浏览器缓存，也不要使用旧版文件继续编辑。您可以从顶部导入一份已确认完整的备份，或联系维护人员检查浏览器中的原始数据。</p></div></div>`;
        return;
      }
      const linksUpgraded = upgradeLegacyMaterialLinks();
      if ((storageBackend === "indexeddb" && loadedSchemaVersion < 8) || linksUpgraded) {
        const upgradedSaved = await save(true);
        if (upgradedSaved && storageBackend === "indexeddb") loadedSchemaVersion = 8;
      }
      bindAppShell();
      render();
    }

function whRefreshRecords(){

  const rows=state.warehouse.transactions.filter(tx=>{if(whUI.recordType!=='all'&&tx.type!==whUI.recordType)return false;if(whUI.from&&tx.date<whUI.from)return false;if(whUI.to&&tx.date>whUI.to)return false;const text=[tx.no,tx.date,tx.operator,tx.party,tx.reason,whLinksText(tx.orderLinks),...tx.lines.flatMap(l=>[l.code,l.name,whFind(l.itemId)?.styleNo])].join(' ').toLowerCase();return keywords.every(k=>text.includes(k));}).slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));

function whLineBalance(line,type){const isNew=type==='in'&&line.querySelector('[data-wh-mode]')?.value==='new';const item=isNew?null:whFind(line.dataset.itemId);const amount=Number(line.querySelector('[data-wh-quantity]').value||0);const before=Number(item?.qty||0);const after=whNumber(before+(type==='in'?amount:-amount));const unit=item?.unit||line.querySelector('[data-new=unit]')?.value||'';const box=line.querySelector('[data-wh-balance]');box.classList.toggle('is-negative',after<0);box.innerHTML=item?`<span>现存 <strong>${whQty(before)} ${esc(unit)}</strong></span><span>${type==='in'?'入库后':'出库后'} <strong>${whQty(after)} ${esc(unit)}</strong></span>${after<0?'<span>数量超过可用库存</span>':''}`:isNew?`<span>本次增加 <strong>${whQty(amount)} ${esc(unit)}</strong></span><span>相同档案信息与库位会自动累计</span>`:'请先搜索并选定库存物品。';}
function whReadLine(line,type){const quantity=Number(line.querySelector('[data-wh-quantity]').value);if(!(quantity>0))throw new Error('每项出入库数量必须大于 0。');const isNew=type==='in'&&line.querySelector('[data-wh-mode]')?.value==='new';const result={quantity,sourceItemId:line.dataset.sourceItem||''};if(isNew){const item={};line.querySelectorAll('[data-new]').forEach(input=>item[input.dataset.new]=input.value.trim());item.shelf=Number(item.shelf);item.images=line._whImages||[];if(!item.name||!item.unit)throw new Error('请完整填写物品名称和库存单位。');result.item=item;}else{if(!whFind(line.dataset.itemId))throw new Error('请为每项明细搜索并选择库存物品。');result.itemId=line.dataset.itemId;}return result;}
function whReadImage(file){return new Promise((resolve,reject)=>{if(!/^image\//i.test(file.type||'')){reject(new Error('请选择有效的图片文件。'));return;}if(file.size>25*1024*1024){reject(new Error('单张图片超过 25 MB，请缩小后上传。'));return;}let done=false;const finish=(error,value)=>{if(done)return;done=true;clearTimeout(timer);error?reject(error):resolve(value);};const timer=setTimeout(()=>finish(new Error('图片读取超时，请重新选择。')),15000);const reader=new FileReader();reader.onerror=()=>finish(new Error('图片读取失败，请重新选择。'));reader.onload=()=>{const image=new Image();image.onerror=()=>finish(new Error('图片格式无法识别，请换用 JPG 或 PNG。'));image.onload=()=>{try{const scale=Math.min(1,1100/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);finish(null,canvas.toDataURL('image/jpeg',.78));}catch(error){finish(new Error('图片处理失败，请选择其他图片。'));}};image.src=reader.result;};reader.readAsDataURL(file);});}
function whDetails(id){
  const item=whFind(id);if(!item)return;
  const history=state.warehouse.transactions.filter(t=>t.lines.some(l=>l.itemId===id)).slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const fields=[['规格',item.spec],['颜色',item.color],['批次 / 缸号',item.batch],['款式号 / 面料编号',item.styleNo],['尺码',item.size],['供应商',item.supplier],['成分',item.composition],['幅宽',item.width],['克重',item.weight],['卷数（辅助描述）',item.rolls]];
  const dialog=whOpenDialog('库存详情',`<div class="wh-details-summary"><div><span class="wh-code">${esc(item.code)}</span><h3>${esc(item.name)}</h3><span class="wh-meta">${item.area} 区 · ${esc(WH_AREAS[item.area])} · ${item.shelf} 号货架</span></div><div class="wh-details-qty">${whQty(item.qty)}<small>${esc(item.unit)}</small></div></div><div class="wh-actions"><button class="btn primary" type="button" id="whDetailIn">补货入库</button><button class="btn" type="button" id="whDetailOut"${item.qty>0?'':' disabled'}>出库</button><button class="btn" type="button" id="whDetailMove"${item.qty>0?'':' disabled'}>移库</button><button class="btn" type="button" id="whDetailAdjust">盘点调整</button><button class="btn" type="button" id="whDetailPrint">打印标签</button></div><dl class="wh-detail-grid">${fields.map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value||'—')}</dd></div>`).join('')}<div class="wide"><dt>关联订单</dt><dd>${esc(whLinksText(item.orderLinks)||'未关联')}</dd></div><div class="wide"><dt>备注</dt><dd>${esc(item.notes||'—')}</dd></div></dl>${item.images?.length?`<div class="wh-images">${item.images.filter(isAllowedImageSource).map((src,i)=>`<div class="wh-image"><button type="button" data-wh-preview="${i}" aria-label="放大图片 ${i+1}"><img src="${esc(src)}" alt="${esc(item.name)} 图片 ${i+1}"></button><a href="${esc(src)}" download="${esc(item.code)}_${i+1}.jpg">下载图片 ${i+1}</a></div>`).join('')}</div>`:''}<section><h3 style="margin:0 0 12px;font-size:16px">出入库与调整记录</h3><div class="table-wrap"><table class="wh-table" style="min-width:650px"><thead><tr><th>日期 / 单据</th><th>类型</th><th>变化</th><th>结余</th><th>经办 / 用途</th></tr></thead><tbody>${history.slice(0,100).flatMap(tx=>tx.lines.filter(l=>l.itemId===id).map(l=>`<tr><td>${esc(tx.date)}<span class="wh-meta">${esc(tx.no)}</span></td><td>${whTypeNames[tx.type]||esc(tx.type)}</td><td>${l.delta>0?'+':''}${whQty(l.delta)} ${esc(l.unit)}</td><td>${whQty(l.after)} ${esc(l.unit)}</td><td>${esc(tx.operator||'—')}<span class="wh-meta">${esc(tx.reason)}</span></td></tr>`)).join('')||'<tr><td colspan="5">暂无记录</td></tr>'}</tbody></table></div>${history.length>100?'<p class="wh-meta">此处显示最近 100 笔；完整记录可在入库、出库记录中查询。</p>':''}</section>`,'',null);
  dialog.querySelector('#whDetailIn').onclick=()=>whTransactionDialog('in',{itemId:id});dialog.querySelector('#whDetailOut').onclick=()=>warehouseDispatch(id);dialog.querySelector('#whDetailMove').onclick=()=>whAdjustmentDialog(id,'transfer');dialog.querySelector('#whDetailAdjust').onclick=()=>whAdjustmentDialog(id,'adjust');dialog.querySelector('#whDetailPrint').onclick=()=>whPrintLabels([item]);dialog.querySelectorAll('[data-wh-preview]').forEach(button=>button.onclick=()=>whPreviewStockImage(id,Number(button.dataset.whPreview)));
}
function whAdjustmentDialog(id,type){const item=whFind(id);if(!item)return;const move=type==='transfer';const dialog=whOpenDialog(move?'库存移库':'盘点调整',`<div class="wh-help">${esc(item.code)} · ${esc(item.name)} · 当前 ${whQty(item.qty)} ${esc(item.unit)}。${move?'同一物品只能在所属分类区域内移动。':'填写实际清点后的库存数量，系统将自动记录差异。'}</div><div class="wh-grid"><label><span>日期 *</span><input class="input" name="date" type="date" required value="${todayISO()}"></label><label><span>经办人 *</span><input class="input" name="operator" required></label><label><span>${move?'移库数量':'盘点实存'}（${esc(item.unit)}）*</span><input class="input" name="quantity" type="number" inputmode="decimal" min="${move?'0.001':'0'}" step="0.001" required value="${item.qty}"></label>${move?`<label><span>目标区域</span><input class="input" readonly value="${item.area} 区 · ${esc(WH_AREAS[item.area])}"></label><label><span>目标货架 *</span><select class="select" name="shelf">${whShelfOptions(item.area,item.shelf)}</select></label>`:''}<label class="wide"><span>${move?'移库':'调整'}原因 *</span><textarea name="reason" required placeholder="请记录原因，便于后续核对" rows="2"></textarea></label></div>`,move?'确认移库':'确认调整',async form=>{const tx=await warehouseCommit({type,date:form.elements.date.value,operator:form.elements.operator.value.trim(),reason:form.elements.reason.value.trim(),lines:[{itemId:id,quantity:Number(form.elements.quantity.value),area:item.area,shelf:move?Number(form.elements.shelf.value):item.shelf}]});whCloseDialog(true);whNotice(`${move?'移库':'盘点调整'}已保存 · ${tx.no}`);renderMaterials();});}
function whTransactionDetails(id){const tx=state.warehouse.transactions.find(t=>t.id===id);if(!tx)return;const reversed=state.warehouse.transactions.find(t=>t.reversalOf===id);const dialog=whOpenDialog(`${whTypeNames[tx.type]||'库存'}单据`, `<div class="wh-details-summary"><div><span class="wh-code">${esc(tx.no)}</span><h3>${whTypeNames[tx.type]||esc(tx.type)}${reversed?' · 已冲销':''}</h3><span class="wh-meta">${esc(tx.date)} · 经办人 ${esc(tx.operator||'未填写')}</span></div></div><dl class="wh-detail-grid"><div><dt>收发方</dt><dd>${esc(tx.party||'—')}</dd></div><div class="span2"><dt>原因 / 用途</dt><dd>${esc(tx.reason||'—')}</dd></div><div class="wide"><dt>关联订单</dt><dd>${esc(whLinksText(tx.orderLinks)||'未关联')}</dd></div></dl><div class="table-wrap"><table class="wh-table" style="min-width:620px"><thead><tr><th>库存编号</th><th>物品名称</th><th>变化数量</th><th>操作前</th><th>操作后</th></tr></thead><tbody>${tx.lines.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td>${l.delta>0?'+':''}${whQty(l.delta)} ${esc(l.unit)}</td><td>${whQty(l.before)}</td><td>${whQty(l.after)}</td></tr>`).join('')}</tbody></table></div>${!reversed&&tx.type!=='reverse'?'<div class="wh-help">如录入有误，可冲销本单后重新登记。冲销将产生反向库存流水；库存不足等情况会阻止冲销。</div><div><button type="button" class="btn red" id="whReverse">冲销这笔单据</button></div>':reversed?`<div class="wh-help">冲销单号：${esc(reversed.no)}，原记录保留以便追溯。</div>`:''}`,'',null);dialog.querySelector('#whReverse')?.addEventListener('click',()=>{whOpenDialog('冲销单据',`<div class="wh-help">即将冲销 ${esc(tx.no)}。系统将以相反方向调整库存，不会删除原始单据。</div><div class="wh-grid"><label><span>冲销经办人 *</span><input class="input" name="operator" required></label><label class="wide"><span>冲销原因 *</span><textarea name="reason" required rows="3" placeholder="请说明录入错误或撤销原因"></textarea></label></div>`,'确认冲销',async form=>{const reversal=await warehouseReverse(id,form.elements.reason.value.trim(),form.elements.operator.value.trim());whCloseDialog(true);whNotice(`单据已冲销 · ${reversal.no}`);renderMaterials();});});}
function whExportInventory(){const columns=['库存编号','名称','区域','货架','规格','颜色','批次','款式号','尺码','现存数量','单位','供应商','关联订单','备注'];const rows=whInventoryRows().map(i=>[i.code,i.name,WH_AREAS[i.area],i.shelf,i.spec,i.color,i.batch,i.styleNo,i.size,i.qty,i.unit,i.supplier,whLinksText(i.orderLinks),i.notes]);const cell=value=>{let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';};const blob=new Blob(['\uFEFF'+[columns,...rows].map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`库存台账_${todayISO()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);whNotice(`已导出当前筛选下的 ${rows.length} 条库存记录。`);}
function whPrintLabels(items){document.getElementById('whLabelPrint')?.remove();const root=document.createElement('div');root.id='whLabelPrint';root.innerHTML=items.map(item=>`<section class="wh-print-label"><h2>${esc(item.code)}</h2><p><strong>${esc(item.name)}</strong></p><p>${esc([item.spec,item.color,item.size,item.batch].filter(Boolean).join(' · '))}</p><small>${item.area} 区 ${esc(WH_AREAS[item.area])} · ${item.shelf} 号架 · 单位 ${esc(item.unit)}</small></section>`).join('');document.body.appendChild(root);document.body.classList.add('wh-printing');const dialog=document.getElementById('whDialog');const reopen=dialog?.open;if(reopen)dialog.close();const cleanup=()=>{document.body.classList.remove('wh-printing');root.remove();window.removeEventListener('afterprint',cleanup);if(reopen&&dialog.isConnected)dialog.showModal();};window.addEventListener('afterprint',cleanup);window.print();}
function whPreviewStockImage(id,index){const item=whFind(id);const src=item?.images?.filter(isAllowedImageSource)[index];if(!item||!src)return;const dialog=whOpenDialog(`${item.code} · 图片 ${index+1}`,`<img class="wh-preview-image" src="${esc(src)}" alt="${esc(item.name)}"><div class="wh-actions"><button class="btn" type="button" id="whBackDetail">返回库存详情</button><a class="btn" href="${esc(src)}" download="${esc(item.code)}_${index+1}.jpg">下载图片</a></div>`,"",null);dialog.querySelector("#whBackDetail").onclick=()=>whDetails(id);}

/* WAREHOUSE UI END */
    initializeApp();
  </script>
