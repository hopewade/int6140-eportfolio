<!doctype html>
<html lang="zh-CN" data-app="people">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>People OS · 人力资源与薪酬运营</title>
<style>
:root {
  --portfolio-bar-h: 66px;
  --portfolio-brand: #1f2024;
  --portfolio-purple: #7356d8;
}
.portfolio-bar, .portfolio-bar * { box-sizing: border-box; }
.portfolio-bar {
  min-height: var(--portfolio-bar-h);
  display: grid;
  grid-template-columns: minmax(210px, auto) minmax(0, 1fr) auto;
  align-items: center;
  gap: 22px;
  padding: 10px clamp(16px, 2.4vw, 34px);
  position: sticky;
  top: 0;
  z-index: 10000;
  color: #202126;
  background: rgba(255,255,255,.95);
  border-bottom: 1px solid #e5e7eb;
  backdrop-filter: blur(18px);
  font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
.portfolio-identity { min-width:0; display:flex; align-items:center; gap:11px; color:inherit; text-decoration:none; }
.portfolio-identity-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:900; letter-spacing:.08em; background:linear-gradient(135deg,#202126,#7356d8 60%,#57c9d1); box-shadow:0 8px 18px rgba(50,42,82,.17); }
.portfolio-identity-copy strong,.portfolio-identity-copy span { display:block; }
.portfolio-identity-copy strong { color:#202126; font-size:13px; letter-spacing:.08em; line-height:1.25; }
.portfolio-identity-copy span { color:#8a8e96; font-size:10px; margin-top:1px; line-height:1.25; }
.portfolio-projects { min-width:0; display:flex; justify-content:center; align-items:center; gap:7px; }
.portfolio-project-pill { min-height:38px; padding:8px 13px; display:inline-flex; align-items:center; gap:7px; border:1px solid transparent; border-radius:999px; color:#666a73; background:transparent; font-size:12px; font-weight:750; line-height:1; text-decoration:none; white-space:nowrap; }
.portfolio-project-pill:hover { color:#202126; background:#f5f5f4; }
.portfolio-project-pill.active { color:#342a54; border-color:rgba(115,86,216,.11); background:linear-gradient(100deg,rgba(166,128,242,.22),rgba(111,218,230,.18) 58%,rgba(255,211,125,.17)); }
.portfolio-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.portfolio-demo-badge { min-height:30px; padding:6px 10px; display:inline-flex; align-items:center; gap:6px; border-radius:999px; color:#24705b; background:#edf8f3; border:1px solid #d1eade; font-size:10px; font-weight:850; line-height:1; white-space:nowrap; }
.portfolio-demo-badge::before { content:""; width:7px; height:7px; border-radius:50%; background:#27a37d; box-shadow:0 0 0 4px rgba(39,163,125,.10); }
.portfolio-action-btn { min-height:36px; padding:8px 11px; border:1px solid #dedfe3; border-radius:9px; color:#3c3e44; background:#fff; font-size:11px; font-weight:750; line-height:1; cursor:pointer; }
.portfolio-action-btn:hover { border-color:#bfc1c7; background:#fafafa; }
.portfolio-privacy { margin:14px clamp(14px,2.5vw,34px) 0; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid #e7e3f4; border-radius:10px; color:#5f5970; background:linear-gradient(100deg,#f7f4ff,#f1faf8); font:11px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
.portfolio-privacy strong { color:#3f365b; }
.portfolio-guide[hidden] { display:none; }
.portfolio-guide { position:fixed; inset:0; z-index:30000; display:grid; place-items:center; padding:22px; background:rgba(22,23,27,.58); backdrop-filter:blur(8px); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
.portfolio-guide-card { width:min(640px,96vw); max-height:88vh; overflow:auto; border:1px solid rgba(255,255,255,.55); border-radius:20px; background:#fff; box-shadow:0 28px 80px rgba(20,21,25,.28); }
.portfolio-guide-head { padding:21px 22px 17px; display:flex; align-items:flex-start; justify-content:space-between; gap:18px; border-bottom:1px solid #ececef; }
.portfolio-guide-head small { display:block; color:#7356d8; font-size:10px; font-weight:900; letter-spacing:.12em; }
.portfolio-guide-head h2 { margin:5px 0 0; color:#27282d; font-size:23px; line-height:1.25; font-weight:800; }
.portfolio-guide-close { width:34px; height:34px; border:0; border-radius:10px; color:#27282d; background:#f3f3f2; font-size:19px; cursor:pointer; }
.portfolio-guide-body { padding:20px 22px 22px; }
.portfolio-guide-intro { margin:0 0 16px; color:#6e727c; font-size:13px; line-height:1.7; }
.portfolio-guide-steps { display:grid; gap:10px; }
.portfolio-guide-step { width:100%; display:grid; grid-template-columns:34px minmax(0,1fr) auto; align-items:center; gap:12px; padding:13px; border:1px solid #e5e7eb; border-radius:13px; background:#fff; text-align:left; cursor:pointer; }
.portfolio-guide-step:hover { border-color:#cfc5ef; background:#faf9ff; }
.portfolio-guide-index { width:30px; height:30px; display:grid; place-items:center; border-radius:9px; color:#5c41be; background:#f0ebff; font-size:12px; font-weight:900; }
.portfolio-guide-copy strong,.portfolio-guide-copy span { display:block; }
.portfolio-guide-copy strong { color:#27282d; font-size:13px; }
.portfolio-guide-copy span { margin-top:2px; color:#858993; font-size:11px; line-height:1.45; }
.portfolio-guide-arrow { color:#a3a6ad; font-size:17px; }
.portfolio-guide-note { margin-top:15px; padding:12px 13px; border-radius:11px; color:#675d3f; background:#fff8e8; border:1px solid #f2dfb9; font-size:11px; line-height:1.6; }
@media screen and (max-width:960px) {
  .portfolio-bar { grid-template-columns:auto 1fr auto; gap:12px; }
  .portfolio-identity-copy { display:none; }
  .portfolio-projects { justify-content:flex-start; overflow-x:auto; scrollbar-width:none; }
  .portfolio-projects::-webkit-scrollbar { display:none; }
  .portfolio-demo-badge { display:none; }
}
@media screen and (max-width:650px) {
  :root { --portfolio-bar-h:58px; }
  .portfolio-bar { padding:8px 10px; gap:8px; }
  .portfolio-identity-mark { width:36px; height:36px; }
  .portfolio-project-pill { min-height:34px; padding:7px 10px; }
  .portfolio-actions .portfolio-action-btn:first-of-type { display:none; }
  .portfolio-action-btn { padding:7px 9px; }
  .portfolio-privacy { margin:10px 10px 0; align-items:flex-start; flex-direction:column; }
}
@media print { .portfolio-bar,.portfolio-privacy,.portfolio-guide { display:none !important; } }

<script>(function(){
  const guide=document.getElementById("portfolioGuide");
  const open=()=>{guide.hidden=false;document.body.style.overflow="hidden";document.getElementById("closePortfolioGuide")?.focus();};
  const close=()=>{guide.hidden=true;document.body.style.overflow="";};
  document.getElementById("openGuideBtn")?.addEventListener("click",open);
  document.getElementById("closePortfolioGuide")?.addEventListener("click",close);
  guide?.addEventListener("click",e=>{if(e.target===guide)close();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!guide.hidden)close();});
  function clickByText(text){
    const button=[...document.querySelectorAll("button")].find(el=>el.textContent.trim()===text);
    if(button){button.click();setTimeout(()=>document.getElementById("root")?.scrollIntoView({behavior:"smooth",block:"start"}),60);}
  }
  document.querySelectorAll("[data-people-tab]").forEach(btn=>btn.addEventListener("click",()=>{close();clickByText(btn.dataset.peopleTab);}));
  document.getElementById("resetDemoBtn")?.addEventListener("click",()=>{if(confirm("确定恢复 People OS 的初始演示数据吗？")) window.WY_PEOPLE_DEMO?.reset();});
  const key="wy_portfolio_people_guide_seen_v1";
  if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,"1");setTimeout(open,900);}
})();</script>
<script>
(function(){
  var app = document.documentElement.dataset.app || '';
  window.addEventListener('message', function(event){
    var d = event.data || {};
    if (d.source !== 'wy-portfolio-shell') return;
    if (d.action === 'guide') document.getElementById('openGuideBtn')?.click();
    if (d.action === 'reset') document.getElementById('resetDemoBtn')?.click();
  });
  function ready(){
    if (window.__WY_READY_SENT__) return;
    window.__WY_READY_SENT__ = true;
    window.__WY_SEND__ && window.__WY_SEND__('ready', {title:document.title});
  }
  window.addEventListener('load', function(){ setTimeout(ready, app === 'people' ? 650 : 220); });
  setTimeout(ready, app === 'people' ? 1400 : 700);
})();
</script>
